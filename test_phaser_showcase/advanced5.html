<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced4.html">← Advanced 4</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};document.head.appendChild(s)}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 5',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000).setScrollFactor(0);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5).setScrollFactor(0);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}
 const ITEMS=[['スポットライト','spotlight'],['仮想ジョイスティック','joystick'],['マグネット吸引','magnet'],['Shockwave衝撃波','shockwave'],['疑似ライトニング','lightning'],['Sceneオーバーレイ','overlay'],['Procedural迷路','maze'],['Damage Feedback','damage']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 5',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'「こんなことも？」系 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 5 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class Spotlight extends Phaser.Scene{constructor(){super('spotlight')}create(){this.cameras.main.setBackgroundColor('#0b1019');panel(this,'スポットライト','暗い画面の一部だけを照らす表現');for(let i=0;i<28;i++)this.add.rectangle(35+(i%7)*53,170+Math.floor(i/7)*82,36,48,[0x274f45,0x31506a,0x60486d][i%3]);const dark=this.add.rectangle(195,330,390,420,0x000000,.84).setDepth(10);const hole=this.make.graphics({add:false});hole.fillStyle(0xffffff).fillCircle(195,330,78);const mask=hole.createGeometryMask();mask.setInvertAlpha(true);dark.setMask(mask);const ring=this.add.circle(195,330,78,0xffffff,.02).setStrokeStyle(3,0xffe49a,.9).setDepth(11);this.input.on('pointermove',p=>{if(p.y<130)return;hole.clear().fillStyle(0xffffff).fillCircle(p.x,p.y,78);ring.setPosition(p.x,p.y)});note(this,'用途例：探索、注目演出、秘密表示、期待度演出')}}
 class Joystick extends Phaser.Scene{constructor(){super('joystick')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'仮想ジョイスティック','タッチ操作だけで方向入力を作る');const player=this.add.circle(195,230,24,0xffd166).setStrokeStyle(3,0xffffff);const base=this.add.circle(105,430,62,0xffffff,.06).setStrokeStyle(3,0x7f8da6,.5);const knob=this.add.circle(105,430,27,0x55d6be,.9);let vx=0,vy=0,active=false;const reset=()=>{active=false;vx=vy=0;knob.setPosition(105,430)};this.input.on('pointerdown',p=>{if(Phaser.Math.Distance.Between(p.x,p.y,105,430)<90)active=true});this.input.on('pointermove',p=>{if(!active||!p.isDown)return;let dx=p.x-105,dy=p.y-430,d=Math.hypot(dx,dy)||1,m=Math.min(d,52);dx/=d;dy/=d;knob.setPosition(105+dx*m,430+dy*m);vx=dx*150;vy=dy*150});this.input.on('pointerup',reset);this.events.on('update',(_,dt)=>{player.x=Phaser.Math.Clamp(player.x+vx*dt/1000,35,355);player.y=Phaser.Math.Clamp(player.y+vy*dt/1000,150,360)});note(this,'用途例：アクション、探索、キャラ移動、スマホ操作')}}
 class Magnet extends Phaser.Scene{constructor(){super('magnet')}create(){this.cameras.main.setBackgroundColor('#101a1e');panel(this,'マグネット吸引','近づいたアイテムを自動で吸い寄せる');dot(this,'coin',0xffd166,20);const p=this.add.circle(195,350,28,0x55d6be).setStrokeStyle(3,0xffffff).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(x,y));const coins=[];for(let i=0;i<18;i++)coins.push(this.add.image(Phaser.Math.Between(55,335),Phaser.Math.Between(170,490),'coin'));let score=0;const tx=this.add.text(195,135,'GET 0',{fontSize:'16px'}).setOrigin(.5);this.events.on('update',(_,dt)=>{coins.forEach(c=>{if(!c.active)return;const d=Phaser.Math.Distance.Between(c.x,c.y,p.x,p.y);if(d<125){const a=Phaser.Math.Angle.Between(c.x,c.y,p.x,p.y),sp=(140-d)*2.2;c.x+=Math.cos(a)*sp*dt/1000;c.y+=Math.sin(a)*sp*dt/1000}if(d<28){c.destroy();score++;tx.setText('GET '+score)}})});note(this,'用途例：コイン回収、報酬吸引、アイテム獲得演出')}}
 class Shockwave extends Phaser.Scene{constructor(){super('shockwave')}create(){this.cameras.main.setBackgroundColor('#171520');panel(this,'Shockwave衝撃波','円を急拡大させて「衝撃」を見せる');const core=this.add.circle(195,320,38,0xff6b6b).setInteractive();this.add.text(195,430,'中央をタップ',{fontSize:'16px'}).setOrigin(.5);core.on('pointerdown',()=>{for(let i=0;i<3;i++){const r=this.add.circle(195,320,40,0xffffff,0).setStrokeStyle(6-i*1.5,[0xffffff,0x8fd3ff,0xffd166][i],.9);this.tweens.add({targets:r,scale:4.6,alpha:0,duration:520+i*130,delay:i*70,ease:'Quad.easeOut',onComplete:()=>r.destroy()})}this.cameras.main.shake(180,.012);this.tweens.add({targets:core,scale:1.7,duration:110,yoyo:true})});note(this,'用途例：爆発、大当たり、必殺技、画面破壊演出')}}
 class Lightning extends Phaser.Scene{constructor(){super('lightning')}create(){this.cameras.main.setBackgroundColor('#090d16');panel(this,'疑似ライトニング','ランダム折れ線で毎回違う稲妻を生成');const g=this.add.graphics();const flash=()=>{g.clear();let x=195,y=170;g.lineStyle(7,0x7ab8ff,.28);g.beginPath().moveTo(x,y);for(let i=0;i<9;i++){x+=Phaser.Math.Between(-35,35);y+=35;g.lineTo(x,y)}g.strokePath();g.lineStyle(2,0xffffff,1);x=195;y=170;g.beginPath().moveTo(x,y);for(let i=0;i<9;i++){x+=Phaser.Math.Between(-35,35);y+=35;g.lineTo(x,y)}g.strokePath();this.cameras.main.flash(80,160,190,255);this.time.delayedCall(120,()=>g.clear())};this.time.addEvent({delay:850,loop:true,callback:flash});this.add.text(195,500,'自動生成中',{fontSize:'15px'}).setOrigin(.5);note(this,'用途例：雷、電撃、覚醒、ジャックポット告知')}}
 class Overlay extends Phaser.Scene{constructor(){super('overlay')}create(){this.cameras.main.setBackgroundColor('#142033');panel(this,'Sceneオーバーレイ','ゲーム画面を残したまま別UIを上に重ねる');const world=this.add.container();for(let i=0;i<12;i++)world.add(this.add.circle(45+(i%4)*100,185+Math.floor(i/4)*95,24,[0x55d6be,0x4ea5d9,0xffd166][i%3]));this.tweens.add({targets:world,angle:360,duration:10000,repeat:-1});let open=false,shade=null,box=null;const btn=this.add.rectangle(195,500,170,44,0x293852).setInteractive();const bt=this.add.text(195,500,'OPEN MENU',{fontSize:'15px'}).setOrigin(.5);btn.on('pointerdown',()=>{open=!open;if(open){shade=this.add.rectangle(195,330,390,420,0x000000,.65).setDepth(50);box=this.add.container(195,315).setDepth(51);box.add([this.add.rectangle(0,0,280,180,0x1d2a3f).setStrokeStyle(2,0xffffff),this.add.text(0,-45,'OVERLAY MENU',{fontSize:'22px'}).setOrigin(.5),this.add.text(0,20,'背後のSceneは残ったまま',{fontSize:'13px',color:'#aebbd2'}).setOrigin(.5)]);bt.setText('CLOSE MENU')}else{shade?.destroy();box?.destroy(true);bt.setText('OPEN MENU')}});note(this,'用途例：ポーズ、設定、所持品、説明パネル')}}
 class Maze extends Phaser.Scene{constructor(){super('maze')}create(){this.cameras.main.setBackgroundColor('#101720');panel(this,'Procedural迷路','ルールから毎回違う迷路風マップを生成');const g=this.add.graphics();const draw=()=>{g.clear();const cols=11,rows=9,sz=28,ox=41,oy=165;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const wall=Math.random()<.36||x===0||y===0||x===cols-1||y===rows-1;g.fillStyle(wall?0x33455f:0x162333,1).fillRect(ox+x*sz,oy+y*sz,sz-2,sz-2)}};draw();const b=this.add.rectangle(195,485,180,44,0x293852).setInteractive();this.add.text(195,485,'REGENERATE',{fontSize:'14px'}).setOrigin(.5);b.on('pointerdown',draw);note(this,'用途例：ローグライク、マップ、ダンジョン、ランダム盤面')}}
 class Damage extends Phaser.Scene{constructor(){super('damage')}create(){this.cameras.main.setBackgroundColor('#1a1518');panel(this,'Damage Feedback','被弾を複数演出で同時に伝える');let hp=100;const p=this.add.rectangle(195,300,90,90,0x55d6be).setStrokeStyle(3,0xffffff).setInteractive();const barBg=this.add.rectangle(195,440,260,24,0x2d3038);const bar=this.add.rectangle(65,440,260,20,0x66d17a).setOrigin(0,.5);const tx=this.add.text(195,480,'HP 100',{fontSize:'18px'}).setOrigin(.5);const hurt=()=>{hp-=Phaser.Math.Between(7,18);if(hp<=0)hp=100;bar.width=2.6*hp;tx.setText('HP '+hp);p.setFillStyle(0xffffff);this.time.delayedCall(80,()=>p.setFillStyle(0x55d6be));this.cameras.main.shake(120,.014);this.cameras.main.flash(90,255,50,50);const n=this.add.text(p.x,p.y-70,'-'+Phaser.Math.Between(7,18),{fontSize:'24px',color:'#ff7676',fontStyle:'bold'}).setOrigin(.5);this.tweens.add({targets:n,y:n.y-55,alpha:0,duration:600,onComplete:()=>n.destroy()})};p.on('pointerdown',hurt);note(this,'用途例：被弾、失敗、HP減少、危険警告、ボス戦')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Spotlight,Joystick,Magnet,Shockwave,Lightning,Overlay,Maze,Damage]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
