<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 13</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced12.html">← Advanced 12</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.reason?.message||e.reason||'Promise')+'</span>');
function loadScript(src,label,timeout=6000){return new Promise((ok,ng)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(done)return;done=true;s.remove();ng(new Error(label+' timeout'))},timeout);s.src=src;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(timer);window.Phaser?ok():ng(new Error(label+' Phaser未検出'))};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);ng(new Error(label+' error'))};document.head.appendChild(s)})}
async function loadPhaser(){const a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<a.length;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await loadScript(a[i][1],a[i][0]);boot();return}catch(e){console.warn(e)}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}
function boot(){if(booted)return;booted=true;try{const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){const o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 13',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,70,t,{fontSize:'22px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'12px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['ステルス侵入','stealth'],['ミニTD','td'],['ローグアリーナ','rogue'],['ボス回避戦','boss'],['カードバトル','card'],['採掘ループ','mining'],['スロット×バトル','slotbattle'],['サバイバル収集','survival']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 13',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'複数システムを組み合わせた「ゲーム試作」8本',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Stealth extends Phaser.Scene{constructor(){super('stealth')}create(){panel(this,'ステルス侵入','視野・遮蔽物・目的地を組み合わせた侵入ゲーム');this.cameras.main.setBackgroundColor('#10151b');const p=this.add.circle(55,470,13,0xffd166).setInteractive({draggable:true}),goal=this.add.rectangle(335,185,45,45,0x55d6be,.35).setStrokeStyle(2,0x55d6be),walls=[this.add.rectangle(150,300,35,220,0x475569),this.add.rectangle(270,385,35,180,0x475569)],g=this.add.graphics(),guard=this.add.triangle(300,220,-16,-12,18,0,-16,12,0xff6b6b),tx=this.add.text(195,510,'GO TO EXIT',{fontSize:'16px'}).setOrigin(.5);this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,140,520)));let t=0;this.events.on('update',(_,dt)=>{t+=dt*.0015;guard.rotation=Math.sin(t)*1.2;const a=guard.rotation,d=Phaser.Math.Distance.Between(guard.x,guard.y,p.x,p.y),pa=Phaser.Math.Angle.Between(guard.x,guard.y,p.x,p.y),diff=Math.abs(Phaser.Math.Angle.Wrap(pa-a));let blocked=walls.some(w=>Phaser.Geom.Intersects.LineToRectangle(new Phaser.Geom.Line(guard.x,guard.y,p.x,p.y),w.getBounds())),seen=d<190&&diff<.5&&!blocked;g.clear().fillStyle(seen?0xff3333:0xff6b6b,.12).slice(guard.x,guard.y,190,a-.5,a+.5).fillPath();if(seen){tx.setText('DETECTED!').setColor('#ff8f8f');this.cameras.main.shake(60,.005)}else if(Phaser.Geom.Intersects.RectangleToRectangle(p.getBounds(),goal.getBounds()))tx.setText('ESCAPED!').setColor('#8ef0a8');else tx.setText('GO TO EXIT').setColor('#fff')});note(this,'視野判定＋障害物＋ドラッグ移動＋ゴール')}}
class TD extends Phaser.Scene{constructor(){super('td')}create(){panel(this,'ミニTD','敵の進行・射程・自動攻撃・拠点HPを一画面で');this.cameras.main.setBackgroundColor('#102018');const path=this.add.rectangle(195,330,360,70,0x334155),base=this.add.rectangle(350,330,28,110,0x55d6be),tower=this.add.circle(200,240,18,0xffd166),range=this.add.circle(200,240,115,0,0).setStrokeStyle(1,0xffd166,.4),en=[],g=this.add.graphics();let hp=10,score=0,shot=0,tx=this.add.text(20,150,'BASE 10   SCORE 0',{fontSize:'14px'});this.time.addEvent({delay:900,loop:true,callback:()=>{let e=this.add.circle(15,330,11,0xff6b6b);e.hp=2;en.push(e)}});this.events.on('update',(_,dt)=>{shot-=dt;en.forEach(e=>{if(!e.active)return;e.x+=35*dt/1000;if(e.x>335){e.destroy();hp--;tx.setText(`BASE ${hp}   SCORE ${score}`)}});let target=en.filter(e=>e.active&&Phaser.Math.Distance.Between(tower.x,tower.y,e.x,e.y)<115)[0];g.clear();if(target&&shot<=0){shot=360;g.lineStyle(3,0xffd166,.9).lineBetween(tower.x,tower.y,target.x,target.y);target.hp--;if(target.hp<=0){target.destroy();score++;tx.setText(`BASE ${hp}   SCORE ${score}`)}}});note(this,'進行路＋敵スポーン＋射程＋攻撃＋拠点耐久')}}
class Rogue extends Phaser.Scene{constructor(){super('rogue')}create(){panel(this,'ローグアリーナ','移動・自動射撃・敵湧き・経験値の簡易ループ');this.cameras.main.setBackgroundColor('#12151c');const p=this.add.circle(195,350,14,0x55d6be).setInteractive({draggable:true}),en=[],bul=[];let xp=0,level=1,tx=this.add.text(18,145,'LV1  XP0',{fontSize:'14px'});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,25,365),Phaser.Math.Clamp(y,160,520)));this.time.addEvent({delay:700,loop:true,callback:()=>{let side=Math.random()<.5?0:390,e=this.add.circle(side,170+Math.random()*330,9,0xff6b6b);en.push(e)}});this.time.addEvent({delay:400,loop:true,callback:()=>{let target=en.find(e=>e.active);if(!target)return;let a=Phaser.Math.Angle.Between(p.x,p.y,target.x,target.y),b=this.add.circle(p.x,p.y,4,0xffd166);b.vx=Math.cos(a)*6;b.vy=Math.sin(a)*6;bul.push(b)}});this.events.on('update',()=>{en.forEach(e=>{if(!e.active)return;let a=Phaser.Math.Angle.Between(e.x,e.y,p.x,p.y);e.x+=Math.cos(a)*.8;e.y+=Math.sin(a)*.8});bul.forEach(b=>{if(!b.active)return;b.x+=b.vx;b.y+=b.vy;en.forEach(e=>{if(e.active&&Phaser.Math.Distance.Between(b.x,b.y,e.x,e.y)<14){e.destroy();b.destroy();xp++;if(xp>=level*5){level++;xp=0;this.cameras.main.flash(120,80,180,255)}tx.setText(`LV${level}  XP${xp}`)}})})});note(this,'移動＋敵追尾＋自動射撃＋成長＝ローグライトの核')}}
class Boss extends Phaser.Scene{constructor(){super('boss')}create(){panel(this,'ボス回避戦','予告→範囲攻撃→回避→HP管理のボス戦ループ');this.cameras.main.setBackgroundColor('#180f13');const p=this.add.circle(195,470,14,0x55d6be).setInteractive({draggable:true}),boss=this.add.rectangle(195,195,80,55,0xff6b6b),tx=this.add.text(20,145,'HP 5',{fontSize:'15px'});let hp=5;this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,270,520)));this.time.addEvent({delay:1500,loop:true,callback:()=>{let x=50+Math.random()*290,c=this.add.circle(x,400,65,0xff3333,.12).setStrokeStyle(3,0xff5555,.8);this.tweens.add({targets:c,scale:.35,alpha:.5,duration:800,onComplete:()=>{let hit=Phaser.Math.Distance.Between(p.x,p.y,x,400)<55;c.destroy();let boom=this.add.circle(x,400,18,0xffd166);this.tweens.add({targets:boom,scale:4,alpha:0,duration:280,onComplete:()=>boom.destroy()});if(hit){hp--;tx.setText('HP '+hp);this.cameras.main.shake(180,.014)}else this.cameras.main.flash(60,80,200,120)}})}});note(this,'攻撃予告＋回避操作＋被弾判定＋HP')}}
class Card extends Phaser.Scene{constructor(){super('card')}create(){panel(this,'カードバトル','手札・コスト・ダメージ・敵ターンを簡易実装');this.cameras.main.setBackgroundColor('#171421');let energy=3,hp=30,ehp=35,tx=this.add.text(20,145,'YOU 30   EN 3   ENEMY 35',{fontSize:'14px'}),msg=this.add.text(195,430,'CARDを選択',{fontSize:'15px'}).setOrigin(.5);const cards=[['STRIKE',1,7],['HEAVY',2,12],['BURST',3,18]];cards.forEach((c,i)=>{let x=75+i*120,b=this.add.rectangle(x,320,95,140,[0x334155,0x475569,0x5b4d75][i]).setStrokeStyle(2,0xffffff,.4).setInteractive();this.add.text(x,285,c[0],{fontSize:'13px'}).setOrigin(.5);this.add.text(x,330,`COST ${c[1]}\nDMG ${c[2]}`,{fontSize:'12px',align:'center'}).setOrigin(.5);b.on('pointerdown',()=>{if(energy<c[1]||hp<=0||ehp<=0)return;energy-=c[1];ehp=Math.max(0,ehp-c[2]);msg.setText(c[0]+'!');tx.setText(`YOU ${hp}   EN ${energy}   ENEMY ${ehp}`);if(ehp<=0){msg.setText('VICTORY!');return}this.time.delayedCall(500,()=>{let dmg=Phaser.Math.Between(4,8);hp=Math.max(0,hp-dmg);energy=3;tx.setText(`YOU ${hp}   EN ${energy}   ENEMY ${ehp}`);msg.setText(hp>0?'ENEMY -'+dmg+' / YOUR TURN':'DEFEAT')})})});note(this,'手札＋リソース＋ターン制＝カードゲームの骨格')}}
class Mining extends Phaser.Scene{constructor(){super('mining')}create(){panel(this,'採掘ループ','掘る→素材獲得→強化→さらに速く掘る');this.cameras.main.setBackgroundColor('#17130e');let ore=0,power=1,hp=20,tx=this.add.text(20,145,'ORE 0   POWER 1',{fontSize:'14px'}),rock=this.add.circle(195,330,85,0x6b7280).setInteractive(),bar=this.add.rectangle(195,455,260,16,0x1f2937),fill=this.add.rectangle(65,455,260,16,0x55d6be).setOrigin(0,.5),up=this.add.rectangle(195,510,180,38,0x7c2d12).setInteractive();this.add.text(195,510,'UPGRADE 10 ORE',{fontSize:'13px'}).setOrigin(.5);const redraw=()=>fill.width=260*(hp/20);rock.on('pointerdown',()=>{hp-=power;this.cameras.main.shake(35,.004);if(hp<=0){ore+=Phaser.Math.Between(4,7);hp=20;rock.setFillStyle([0x6b7280,0x78716c,0x57534e][Phaser.Math.Between(0,2)]);tx.setText(`ORE ${ore}   POWER ${power}`)}redraw()});up.on('pointerdown',()=>{if(ore>=10){ore-=10;power++;tx.setText(`ORE ${ore}   POWER ${power}`)}});redraw();note(this,'収集→強化→効率化という放置/採掘ゲームの基本ループ')}}
class SlotBattle extends Phaser.Scene{constructor(){super('slotbattle')}create(){panel(this,'スロット×バトル','リール結果を攻撃・回復・必殺へ変換');this.cameras.main.setBackgroundColor('#150e08');let hp=30,ehp=45,rs=[],tx=this.add.text(20,145,'YOU 30   ENEMY 45',{fontSize:'14px'}),msg=this.add.text(195,430,'SPIN! ',{fontSize:'18px'}).setOrigin(.5),sy=['⚔','♥','7'];for(let i=0;i<3;i++){this.add.rectangle(95+i*100,300,82,110,0x181818).setStrokeStyle(3,0xd4af37);rs.push(this.add.text(95+i*100,300,'7',{fontSize:'42px',color:'#ffd166'}).setOrigin(.5))}let btn=this.add.rectangle(195,500,180,42,0x8a4b08).setInteractive();this.add.text(195,500,'SPIN',{fontSize:'16px',fontStyle:'bold'}).setOrigin(.5);btn.on('pointerdown',()=>{if(hp<=0||ehp<=0)return;btn.disableInteractive();let n=0;this.time.addEvent({delay:70,repeat:15,callback:()=>{rs.forEach(r=>r.setText(sy[Phaser.Math.Between(0,2)]));if(++n===16){let v=rs.map(r=>r.text),sevens=v.filter(x=>x==='7').length,swords=v.filter(x=>x==='⚔').length,hearts=v.filter(x=>x==='♥').length;if(sevens===3){ehp=Math.max(0,ehp-25);msg.setText('JACKPOT -25!');this.cameras.main.flash(220,255,220,80)}else{let dmg=swords*5,heal=hearts*3;ehp=Math.max(0,ehp-dmg);hp=Math.min(30,hp+heal);msg.setText(`DMG ${dmg} / HEAL ${heal}`)}if(ehp>0){hp=Math.max(0,hp-Phaser.Math.Between(3,7))}tx.setText(`YOU ${hp}   ENEMY ${ehp}`);if(ehp<=0)msg.setText('VICTORY!');else if(hp<=0)msg.setText('DEFEAT');btn.setInteractive()}}})});note(this,'抽選結果をゲーム戦闘へ接続する遊技機×RPG試作')}}
class Survival extends Phaser.Scene{constructor(){super('survival')}create(){panel(this,'サバイバル収集','移動・資源回収・危険回避・時間制限を統合');this.cameras.main.setBackgroundColor('#102018');let p=this.add.circle(195,360,14,0xffd166).setInteractive({draggable:true}),food=[],haz=[],score=0,time=30,tx=this.add.text(20,145,'FOOD 0   TIME 30',{fontSize:'14px'});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,165,520)));for(let i=0;i<10;i++)food.push(this.add.circle(25+Math.random()*340,180+Math.random()*320,7,0x55d6be));for(let i=0;i<5;i++){let h=this.add.circle(30+Math.random()*330,190+Math.random()*300,10,0xff6b6b);h.vx=-1+Math.random()*2;h.vy=-1+Math.random()*2;haz.push(h)}this.time.addEvent({delay:1000,loop:true,callback:()=>{time--;tx.setText(`FOOD ${score}   TIME ${time}`)}});this.events.on('update',()=>{food.forEach(f=>{if(f.active&&Phaser.Math.Distance.Between(p.x,p.y,f.x,f.y)<22){score++;f.setPosition(25+Math.random()*340,180+Math.random()*320);tx.setText(`FOOD ${score}   TIME ${time}`)}});haz.forEach(h=>{h.x+=h.vx;h.y+=h.vy;if(h.x<15||h.x>375)h.vx*=-1;if(h.y<165||h.y>525)h.vy*=-1;if(Phaser.Math.Distance.Between(p.x,p.y,h.x,h.y)<24){score=Math.max(0,score-1);p.setPosition(195,360);this.cameras.main.shake(100,.01)}})});note(this,'収集＋危険＋制限時間＝サバイバル/スコアアタック')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Stealth,TD,Rogue,Boss,Card,Mining,SlotBattle,Survival]})}catch(e){booted=false;diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}loadPhaser();
</script></body></html>
