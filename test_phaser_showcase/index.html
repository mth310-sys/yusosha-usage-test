<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>遊創舎 Phaser Catalog</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#diag{font-size:11px;padding:5px 8px;background:#172033;color:#8ef0a8}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none;image-rendering:auto}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="diag">診断: HTML OK / Phaser読込中…</div><div id="game"></div></div><script>const diag=document.getElementById('diag');window.addEventListener('error',e=>diag.innerHTML='<span class="ng">診断: ERROR '+String(e.message||'unknown')+'</span>');</script><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" onload="diag.textContent='診断: HTML OK / Phaser OK / 起動中…'" onerror="diag.innerHTML='<span class=ng>診断: Phaser CDN 読込失敗</span>'"></script><script>
const DPR=Math.min(window.devicePixelRatio||1,3),UI_FONT='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif';
const originalTextFactory=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style={}){const t=originalTextFactory.call(this,x,y,text,{fontFamily:UI_FONT,...style});if(t&&t.setResolution)t.setResolution(DPR);return t};
function makeDotTexture(scene,key,color=0xffffff,size=48){if(scene.textures.exists(key))return;const g=scene.make.graphics({x:0,y:0,add:false});g.fillStyle(color,1);g.fillCircle(size/2,size/2,size/2-2);g.lineStyle(3,0xffffff,1);g.strokeCircle(size/2,size/2,size/2-3);g.generateTexture(key,size,size);g.destroy()}
function makeFrameTexture(scene,key,color,scale=1){if(scene.textures.exists(key))return;const s=64,g=scene.make.graphics({x:0,y:0,add:false});g.fillStyle(color,1);g.fillRoundedRect(4,4,s-8,s-8,12);g.fillStyle(0xffffff,1);g.fillCircle(20,24,6*scale);g.fillCircle(44,24,6*scale);g.fillStyle(0x111827,1);g.fillRect(19,43,26,5*scale);g.generateTexture(key,s,s);g.destroy()}
const CATS=[{title:'入力・操作',items:[['タップ移動','tap'],['ドラッグ操作','drag'],['マルチタッチ','multitouch']]},{title:'画像・Sprite',items:[['Sprite表示','sprite'],['Spriteアニメーション','spriteAnim']]},{title:'描画・アニメーション',items:[['Tween演出','tween'],['Path移動','path'],['Mask','mask'],['Depth / レイヤー','depth'],['Container','container'],['RenderTexture','renderTexture']]},{title:'物理・判定',items:[['物理・バウンド','physics'],['衝突判定','collision']]},{title:'演出・カメラ',items:[['パーティクル風演出','particles'],['カメラ演出','camera'],['Blend / 発光','blend']]},{title:'UI・時間',items:[['UIゲージ','gauge'],['Timer','timer']]},{title:'音',items:[['効果音テスト','audio']]},{title:'構成・管理',items:[['Scene切替','sceneDemo'],['データ保存','save']]},{title:'設定・環境',items:[['現在の描画設定','settings']]}];
class MenuScene extends Phaser.Scene{constructor(){super('menu')}create(){const renderer=this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas';diag.textContent=`診断: HTML OK / Phaser OK / Game OK / Retina ${DPR}x / ${renderer}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'遊創舎 Phaser カタログ',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,57,'上下にスライドして機能を選択',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=86;CATS.forEach(cat=>{this.add.text(25,y,cat.title,{fontSize:'13px',fontStyle:'bold',color:'#8fd3ff'});y+=24;cat.items.forEach(it=>{const b=this.add.rectangle(195,y,340,35,0x202d43).setStrokeStyle(1,0x526580).setInteractive();this.add.text(35,y,it[0],{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);b.on('pointerup',()=>{if(!this.dragged)this.scene.start(it[1])});y+=41});y+=5});const bottom=y+35;this.add.text(195,bottom-20,'Phaser 3.90.0 / Catalog',{fontSize:'10px',color:'#71809b'}).setOrigin(.5);this.cameras.main.setBounds(0,0,390,Math.max(600,bottom));this.dragged=false;let startY=0,startScroll=0;this.input.on('pointerdown',p=>{startY=p.y;startScroll=this.cameras.main.scrollY;this.dragged=false});this.input.on('pointermove',p=>{if(!p.isDown)return;const dy=p.y-startY;if(Math.abs(dy)>5)this.dragged=true;this.cameras.main.scrollY=Phaser.Math.Clamp(startScroll-dy,0,Math.max(0,bottom-600))});this.input.on('wheel',(p,g,dx,dy)=>{this.cameras.main.scrollY=Phaser.Math.Clamp(this.cameras.main.scrollY+dy*.5,0,Math.max(0,bottom-600))});this.add.text(372,565,'↕',{fontSize:'18px',color:'#8fd3ff'}).setScrollFactor(0).setDepth(999)}}
class BaseScene extends Phaser.Scene{header(t,d){this.add.text(18,18,'← カタログ',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>this.scene.start('menu')).setDepth(1000);this.add.text(195,70,t,{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}note(s){this.add.text(195,565,s,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}}
class TapScene extends BaseScene{constructor(){super('tap')}create(){this.cameras.main.setBackgroundColor('#10202c');this.header('タップ移動','入力座標へオブジェクトを移動');const p=this.add.circle(195,300,28,0x55d6be).setStrokeStyle(4,0xffffff);this.input.on('pointerdown',q=>{if(q.y>130)this.tweens.add({targets:p,x:q.x,y:q.y,duration:350,ease:'Sine.easeInOut'})});this.note('用途例：ボタン、移動、演出開始')}}
class DragScene extends BaseScene{constructor(){super('drag')}create(){this.cameras.main.setBackgroundColor('#20142a');this.header('ドラッグ操作','指でオブジェクトを直接動かす');[0xff6b6b,0xffd166,0x6bcbef].forEach((c,i)=>{const r=this.add.rectangle(110+i*85,300,64,64,c).setStrokeStyle(3,0xffffff).setInteractive({draggable:true});this.input.setDraggable(r);r.on('drag',(p,x,y)=>{r.x=Phaser.Math.Clamp(x,35,355);r.y=Phaser.Math.Clamp(y,150,530)})});this.note('用途例：配置、カード操作、パズル')}}
class MultiTouchScene extends BaseScene{constructor(){super('multitouch')}create(){this.cameras.main.setBackgroundColor('#102126');this.header('マルチタッチ','複数の指を同時に追跡');this.input.addPointer(2);const dots=[0,1,2].map((_,i)=>this.add.circle(120+i*75,300,28,[0xff6b6b,0xffd166,0x55d6be][i],.9).setVisible(false));const labels=[0,1,2].map((_,i)=>this.add.text(120+i*75,350,'指'+(i+1),{fontSize:'13px'}).setOrigin(.5).setVisible(false));this.events.on('update',()=>{this.input.manager.pointers.slice(0,3).forEach((p,i)=>{const on=p.active&&p.isDown;dots[i].setVisible(on);labels[i].setVisible(on);if(on){dots[i].setPosition(p.x,p.y);labels[i].setPosition(p.x,p.y+42)}})});this.note('2〜3本指で触れて確認 / 用途例：同時ボタン、ジェスチャー')}}
class SpriteScene extends BaseScene{constructor(){super('sprite')}create(){this.cameras.main.setBackgroundColor('#171d2b');this.header('Sprite表示','Textureを使って画像オブジェクトを表示');makeDotTexture(this,'catalogSprite',0x59c3ff,96);const s=this.add.sprite(195,300,'catalogSprite').setInteractive();this.add.text(195,410,'Sprite',{fontSize:'22px'}).setOrigin(.5);s.on('pointerdown',()=>this.tweens.add({targets:s,scale:1.5,angle:'+=180',duration:350,yoyo:true}));this.note('タップ / 実素材ではPNG・JPEG・WebP等をTextureとして使用')}}
class SpriteAnimScene extends BaseScene{constructor(){super('spriteAnim')}create(){this.cameras.main.setBackgroundColor('#211827');this.header('Spriteアニメーション','複数フレームを順番に再生');[['face1',0xff6b6b,.7],['face2',0xffa94d,1],['face3',0x55d6be,1.25],['face4',0x59c3ff,1]].forEach(v=>makeFrameTexture(this,...v));if(!this.anims.exists('catalogBlink'))this.anims.create({key:'catalogBlink',frames:['face1','face2','face3','face4'].map(key=>({key})),frameRate:6,repeat:-1,yoyo:true});this.add.sprite(195,300,'face1').setScale(2).play('catalogBlink');this.add.text(195,430,'4フレームを連続再生',{fontSize:'16px'}).setOrigin(.5);this.note('用途例：キャラ、図柄、ランプ、演出素材')}}
class TweenScene extends BaseScene{constructor(){super('tween')}create(){this.cameras.main.setBackgroundColor('#181b27');this.header('Tween演出','位置・回転・拡大・透明度を滑らかに変化');const s=this.add.star(195,310,5,28,58,0xf7d154).setStrokeStyle(4,0xffffff).setInteractive();s.on('pointerdown',()=>this.tweens.add({targets:s,angle:'+=720',scale:1.7,y:220,alpha:.25,duration:700,ease:'Back.easeInOut',yoyo:true}));this.note('星をタップ / 用途例：告知、UI、役物演出')}}
class PathScene extends BaseScene{constructor(){super('path')}create(){this.cameras.main.setBackgroundColor('#171b25');this.header('Path移動','決めた曲線に沿ってオブジェクトを移動');makeDotTexture(this,'pathDot',0xffd166,36);const path=new Phaser.Curves.Path(55,340);path.cubicBezierTo(335,340,120,150,270,500);const g=this.add.graphics();g.lineStyle(2,0x7f8aa3,.8);path.draw(g,64);const f=this.add.follower(path,55,340,'pathDot');f.startFollow({duration:2500,repeat:-1,yoyo:true,rotateToPath:true});this.note('用途例：弾道、敵移動、演出軌道、UIモーション')}}
class MaskScene extends BaseScene{constructor(){super('mask')}create(){this.cameras.main.setBackgroundColor('#17202b');this.header('Mask','指定した範囲だけを見せる');const shape=this.make.graphics();shape.fillRect(95,210,200,150);const mask=shape.createGeometryMask();const group=this.add.container();for(let i=0;i<8;i++)group.add(this.add.rectangle(80+i*55,285,45,260,i%2?0x58c7f3:0xffcc66));group.setMask(mask);this.tweens.add({targets:group,x:-180,duration:1800,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});this.add.rectangle(195,285,200,150).setStrokeStyle(4,0xffffff);this.note('用途例：リール窓、ゲージ、画面切替')}}
class DepthScene extends BaseScene{constructor(){super('depth')}create(){this.cameras.main.setBackgroundColor('#1a1925');this.header('Depth / レイヤー','重なり順を数値で管理');const a=this.add.rectangle(155,280,130,130,0xe85d75).setDepth(1),b=this.add.rectangle(235,330,130,130,0x4ea5d9).setDepth(2);this.add.text(195,470,'タップで前後を交換',{fontSize:'17px'}).setOrigin(.5);this.input.on('pointerdown',p=>{if(p.y<130)return;const d=a.depth;a.setDepth(b.depth);b.setDepth(d)});this.note('用途例：背景→リール→演出→UI')}}
class ContainerScene extends BaseScene{constructor(){super('container')}create(){this.cameras.main.setBackgroundColor('#18251f');this.header('Container','複数パーツを1つのまとまりとして操作');const c=this.add.container(195,300);c.add([this.add.circle(0,0,60,0x55d6be),this.add.rectangle(0,0,80,24,0x14201d),this.add.text(0,0,'GROUP',{fontSize:'14px'}).setOrigin(.5)]);c.setSize(120,120).setInteractive();c.on('pointerdown',()=>this.tweens.add({targets:c,angle:'+=360',scale:.55,duration:650,yoyo:true}));this.note('タップ / 用途例：複合UI、キャラ、筐体パーツ')}}
class RenderTextureScene extends BaseScene{constructor(){super('renderTexture')}create(){this.cameras.main.setBackgroundColor('#121825');this.header('RenderTexture','指で描いた結果を1枚のTextureに残し続ける');makeDotTexture(this,'rtBrush',0x66e8ff,34);const rt=this.add.renderTexture(45,165,300,315).setOrigin(0);rt.fill(0x18243a);const brush=this.add.image(-100,-100,'rtBrush').setVisible(false);this.add.rectangle(195,322.5,300,315).setStrokeStyle(3,0x8fd3ff);this.add.text(195,145,'↓ 枠の中を指でなぞる ↓',{fontSize:'14px',color:'#8fd3ff'}).setOrigin(.5);const paint=p=>{if(p.x<45||p.x>345||p.y<165||p.y>480)return;brush.setVisible(true).setAlpha(Phaser.Math.FloatBetween(.45,.9)).setScale(Phaser.Math.FloatBetween(.45,1));rt.draw(brush,p.x-45,p.y-165);brush.setVisible(false)};this.input.on('pointerdown',paint);this.input.on('pointermove',p=>{if(p.isDown)paint(p)});const clear=this.add.rectangle(195,515,130,34,0x31486a).setInteractive();this.add.text(195,515,'消去',{fontSize:'14px'}).setOrigin(.5);clear.on('pointerdown',()=>{rt.clear();rt.fill(0x18243a)});this.note('指を離しても描画が残る＝描画結果をTextureとして保持')}}
class PhysicsScene extends BaseScene{constructor(){super('physics')}create(){this.cameras.main.setBackgroundColor('#15231a');this.header('物理・バウンド','重力・速度・壁との反射');this.physics.world.setBounds(15,135,360,390);for(let i=0;i<5;i++){const b=this.add.circle(75+i*60,190+i*16,18,Phaser.Display.Color.RandomRGB(100).color);this.physics.add.existing(b);b.body.setCircle(18).setCollideWorldBounds(true).setBounce(1).setVelocity(Phaser.Math.Between(-180,180),Phaser.Math.Between(-30,80))}this.note('Arcade Physics / 用途例：落下物、簡易アクション')}}
class CollisionScene extends BaseScene{constructor(){super('collision')}create(){this.cameras.main.setBackgroundColor('#211a16');this.header('衝突判定','物体同士が触れたことを検出');const a=this.add.rectangle(80,300,55,55,0xffbd59),b=this.add.rectangle(310,300,55,55,0x5ec8e5);this.physics.add.existing(a);this.physics.add.existing(b);a.body.setVelocityX(130).setBounce(1).setCollideWorldBounds(true);b.body.setVelocityX(-130).setBounce(1).setCollideWorldBounds(true);this.physics.add.collider(a,b,()=>this.cameras.main.flash(100,255,180,80));this.note('接触時にFLASH / 用途例：当たり判定')}}
class ParticlesScene extends BaseScene{constructor(){super('particles')}create(){this.cameras.main.setBackgroundColor('#25151b');this.header('パーティクル風演出','多数の小物体で粒子演出');this.input.on('pointerdown',p=>{if(p.y<130)return;for(let i=0;i<26;i++){const d=this.add.circle(p.x,p.y,Phaser.Math.Between(3,7),Phaser.Display.Color.RandomRGB(140).color),a=Phaser.Math.FloatBetween(0,Math.PI*2),n=Phaser.Math.Between(45,150);this.tweens.add({targets:d,x:p.x+Math.cos(a)*n,y:p.y+Math.sin(a)*n,alpha:0,scale:0,duration:Phaser.Math.Between(350,750),onComplete:()=>d.destroy()})}});this.note('画面タップ / 用途例：火花、紙吹雪、ヒット演出')}}
class CameraScene extends BaseScene{constructor(){super('camera')}create(){this.cameras.main.setBackgroundColor('#101526');this.header('カメラ演出','SHAKE / FLASH / ZOOM');for(let y=170;y<470;y+=70)for(let x=55;x<360;x+=70)this.add.circle(x,y,18,0x4064a8);const mk=(x,l,f)=>{const b=this.add.rectangle(x,510,100,38,0x293a60).setInteractive();this.add.text(x,510,l,{fontSize:'13px'}).setOrigin(.5);b.on('pointerdown',f)};mk(70,'SHAKE',()=>this.cameras.main.shake(350,.025));mk(195,'FLASH',()=>this.cameras.main.flash(350));mk(320,'ZOOM',()=>{this.cameras.main.zoomTo(1.35,250);this.time.delayedCall(500,()=>this.cameras.main.zoomTo(1,250))});this.note('用途例：強演出、衝撃、注目')}}
class BlendScene extends BaseScene{constructor(){super('blend')}create(){this.cameras.main.setBackgroundColor('#050812');this.header('Blend / 発光','加算合成で光が重なる表現');for(let i=0;i<5;i++){const c=this.add.circle(110+i*42,300,48,[0x1677ff,0xff2070,0x27e8a7][i%3],.6).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:c,scale:1.5,alpha:.2,duration:600+i*120,yoyo:true,repeat:-1})}this.note('用途例：LED、オーラ、発光エフェクト')}}
class GaugeScene extends BaseScene{constructor(){super('gauge')}create(){this.cameras.main.setBackgroundColor('#12201c');this.header('UIゲージ','Graphicsで値に応じて表示量を変更');const g=this.add.graphics();let v=65;const draw=()=>{g.clear();g.fillStyle(0x263a34).fillRoundedRect(45,275,300,38,10);g.fillStyle(0x55d6be).fillRoundedRect(45,275,3*v,38,10);this.val.setText(v+'%')};this.val=this.add.text(195,330,'',{fontSize:'22px'}).setOrigin(.5);draw();this.input.on('pointerdown',p=>{if(p.y<130)return;v=Phaser.Math.Between(5,100);draw()});this.note('タップで値変更 / 用途例：HP、期待度、進行度')}}
class TimerScene extends BaseScene{constructor(){super('timer')}create(){this.cameras.main.setBackgroundColor('#191c2a');this.header('Timer','一定間隔・遅延処理を管理');let n=0;const t=this.add.text(195,290,'0',{fontSize:'72px',fontStyle:'bold'}).setOrigin(.5);this.time.addEvent({delay:1000,loop:true,callback:()=>t.setText(++n)});this.note('1秒ごとに加算 / 用途例：ゲーム数、待機、演出タイミング')}}
class AudioScene extends BaseScene{constructor(){super('audio')}create(){this.cameras.main.setBackgroundColor('#171c27');this.header('効果音テスト','Phaserが使うWeb Audio環境で短い音を鳴らす');const status=this.add.text(195,250,'ボタンをタップ',{fontSize:'18px',color:'#c8d0df'}).setOrigin(.5);const b=this.add.rectangle(195,340,230,64,0x3c5f91).setStrokeStyle(2,0xffffff).setInteractive();this.add.text(195,340,'♪ BEEP',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);b.on('pointerdown',()=>{try{const ctx=this.sound.context;if(!ctx){status.setText('Web Audio unavailable');return}const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(660,ctx.currentTime);o.type='sine';g.gain.setValueAtTime(.16,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2);status.setText('再生 OK')}catch(e){status.setText('再生できません')}});this.note('iPhoneではユーザー操作後に音声利用 / 用途例：SE・BGM')}}
class SceneDemo extends BaseScene{constructor(){super('sceneDemo')}create(){this.cameras.main.setBackgroundColor('#13272b');this.header('Scene切替','画面単位でゲームを管理');this.add.text(195,255,'SCENE A',{fontSize:'42px',fontStyle:'bold',color:'#8ef0dd'}).setOrigin(.5);const b=this.add.rectangle(195,390,250,54,0x1f6f78).setInteractive();this.add.text(195,390,'SCENE Bへ',{fontSize:'20px'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start('sceneB'));this.note('用途例：タイトル、通常、ボーナス、設定画面')}}
class SceneB extends BaseScene{constructor(){super('sceneB')}create(){this.cameras.main.setBackgroundColor('#2d1730');this.header('Scene切替','別Sceneへ切り替わった状態');this.add.text(195,255,'SCENE B',{fontSize:'42px',fontStyle:'bold',color:'#ff9de2'}).setOrigin(.5);const b=this.add.rectangle(195,390,250,54,0x823d77).setInteractive();this.add.text(195,390,'SCENE Aへ戻る',{fontSize:'20px'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start('sceneDemo'))}}
class SaveScene extends BaseScene{constructor(){super('save')}create(){this.cameras.main.setBackgroundColor('#1d1b27');this.header('データ保存','ブラウザのlocalStorageへ値を保存');let n=Number(localStorage.getItem('phaserCatalogCount')||0);const t=this.add.text(195,270,'保存値: '+n,{fontSize:'28px'}).setOrigin(.5);const b=this.add.rectangle(195,365,230,52,0x57428a).setInteractive();this.add.text(195,365,'+1して保存',{fontSize:'18px'}).setOrigin(.5);b.on('pointerdown',()=>{n++;localStorage.setItem('phaserCatalogCount',n);t.setText('保存値: '+n)});this.note('ページを閉じても端末側に残る / 用途例：設定・進行状況')}}
class SettingsScene extends BaseScene{constructor(){super('settings')}create(){this.cameras.main.setBackgroundColor('#111827');this.header('現在の描画設定','このカタログ自体が使っている基本設定');const renderer=this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas';[`Phaser 3.90.0`,`Renderer: ${renderer}`,`Retina: ${DPR}x`,`Antialias: ON`,`Pixel Art: OFF`,`Logical Size: 390 × 600`,`Scale: FIT`].forEach((s,i)=>this.add.text(45,175+i*43,s,{fontSize:'18px',color:i<2?'#8fd3ff':'#fff'}));this.note('今後ここに画質・設定比較を追加予定')}}
try{new Phaser.Game({type:Phaser.WEBGL,width:390,height:600,parent:'game',backgroundColor:'#111827',resolution:DPR,antialias:true,antialiasGL:true,pixelArt:false,roundPixels:false,transparent:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},physics:{default:'arcade',arcade:{gravity:{y:300},debug:false}},scene:[MenuScene,TapScene,DragScene,MultiTouchScene,SpriteScene,SpriteAnimScene,TweenScene,PathScene,MaskScene,DepthScene,ContainerScene,RenderTextureScene,PhysicsScene,CollisionScene,ParticlesScene,CameraScene,BlendScene,GaugeScene,TimerScene,AudioScene,SceneDemo,SceneB,SaveScene,SettingsScene]})}catch(e){diag.innerHTML='<span class="ng">診断: Phaser起動 ERROR '+String(e.message||e)+'</span>'}
</script></body></html>
