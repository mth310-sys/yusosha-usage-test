<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>遊創舎 Phaser Showcase</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:min(100vw,390px)}#diag{font-size:11px;padding:5px 8px;background:#172033;color:#8ef0a8}#game{width:100%}canvas{display:block;width:100%!important;height:auto!important;touch-action:none;image-rendering:auto}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="diag">診断: HTML OK / Phaser読込中…</div><div id="game"></div></div><script>const diag=document.getElementById('diag');window.addEventListener('error',e=>diag.innerHTML='<span class="ng">診断: ERROR '+String(e.message||'unknown')+'</span>');</script><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" onload="diag.textContent='診断: HTML OK / Phaser OK / 起動中…'" onerror="diag.innerHTML='<span class=ng>診断: Phaser CDN 読込失敗</span>'"></script><script>
const DPR=Math.min(window.devicePixelRatio||1,3);
const originalTextFactory=Phaser.GameObjects.GameObjectFactory.prototype.text;
Phaser.GameObjects.GameObjectFactory.prototype.text=function(...args){const t=originalTextFactory.apply(this,args);if(t&&t.setResolution)t.setResolution(DPR);return t};
class MenuScene extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`診断: HTML OK / Phaser OK / Game OK / Retina ${DPR}x`;this.cameras.main.setBackgroundColor('#111827');this.add.text(195,38,'遊創舎 Phaser 展示場',{fontSize:'26px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);this.add.text(195,70,'触って「何ができるか」を確認',{fontSize:'14px',color:'#b7c0d8'}).setOrigin(.5);const items=[['1. タップ移動','tap'],['2. ドラッグ操作','drag'],['3. Tween演出','tween'],['4. 物理・バウンド','physics'],['5. パーティクル風演出','particles'],['6. カメラ演出','camera'],['7. Scene切替','sceneDemo']];items.forEach((it,i)=>{const y=120+i*59,b=this.add.rectangle(195,y,330,46,0x243047).setStrokeStyle(2,0x556987).setInteractive();this.add.text(195,y,it[0],{fontSize:'17px',color:'#fff'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start(it[1]))});this.add.text(195,568,'Phaser 3.90.0 / stable + diagnostics',{fontSize:'12px',color:'#7f8aa3'}).setOrigin(.5)}}
class BaseScene extends Phaser.Scene{header(t,d){this.add.text(18,18,'← 戻る',{fontSize:'16px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>this.scene.start('menu')).setDepth(1000);this.add.text(195,70,t,{fontSize:'24px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);this.add.text(195,102,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}}
class TapScene extends BaseScene{constructor(){super('tap')}create(){this.cameras.main.setBackgroundColor('#10202c');this.header('タップ移動','画面をタップするとキャラがその場所へ移動');const p=this.add.circle(195,300,28,0x55d6be).setStrokeStyle(4,0xffffff);this.add.text(195,500,'好きな場所をタップ',{fontSize:'18px',color:'#fff'}).setOrigin(.5);this.input.on('pointerdown',q=>{if(q.y<130)return;this.tweens.add({targets:p,x:q.x,y:q.y,duration:350,ease:'Sine.easeInOut'})})}}
class DragScene extends BaseScene{constructor(){super('drag')}create(){this.cameras.main.setBackgroundColor('#20142a');this.header('ドラッグ操作','3つのブロックを指でつかんで動かせる');[0xff6b6b,0xffd166,0x6bcbef].forEach((c,i)=>{const r=this.add.rectangle(110+i*85,300,64,64,c).setStrokeStyle(3,0xffffff).setInteractive({draggable:true});this.input.setDraggable(r);r.on('drag',(p,x,y)=>{r.x=Phaser.Math.Clamp(x,35,355);r.y=Phaser.Math.Clamp(y,150,550)})})}}
class TweenScene extends BaseScene{constructor(){super('tween')}create(){this.cameras.main.setBackgroundColor('#181b27');this.header('Tween演出','位置・回転・拡大・透明度を時間で滑らかに変化');const s=this.add.star(195,310,5,28,58,0xf7d154).setStrokeStyle(4,0xffffff).setInteractive();this.add.text(195,500,'星をタップ',{fontSize:'18px',color:'#fff'}).setOrigin(.5);s.on('pointerdown',()=>this.tweens.add({targets:s,angle:'+=720',scale:1.7,y:220,alpha:.25,duration:700,ease:'Back.easeInOut',yoyo:true}))}}
class PhysicsScene extends BaseScene{constructor(){super('physics')}create(){this.cameras.main.setBackgroundColor('#15231a');this.header('物理・バウンド','重力・速度・壁との反射をPhaser側で処理');this.physics.world.setBounds(15,135,360,430);const a=[];for(let i=0;i<5;i++){const b=this.add.circle(75+i*60,190+i*16,18,Phaser.Display.Color.RandomRGB(100).color);this.physics.add.existing(b);b.body.setCircle(18).setCollideWorldBounds(true).setBounce(1,1).setVelocity(Phaser.Math.Between(-180,180),Phaser.Math.Between(-30,80));a.push(b)}this.add.text(195,530,'画面タップ → 全ボールを上へ',{fontSize:'15px',color:'#fff'}).setOrigin(.5);this.input.on('pointerdown',p=>{if(p.y<130)return;a.forEach(b=>b.body.setVelocityY(Phaser.Math.Between(-420,-260)))})}}
class ParticlesScene extends BaseScene{constructor(){super('particles')}create(){this.cameras.main.setBackgroundColor('#25151b');this.header('パーティクル風演出','タップ地点から多数の小さな物体を飛ばす');this.add.text(195,300,'画面をタップ',{fontSize:'22px',color:'#fff'}).setOrigin(.5);this.input.on('pointerdown',p=>{if(p.y<130)return;for(let i=0;i<26;i++){const d=this.add.circle(p.x,p.y,Phaser.Math.Between(3,7),Phaser.Display.Color.RandomRGB(140).color),a=Phaser.Math.FloatBetween(0,Math.PI*2),n=Phaser.Math.Between(45,150);this.tweens.add({targets:d,x:p.x+Math.cos(a)*n,y:p.y+Math.sin(a)*n,alpha:0,scale:0,duration:Phaser.Math.Between(350,750),onComplete:()=>d.destroy()})}})}}
class CameraScene extends BaseScene{constructor(){super('camera')}create(){this.cameras.main.setBackgroundColor('#101526');this.header('カメラ演出','SHAKE / FLASH / ZOOMを試す');for(let y=170;y<520;y+=70)for(let x=55;x<360;x+=70)this.add.circle(x,y,18,(x+y)%140?0x4064a8:0xf78c6b);const mk=(x,l,f)=>{const b=this.add.rectangle(x,545,100,38,0x293a60).setStrokeStyle(2,0xffffff).setInteractive();this.add.text(x,545,l,{fontSize:'13px',color:'#fff'}).setOrigin(.5);b.on('pointerdown',f)};mk(70,'SHAKE',()=>this.cameras.main.shake(350,.025));mk(195,'FLASH',()=>this.cameras.main.flash(350,255,255,255));mk(320,'ZOOM',()=>{this.cameras.main.zoomTo(1.35,250);this.time.delayedCall(500,()=>this.cameras.main.zoomTo(1,250))})}}
class SceneDemo extends BaseScene{constructor(){super('sceneDemo')}create(){this.cameras.main.setBackgroundColor('#13272b');this.header('Scene切替','画面単位で管理できる');this.add.text(195,255,'SCENE A',{fontSize:'42px',fontStyle:'bold',color:'#8ef0dd'}).setOrigin(.5);const b=this.add.rectangle(195,390,250,54,0x1f6f78).setInteractive();this.add.text(195,390,'SCENE Bへ',{fontSize:'20px',color:'#fff'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start('sceneB'))}}
class SceneB extends BaseScene{constructor(){super('sceneB')}create(){this.cameras.main.setBackgroundColor('#2d1730');this.header('Scene切替','別Sceneへ切り替わった状態');this.add.text(195,255,'SCENE B',{fontSize:'42px',fontStyle:'bold',color:'#ff9de2'}).setOrigin(.5);const b=this.add.rectangle(195,390,250,54,0x823d77).setInteractive();this.add.text(195,390,'SCENE Aへ戻る',{fontSize:'20px',color:'#fff'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start('sceneDemo'))}}
try{new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#111827',resolution:DPR,antialias:true,antialiasGL:true,pixelArt:false,roundPixels:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},physics:{default:'arcade',arcade:{gravity:{y:300},debug:false}},scene:[MenuScene,TapScene,DragScene,TweenScene,PhysicsScene,ParticlesScene,CameraScene,SceneDemo,SceneB]})}catch(e){diag.innerHTML='<span class="ng">診断: Phaser起動 ERROR '+String(e.message||e)+'</span>'}
</script></body></html>
