<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>遊創舎 Phaser Showcase</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#wrap{width:min(100vw,390px);min-height:100vh;background:#111827}
#status{padding:14px 12px;font-size:14px;line-height:1.5;background:#172033;color:#dbe7ff;border-bottom:1px solid #31405f}
#game{width:100%}
canvas{display:block;width:100%!important;height:auto!important;touch-action:none}
.ok{color:#8ef0a8}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap">
  <div id="status">HTML表示 OK<br>Phaserを読み込み中…</div>
  <div id="game"></div>
</div>
<script>
(function(){
  const status=document.getElementById('status');
  window.addEventListener('error',function(e){
    status.innerHTML='<span class="ng">JavaScript ERROR</span><br>'+String(e.message||e.error||'unknown error');
  });
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
  script.onload=function(){
    status.innerHTML='<span class="ok">HTML表示 OK / Phaser読込 OK</span><br>Canvas起動中…';
    try{
      class MainScene extends Phaser.Scene{
        constructor(){super('main')}
        create(){
          status.innerHTML='<span class="ok">診断 OK：Phaser + Canvas 起動成功</span><br>黄色い四角をタップしてください';
          this.cameras.main.setBackgroundColor('#101820');
          this.add.text(195,60,'遊創舎 Phaser 診断版',{fontSize:'25px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5);
          this.add.text(195,100,'iPhone表示問題 切り分け中',{fontSize:'14px',color:'#b7c0d8'}).setOrigin(.5);
          const box=this.add.rectangle(195,280,120,120,0xf2c94c).setStrokeStyle(4,0xffffff).setInteractive();
          const msg=this.add.text(195,390,'黄色い四角をタップ',{fontSize:'18px',color:'#ffffff'}).setOrigin(.5);
          box.on('pointerdown',()=>{
            msg.setText('タップ入力 OK');
            this.tweens.add({targets:box,angle:'+=180',scale:1.2,duration:220,yoyo:true,ease:'Sine.easeInOut'});
          });
          this.add.text(195,520,'Renderer: CANVAS',{fontSize:'14px',color:'#9fb0cc'}).setOrigin(.5);
        }
      }
      new Phaser.Game({
        type:Phaser.CANVAS,
        width:390,
        height:560,
        parent:'game',
        backgroundColor:'#101820',
        scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},
        scene:[MainScene]
      });
    }catch(err){
      status.innerHTML='<span class="ng">Phaser起動 ERROR</span><br>'+String(err&&err.message?err.message:err);
    }
  };
  script.onerror=function(){
    status.innerHTML='<span class="ng">Phaser CDN 読込失敗</span><br>HTML自体は表示できています';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
