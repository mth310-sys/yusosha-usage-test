<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 18</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced17.html">← Advanced 17</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR '+String(e.message||e.error||e)+'</span>');window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR '+String(e.reason?.message||e.reason||e)+'</span>');
function loadScript(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),done=false,t=setTimeout(()=>{if(!done){done=true;s.remove();ng(new Error('timeout'))}},to);s.src=src;s.onload=()=>{if(!done){done=true;clearTimeout(t);window.Phaser?ok():ng(new Error('missing'))}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);ng(new Error('load'))}};document.head.appendChild(s)})}
async function load(){const src=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<src.length;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${src[i][0]}…`;try{await loadScript(src[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗 / 再読込してください</span>'}
function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 18',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000).setScrollFactor(0);s.add.text(195,68,t,{fontSize:'21px',fontStyle:'bold'}).setOrigin(.5).setScrollFactor(0);s.add.text(195,100,d,{fontSize:'11px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0);
const I=[['入力バッファ','buffer'],['ヒットストップ','hitstop'],['カメラ・デッドゾーン','deadzone'],['LOD描画切替','lod'],['チャンク式ワールド','chunks'],['難易度ディレクター','director'],['予測＋補正','prediction'],['セーブデータ移行','migration']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'Phaser Advanced 18',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,58,'実ゲーム運用で効くランタイム技術 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=99;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Buffer extends Phaser.Scene{constructor(){super('buffer')}create(){panel(this,'入力バッファ','少し早く押した入力を保存して、受付可能になった瞬間に実行');this.cameras.main.setBackgroundColor('#101722');let p=this.add.rectangle(195,330,55,80,0x55d6be),state='READY',queued=false,cool=0;this.txt=this.add.text(195,150,'READY',{fontSize:'18px'}).setOrigin(.5);let btn=this.add.text(195,485,'ATTACK',{fontSize:'20px',backgroundColor:'#36455d',padding:{x:25,y:12}}).setOrigin(.5).setInteractive();btn.on('pointerdown',()=>{if(cool<=0)this.attack(p);else{queued=true;this.txt.setText('BUFFERED!')}});this.attack=o=>{cool=650;queued=false;state='ATTACK';this.txt.setText('ATTACK');this.tweens.add({targets:o,x:265,duration:120,yoyo:true});this.time.delayedCall(350,()=>state='RECOVERY')};this.events.on('update',(_,dt)=>{cool-=dt;if(cool<=0&&queued)this.attack(p);if(cool<=0&&state!=='READY'){state='READY';this.txt.setText('READY')}});note(this,'アクションゲームで「押したのに出ない」を減らす定番の仕組み')}}
class Hitstop extends Phaser.Scene{constructor(){super('hitstop')}create(){panel(this,'ヒットストップ','攻撃が当たった瞬間だけ時間を止めて重さを出す');this.cameras.main.setBackgroundColor('#16131b');let a=this.add.rectangle(95,330,45,70,0x55d6be),b=this.add.rectangle(285,330,45,70,0xff6b6b),busy=false;let btn=this.add.text(195,485,'HIT!',{fontSize:'20px',backgroundColor:'#5a293d',padding:{x:25,y:12}}).setOrigin(.5).setInteractive();btn.on('pointerdown',()=>{if(busy)return;busy=true;this.tweens.add({targets:a,x:245,duration:230,onComplete:()=>{this.tweens.pauseAll();this.cameras.main.shake(90,.012);this.time.delayedCall(110,()=>{this.tweens.resumeAll();this.tweens.add({targets:a,x:95,duration:260});this.tweens.add({targets:b,x:315,duration:120,yoyo:true,onComplete:()=>busy=false})})}})});note(this,'見た目は数十〜百数十ms止めるだけでも手応えが大きく変わる')}}
class Deadzone extends Phaser.Scene{constructor(){super('deadzone')}create(){panel(this,'カメラ・デッドゾーン','キャラが中央付近を動く間はカメラを動かさず、端で追従');this.cameras.main.setBackgroundColor('#102018');this.cameras.main.setBounds(0,0,1200,600);for(let x=0;x<1200;x+=80)this.add.rectangle(x,330,50,50,x%160?0x315c43:0x426f54);let p=this.add.circle(195,330,16,0xffd166).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,1180),330));this.cameras.main.startFollow(p,true,.1,.1);this.cameras.main.setDeadzone(120,160);let z=this.add.rectangle(195,330,120,160,0xffffff,0).setStrokeStyle(1,0xffffff,.45).setScrollFactor(0);note(this,'デッドゾーン内では画面が揺れず、移動が見やすくなる')}}
class LOD extends Phaser.Scene{constructor(){super('lod')}create(){panel(this,'LOD描画切替','遠い物体を簡略化して描画コストを下げる考え方');this.cameras.main.setBackgroundColor('#111827');let player=this.add.circle(195,330,15,0xffd166).setInteractive({draggable:true});this.input.setDraggable(player);this.input.on('drag',(q,o,x,y)=>o.setPosition(x,y));this.ob=[];for(let i=0;i<70;i++){let o=this.add.container(20+Math.random()*350,150+Math.random()*360),detail=this.add.rectangle(0,0,16,16,0x55d6be).setStrokeStyle(2,0xffffff,.5),dot=this.add.circle(0,0,3,0x55d6be);o.add([detail,dot]);o.detail=detail;o.dot=dot;this.ob.push(o)}this.info=this.add.text(20,130,'',{fontSize:'12px'});this.events.on('update',()=>{let near=0;this.ob.forEach(o=>{let d=Phaser.Math.Distance.Between(player.x,player.y,o.x,o.y),n=d<135;o.detail.visible=n;o.dot.visible=!n;if(n)near++});this.info.setText(`詳細描画 ${near} / 簡略描画 ${this.ob.length-near}`)});note(this,'3Dだけでなく2Dでも大量配置時の最適化に使える')}}
class Chunks extends Phaser.Scene{constructor(){super('chunks')}create(){panel(this,'チャンク式ワールド','巨大マップ全部ではなく、近くの区画だけ生成・表示');this.cameras.main.setBackgroundColor('#0f1720');this.world=2400;this.cameras.main.setBounds(0,0,this.world,600);let p=this.add.circle(195,330,15,0xffd166).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,this.world-20),330));this.cameras.main.startFollow(p,true,.12,.12);this.loaded=new Map();this.info=this.add.text(20,130,'',{fontSize:'12px'}).setScrollFactor(0);this.events.on('update',()=>{let c=Math.floor(p.x/300);for(let k=c-1;k<=c+1;k++)if(k>=0&&!this.loaded.has(k)){let arr=[];for(let i=0;i<12;i++)arr.push(this.add.rectangle(k*300+20+Math.random()*260,180+Math.random()*300,15,15,0x4f7a61));this.loaded.set(k,arr)}for(const[k,arr]of this.loaded)arr.forEach(o=>o.visible=Math.abs(k-c)<=1);this.info.setText(`現在チャンク ${c} / 近傍3区画を表示`)});note(this,'オープンワールド風構成でメモリ使用量を抑える基本発想')}}
class Director extends Phaser.Scene{constructor(){super('director')}create(){panel(this,'難易度ディレクター','プレイヤーの成績を見て敵の出現ペースを自動調整');this.cameras.main.setBackgroundColor('#16131b');this.score=0;this.miss=0;this.en=[];this.info=this.add.text(20,130,'',{fontSize:'12px'});this.spawn=()=>{let e=this.add.circle(30+Math.random()*330,180+Math.random()*300,13,0xff6b6b).setInteractive();e.life=2200;e.on('pointerdown',()=>{if(e.active){this.score++;e.destroy()}});this.en.push(e)};this.timer=this.time.addEvent({delay:900,loop:true,callback:this.spawn});this.events.on('update',(_,dt)=>{this.en=this.en.filter(e=>{if(!e.active)return false;e.life-=dt;if(e.life<=0){this.miss++;e.destroy();return false}return true});let perf=this.score-this.miss,delay=Phaser.Math.Clamp(1000-perf*45,350,1300);this.timer.delay=delay;this.info.setText(`HIT ${this.score} / MISS ${this.miss} / 出現間隔 ${Math.round(delay)}ms`)});note(this,'上手いほど少し厳しく、苦戦中は少し緩める自動調整')}}
class Prediction extends Phaser.Scene{constructor(){super('prediction')}create(){panel(this,'予測＋補正','通信遅延を想定し、まず予測表示→後から正解位置へ補正');this.cameras.main.setBackgroundColor('#101722');let actual=this.add.circle(100,330,16,0x55d6be),pred=this.add.circle(100,330,11,0xffd166,.65),target=100;this.add.text(20,145,'緑＝確定 / 黄＝予測',{fontSize:'12px'});this.input.on('pointerdown',p=>{target=Phaser.Math.Clamp(p.x,30,360);pred.x=target;this.time.delayedCall(450,()=>{actual.x=target;this.tweens.add({targets:pred,x:actual.x,duration:100})})});this.events.on('update',()=>{actual.y=330;pred.y=330});note(this,'オンラインゲームのクライアント予測・補正の考え方を簡略化')}}
class Migration extends Phaser.Scene{constructor(){super('migration')}create(){panel(this,'セーブデータ移行','ゲーム更新で保存形式が変わっても旧データを新形式へ変換');this.cameras.main.setBackgroundColor('#131923');let out=this.add.text(195,270,'未作成',{fontSize:'14px',align:'center',wordWrap:{width:330}}).setOrigin(.5),legacy={version:1,coin:120,lv:3};let b1=this.add.text(115,440,'旧データ',{fontSize:'15px',backgroundColor:'#334155',padding:{x:14,y:9}}).setOrigin(.5).setInteractive(),b2=this.add.text(275,440,'移行する',{fontSize:'15px',backgroundColor:'#315b4a',padding:{x:14,y:9}}).setOrigin(.5).setInteractive();b1.on('pointerdown',()=>out.setText(JSON.stringify(legacy,null,2)));b2.on('pointerdown',()=>{let newer=legacy.version===1?{version:2,coins:legacy.coin,level:legacy.lv,settings:{sound:true}}:legacy;out.setText('v1 → v2\n'+JSON.stringify(newer,null,2))});note(this,'長く運営するゲームでは「昔のセーブを壊さない」仕組みが重要')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#0d1422',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Menu,Buffer,Hitstop,Deadzone,LOD,Chunks,Director,Prediction,Migration]})}load();
</script></body></html>
