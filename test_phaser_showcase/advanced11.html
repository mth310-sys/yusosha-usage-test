<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 11</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced10.html">← Advanced 10</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>const diag=document.getElementById('diag');let booted=false;function ls(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}function boot(){if(booted)return;booted=true;try{const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 11',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu'));s.add.text(195,70,t,{fontSize:'22px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'12px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['自動ダンジョン生成','dungeon'],['タワーディフェンス照準','tower'],['分岐会話','dialogue'],['インベントリ操作','inventory'],['巻き戻し','rewind'],['タクティカル範囲','tactics'],['シネマティックカメラ','cinema'],['昼夜サイクル','daynight']];class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 11',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'ジャンルを形にするゲームシステム 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}class Dungeon extends Phaser.Scene{constructor(){super('dungeon')}create(){panel(this,'自動ダンジョン生成','部屋と通路を毎回ランダム生成');this.cameras.main.setBackgroundColor('#0e1318');let g=this.add.graphics(),btn=this.add.rectangle(195,510,180,38,0x293852).setInteractive();this.add.text(195,510,'REGENERATE',{fontSize:'13px'}).setOrigin(.5);const draw=()=>{g.clear().fillStyle(0x1d2a3f).fillRect(30,145,330,330);let rooms=[];for(let i=0;i<7;i++){let w=45+Math.random()*55,h=35+Math.random()*45,x=40+Math.random()*(300-w),y=155+Math.random()*(300-h);rooms.push({x,y,w,h,cx:x+w/2,cy:y+h/2})}g.fillStyle(0x64748b);for(let i=1;i<rooms.length;i++){let a=rooms[i-1],b=rooms[i];g.fillRect(Math.min(a.cx,b.cx),a.cy,Math.abs(a.cx-b.cx)+8,8);g.fillRect(b.cx,Math.min(a.cy,b.cy),8,Math.abs(a.cy-b.cy)+8)}g.fillStyle(0x334155);rooms.forEach(r=>g.fillRect(r.x,r.y,r.w,r.h))};draw();btn.on('pointerdown',draw);note(this,'用途：ローグライク、探索、迷宮、毎回違うマップ')}}class Tower extends Phaser.Scene{constructor(){super('tower')}create(){panel(this,'タワーディフェンス照準','射程内の敵を自動選択して攻撃');this.cameras.main.setBackgroundColor('#101a17');let tower=this.add.circle(195,330,20,0x55d6be),range=this.add.circle(195,330,130,0,0).setStrokeStyle(2,0x55d6be,.35),es=[];for(let i=0;i<9;i++){let e=this.add.circle(-20-i*45,190+(i%4)*75,10,0xff6b6b);e.sp=35+Math.random()*25;es.push(e)}let g=this.add.graphics();this.events.on('update',(_,dt)=>{es.forEach(e=>{e.x+=e.sp*dt/1000;if(e.x>410)e.x=-20});let cand=es.filter(e=>Phaser.Math.Distance.Between(tower.x,tower.y,e.x,e.y)<130).sort((a,b)=>a.x-b.x);g.clear();if(cand[0])g.lineStyle(3,0xffd166,.8).lineBetween(tower.x,tower.y,cand[0].x,cand[0].y)});note(this,'用途：TD、オートバトル、索敵、優先ターゲット')}}class Dialogue extends Phaser.Scene{constructor(){super('dialogue')}create(){panel(this,'分岐会話','選択肢によって次の台詞と状態が変わる');this.cameras.main.setBackgroundColor('#17141d');let tx=this.add.text(35,190,'村人「旅人さん、どこへ行くんだい？」',{fontSize:'16px',wordWrap:{width:320}}),state=this.add.text(35,260,'',{fontSize:'13px',color:'#ffd166'});const opts=[['北の城へ','勇気 +1'],['森を探索する','知識 +1'],['今日は休む','体力 +1']];opts.forEach((o,i)=>{let y=330+i*58,b=this.add.rectangle(195,y,300,44,0x293852).setInteractive();this.add.text(195,y,o[0],{fontSize:'14px'}).setOrigin(.5);b.on('pointerdown',()=>{tx.setText('村人「なるほど。'+o[0]+'んだね」');state.setText(o[1]);this.cameras.main.flash(80,90,120,170)})});note(this,'用途：RPG、ADV、好感度、ストーリー分岐')}}class Inventory extends Phaser.Scene{constructor(){super('inventory')}create(){panel(this,'インベントリ操作','アイテムをドラッグしてスロットへ入れ替える');this.cameras.main.setBackgroundColor('#121722');let slots=[];for(let y=0;y<3;y++)for(let x=0;x<4;x++)slots.push(this.add.rectangle(75+x*80,210+y*90,62,62,0x1e293b).setStrokeStyle(2,0x64748b));let items=[];for(let i=0;i<5;i++){let o=this.add.circle(slots[i].x,slots[i].y,20,[0xffd166,0x55d6be,0x8b5cf6,0xff6b6b,0x4ea5d9][i]).setInteractive({draggable:true});o.home=i;items.push(o);this.input.setDraggable(o)}this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));this.input.on('dragend',(p,o)=>{let best=slots.reduce((a,s)=>Phaser.Math.Distance.Between(o.x,o.y,s.x,s.y)<Phaser.Math.Distance.Between(o.x,o.y,a.x,a.y)?s:a,slots[0]);this.tweens.add({targets:o,x:best.x,y:best.y,duration:180})});note(this,'用途：装備、持ち物、倉庫、クラフトUI')}}class Rewind extends Phaser.Scene{constructor(){super('rewind')}create(){panel(this,'巻き戻し','過去の座標を記録して逆再生する');this.cameras.main.setBackgroundColor('#0c1620');let p=this.add.circle(70,330,18,0xffd166).setInteractive({draggable:true}),hist=[],rew=false,btn=this.add.rectangle(195,510,180,40,0x4c1d95).setInteractive();this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>{if(!rew)o.setPosition(x,y)});this.add.text(195,510,'REWIND',{fontSize:'15px'}).setOrigin(.5);btn.on('pointerdown',()=>rew=true);this.events.on('update',()=>{if(!rew){hist.push({x:p.x,y:p.y});if(hist.length>240)hist.shift()}else{let h=hist.pop();if(h)p.setPosition(h.x,h.y);else rew=false}});note(this,'用途：時間操作、リプレイ、ゴースト、失敗巻き戻し')}}class Tactics extends Phaser.Scene{constructor(){super('tactics')}create(){panel(this,'タクティカル範囲','ユニットを選ぶと移動可能マスを表示');this.cameras.main.setBackgroundColor('#101820');const C=7,S=46,OX=57,OY=185;let cells=[];for(let y=0;y<C;y++)for(let x=0;x<C;x++)cells.push(this.add.rectangle(OX+x*S,OY+y*S,40,40,0x1d2a3f).setStrokeStyle(1,0x475569));let u=this.add.circle(OX+3*S,OY+3*S,14,0xffd166).setInteractive(),gx=3,gy=3;const show=()=>cells.forEach((c,i)=>{let x=i%C,y=Math.floor(i/C),d=Math.abs(x-gx)+Math.abs(y-gy);c.setFillStyle(d<=2?0x234e52:0x1d2a3f);c.setInteractive().removeAllListeners('pointerdown').on('pointerdown',()=>{if(d<=2){gx=x;gy=y;u.setPosition(c.x,c.y);show()}})});show();note(this,'用途：SRPG、ボードゲーム、移動範囲、攻撃範囲')}}class Cinema extends Phaser.Scene{constructor(){super('cinema')}create(){panel(this,'シネマティックカメラ','パン・ズーム・揺れを順番に組んで演出');this.cameras.main.setBackgroundColor('#11131a');for(let i=0;i<20;i++)this.add.rectangle(30+(i%5)*85,170+Math.floor(i/5)*90,55,55,[0x334155,0x475569,0x293852][i%3]);let hero=this.add.circle(90,420,18,0xffd166),boss=this.add.rectangle(300,220,52,70,0xff6b6b),btn=this.add.rectangle(195,510,190,40,0x293852).setInteractive();this.add.text(195,510,'PLAY CUTSCENE',{fontSize:'13px'}).setOrigin(.5);btn.on('pointerdown',()=>{this.cameras.main.pan(hero.x,hero.y,550,'Sine.easeInOut',true,()=>{this.cameras.main.zoomTo(1.7,450,'Quad.easeInOut',true,()=>{this.time.delayedCall(300,()=>{this.cameras.main.pan(boss.x,boss.y,500,'Sine.easeInOut',true,()=>{this.cameras.main.shake(250,.01);this.time.delayedCall(350,()=>{this.cameras.main.zoomTo(1,450);this.cameras.main.pan(195,300,450)})})})})})});note(this,'用途：ボス登場、イベント、勝利演出、ストーリー')}}class DayNight extends Phaser.Scene{constructor(){super('daynight')}create(){panel(this,'昼夜サイクル','空・光・星を時間で連続変化');let sky=this.add.rectangle(195,330,390,390,0x87ceeb),sun=this.add.circle(195,220,28,0xffd166),stars=[];for(let i=0;i<30;i++)stars.push(this.add.circle(20+Math.random()*350,160+Math.random()*180,1.5,0xffffff,0));let t=0,tx=this.add.text(195,500,'DAY',{fontSize:'20px'}).setOrigin(.5);this.events.on('update',(_,dt)=>{t=(t+dt*.00008)%1;let night=(1-Math.cos(t*Math.PI*2))/2,dayColor=Phaser.Display.Color.Interpolate.ColorWithColor({r:135,g:206,b:235},{r:10,g:18,b:45},100,Math.round(night*100));sky.setFillStyle(Phaser.Display.Color.GetColor(dayColor.r,dayColor.g,dayColor.b));sun.x=195+Math.cos(t*Math.PI*2)*130;sun.y=335-Math.sin(t*Math.PI*2)*150;stars.forEach(s=>s.setAlpha(night));tx.setText(night>.65?'NIGHT':night>.35?'EVENING / DAWN':'DAY')});note(this,'用途：生活ゲーム、RPG、背景変化、時間イベント')}}new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Dungeon,Tower,Dialogue,Inventory,Rewind,Tactics,Cinema,DayNight]})}catch(e){diag.innerHTML='<span class="ng">ERROR '+String(e.message||e)+'</span>'}}load();</script></body></html>
