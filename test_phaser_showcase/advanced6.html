<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced5.html">← Advanced 5</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};document.head.appendChild(s)}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 6',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000).setScrollFactor(0);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5).setScrollFactor(0);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}
 const ITEMS=[['Boids群れ','boids'],['Breadcrumb追跡','breadcrumb'],['Wave床','wave'],['Target Lock','targetLock'],['Chain Reaction','chain'],['Risk Meter','risk'],['Portal Warp','portal'],['Combo演出','combo']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 6',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'AIっぽい挙動・連鎖・ワープ 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 6 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class Boids extends Phaser.Scene{constructor(){super('boids')}create(){this.cameras.main.setBackgroundColor('#0f1720');panel(this,'Boids群れ','個々が近距離ルールだけで「群れ」っぽく動く');const fish=[];for(let i=0;i<20;i++){const r=this.add.triangle(Phaser.Math.Between(50,340),Phaser.Math.Between(170,480),-10,-7,12,0,-10,7,[0x55d6be,0x4ea5d9,0xffd166][i%3]);r.vx=Phaser.Math.FloatBetween(-70,70);r.vy=Phaser.Math.FloatBetween(-70,70);fish.push(r)}this.events.on('update',(_,dt)=>{fish.forEach(f=>{let ax=0,ay=0,c=0;fish.forEach(o=>{if(o===f)return;const dx=o.x-f.x,dy=o.y-f.y,d=Math.hypot(dx,dy);if(d<90){ax+=o.vx;ay+=o.vy;c++;if(d<28){f.vx-=dx*.8;f.vy-=dy*.8}}});if(c){f.vx=f.vx*.96+(ax/c)*.04;f.vy=f.vy*.96+(ay/c)*.04}const sp=Math.hypot(f.vx,f.vy)||1;if(sp>95){f.vx=f.vx/sp*95;f.vy=f.vy/sp*95}f.x+=f.vx*dt/1000;f.y+=f.vy*dt/1000;if(f.x<25||f.x>365)f.vx*=-1;if(f.y<145||f.y>520)f.vy*=-1;f.rotation=Math.atan2(f.vy,f.vx)})});note(this,'用途例：魚群、敵集団、ドローン、演出キャラの群れ')}}
 class Breadcrumb extends Phaser.Scene{constructor(){super('breadcrumb')}create(){this.cameras.main.setBackgroundColor('#141a22');panel(this,'Breadcrumb追跡','過去の座標を保存して後続が同じ軌道を追う');const leader=this.add.circle(195,260,20,0xffd166);const followers=[0,1,2,3,4].map(i=>this.add.circle(195,300+i*35,14,[0x55d6be,0x4ea5d9,0xff6b6b,0xa78bfa,0x60a5fa][i]));let hist=[];let t=0;this.events.on('update',(_,dt)=>{t+=dt/1000;leader.x=195+110*Math.sin(t*1.6);leader.y=320+115*Math.sin(t*2.2)*.55;hist.unshift({x:leader.x,y:leader.y});if(hist.length>220)hist.pop();followers.forEach((f,i)=>{const p=hist[(i+1)*28];if(p)f.setPosition(p.x,p.y)})});note(this,'用途例：蛇、列車、仲間追従、残像より「実体の隊列」')}}
 class Wave extends Phaser.Scene{constructor(){super('wave')}create(){this.cameras.main.setBackgroundColor('#0f1620');panel(this,'Wave床','波形関数で床やラインをうねらせる');const dots=[];for(let i=0;i<26;i++)dots.push(this.add.circle(25+i*14,330,5,0x66e8ff));let t=0;this.events.on('update',(_,dt)=>{t+=dt/1000;dots.forEach((d,i)=>{d.y=330+Math.sin(t*3+i*.45)*55})});this.add.text(195,440,'波 = sin(時間 + 位置)',{fontSize:'16px',color:'#aebbd2'}).setOrigin(.5);note(this,'用途例：水面、地面変形、音波、ゲージ、背景演出')}}
 class TargetLock extends Phaser.Scene{constructor(){super('targetLock')}create(){this.cameras.main.setBackgroundColor('#151922');panel(this,'Target Lock','対象を検出して照準UIを追従させる');const targets=[];for(let i=0;i<5;i++){const c=this.add.circle(70+i*65,250+Phaser.Math.Between(-50,120),20,[0xff6b6b,0x55d6be,0x4ea5d9][i%3]);c.v=Phaser.Math.FloatBetween(.7,1.3);targets.push(c)}const ret=this.add.container(195,320);ret.add([this.add.circle(0,0,38,0xffffff,0).setStrokeStyle(3,0xffd166),this.add.rectangle(0,0,70,2,0xffd166),this.add.rectangle(0,0,2,70,0xffd166)]);let idx=0;this.time.addEvent({delay:1000,loop:true,callback:()=>idx=(idx+1)%targets.length});let t=0;this.events.on('update',(_,dt)=>{t+=dt/1000;targets.forEach((o,i)=>{o.y+=Math.sin(t*2+i)*o.v*.7});const q=targets[idx];ret.x+=(q.x-ret.x)*.12;ret.y+=(q.y-ret.y)*.12;ret.rotation+=.02});note(this,'用途例：ロックオン、期待度注目、敵選択、狙い演出')}}
 class Chain extends Phaser.Scene{constructor(){super('chain')}create(){this.cameras.main.setBackgroundColor('#171421');panel(this,'Chain Reaction','1つの起点から近いものへ次々に反応を伝播');const nodes=[];for(let i=0;i<18;i++)nodes.push(this.add.circle(Phaser.Math.Between(55,335),Phaser.Math.Between(170,475),14,[0x4ea5d9,0x55d6be,0xa78bfa][i%3]).setInteractive());const trigger=(n,seen=new Set())=>{if(seen.has(n))return;seen.add(n);this.tweens.add({targets:n,scale:2.2,alpha:.25,duration:260,yoyo:true,onComplete:()=>n.setAlpha(1)});this.time.delayedCall(160,()=>nodes.forEach(o=>{if(!seen.has(o)&&Phaser.Math.Distance.Between(n.x,n.y,o.x,o.y)<95)trigger(o,seen)}))};nodes.forEach(n=>n.on('pointerdown',()=>trigger(n)));note(this,'用途例：爆発連鎖、パズル消去、雷連結、ボーナス連鎖')}}
 class Risk extends Phaser.Scene{constructor(){super('risk')}create(){this.cameras.main.setBackgroundColor('#1a1716');panel(this,'Risk Meter','値に応じて色・揺れ・警告を段階的に変化');let v=0;const bg=this.add.rectangle(195,325,280,40,0x2f3640);const bar=this.add.rectangle(55,325,0,34,0x55d6be).setOrigin(0,.5);const tx=this.add.text(195,405,'SAFE 0%',{fontSize:'24px'}).setOrigin(.5);this.time.addEvent({delay:120,loop:true,callback:()=>{v=(v+3)%101;bar.width=2.8*v;bar.setFillStyle(v<40?0x55d6be:v<75?0xffd166:0xff6b6b);tx.setText((v<40?'SAFE ':v<75?'CAUTION ':'DANGER ')+v+'%');tx.setScale(v>75?1+Math.sin(this.time.now*.02)*.08:1)}});note(this,'用途例：危険度、期待度、熱量、チャージ、継続率の視覚化')}}
 class Portal extends Phaser.Scene{constructor(){super('portal')}create(){this.cameras.main.setBackgroundColor('#0d111b');panel(this,'Portal Warp','入口に触れた物体を別地点へ瞬間移動');const a=this.add.circle(95,330,46,0x4ea5d9,.18).setStrokeStyle(5,0x66e8ff);const b=this.add.circle(295,250,46,0xa78bfa,.18).setStrokeStyle(5,0xc4b5fd);const p=this.add.circle(195,470,18,0xffd166).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(x,y));let lock=false;this.input.on('drag',()=>{if(lock)return;const da=Phaser.Math.Distance.Between(p.x,p.y,a.x,a.y),db=Phaser.Math.Distance.Between(p.x,p.y,b.x,b.y);if(da<46){lock=true;p.setPosition(b.x,b.y);this.cameras.main.flash(100,130,180,255);this.time.delayedCall(300,()=>lock=false)}else if(db<46){lock=true;p.setPosition(a.x,a.y);this.cameras.main.flash(100,190,150,255);this.time.delayedCall(300,()=>lock=false)}});this.tweens.add({targets:[a,b],scale:1.15,duration:700,yoyo:true,repeat:-1});note(this,'用途例：ワープ、画面内瞬間移動、転送演出、ショートカット')}}
 class Combo extends Phaser.Scene{constructor(){super('combo')}create(){this.cameras.main.setBackgroundColor('#171521');panel(this,'Combo演出','連続入力に応じて数字・色・速度を段階的に強化');let combo=0,last=0;const target=this.add.circle(195,300,58,0x4ea5d9).setInteractive();const tx=this.add.text(195,415,'COMBO 0',{fontSize:'28px',fontStyle:'bold'}).setOrigin(.5);const sub=this.add.text(195,455,'円を連打',{fontSize:'14px',color:'#aebbd2'}).setOrigin(.5);target.on('pointerdown',()=>{const now=this.time.now;combo=now-last<650?combo+1:1;last=now;tx.setText('COMBO '+combo);target.setFillStyle(combo<5?0x4ea5d9:combo<10?0xffd166:0xff6b6b);this.tweens.add({targets:target,scale:1.35,duration:90,yoyo:true});if(combo%5===0){this.cameras.main.shake(100,.01);const n=this.add.text(195,220,'+'+combo,{fontSize:'30px',color:'#ffd166',fontStyle:'bold'}).setOrigin(.5);this.tweens.add({targets:n,y:170,alpha:0,duration:500,onComplete:()=>n.destroy()})}});this.time.addEvent({delay:100,loop:true,callback:()=>{if(combo>0&&this.time.now-last>900){combo=0;tx.setText('COMBO 0');target.setFillStyle(0x4ea5d9)}}});note(this,'用途例：連打、連鎖、連続成功、ボーナス加速、熱い演出')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Boids,Breadcrumb,Wave,TargetLock,Chain,Risk,Portal,Combo]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
