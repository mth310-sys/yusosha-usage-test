<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced3.html">← Advanced 3</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){
 const s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
 s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};
 s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};
 document.head.appendChild(s)
}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;
 Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 4',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 const ITEMS=[['Parallax多層背景','parallax'],['Vector照準','vector'],['重力切替','gravity'],['Animation制御','animCtrl'],['Scene Sleep / Wake','sleepWake'],['Event通信','events'],['Camera Fade遷移','fade'],['自動生成グリッド','grid']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 4',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'演出・制御・ゲーム構造 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 4 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class Parallax extends Phaser.Scene{constructor(){super('parallax')}create(){this.cameras.main.setBackgroundColor('#08121f');panel(this,'Parallax多層背景','遠景・中景・近景を別速度で動かして奥行きを作る');const far=this.add.graphics(),mid=this.add.graphics(),near=this.add.graphics();for(let i=0;i<28;i++)far.fillStyle(0xffffff,Phaser.Math.FloatBetween(.2,.7)).fillCircle(Phaser.Math.Between(0,390),Phaser.Math.Between(150,470),Phaser.Math.Between(1,3));for(let i=0;i<12;i++)mid.fillStyle(0x4ea5d9,.55).fillRect(i*55,340+Phaser.Math.Between(-50,30),36,160);for(let i=0;i<8;i++)near.fillStyle(0x55d6be,.7).fillTriangle(i*70,500,i*70+35,330+Phaser.Math.Between(-35,35),i*70+70,500);let x=0;this.events.on('update',(_,dt)=>{x+=dt/1000;far.x=-((x*12)%390);mid.x=-((x*28)%110);near.x=-((x*55)%140)});note(this,'用途例：横スクロール、宇宙、街、奥行きのある演出背景')}}
 class VectorScene extends Phaser.Scene{constructor(){super('vector')}create(){this.cameras.main.setBackgroundColor('#121922');panel(this,'Vector照準','Pointer方向の角度・距離をリアルタイム計算');const base=this.add.circle(195,330,28,0xffd166).setStrokeStyle(3,0xffffff);const arrow=this.add.rectangle(195,330,120,10,0x55d6be).setOrigin(0,.5);const target=this.add.circle(300,240,18,0xff6b6b,.9);const tx=this.add.text(195,455,'画面を指で動かす',{fontSize:'15px'}).setOrigin(.5);this.input.on('pointermove',p=>{const a=Phaser.Math.Angle.Between(base.x,base.y,p.x,p.y),d=Phaser.Math.Distance.Between(base.x,base.y,p.x,p.y);arrow.rotation=a;arrow.displayWidth=Phaser.Math.Clamp(d,25,170);target.setPosition(p.x,p.y);tx.setText(`ANGLE ${(Phaser.Math.RadToDeg(a)).toFixed(0)}° / DIST ${d.toFixed(0)}`)});note(this,'用途例：照準、ジョイスティック、追尾、飛び道具、方向UI')}}
 class GravityScene extends Phaser.Scene{constructor(){super('gravity')}create(){this.cameras.main.setBackgroundColor('#151923');panel(this,'重力切替','Physics Worldの重力方向をその場で変更');const balls=[];for(let i=0;i<10;i++){const b=this.add.circle(Phaser.Math.Between(80,310),Phaser.Math.Between(180,350),12,0x66e8ff);this.physics.add.existing(b);b.body.setBounce(.8).setCollideWorldBounds(true);balls.push(b)}const tx=this.add.text(195,440,'GRAVITY ↓',{fontSize:'20px'}).setOrigin(.5);const modes=[[195,495,'↓',0,450],[90,495,'←',-450,0],[300,495,'→',450,0],[195,535,'↑',0,-450]];modes.forEach(([x,y,l,gx,gy])=>{this.add.circle(x,y,24,0x293852).setInteractive().on('pointerdown',()=>{this.physics.world.gravity.set(gx,gy);tx.setText('GRAVITY '+l)});this.add.text(x,y,l,{fontSize:'20px'}).setOrigin(.5)});note(this,'用途例：重力反転、落下物、パズル、特殊ステージ')}}
 class AnimCtrl extends Phaser.Scene{constructor(){super('animCtrl')}create(){this.cameras.main.setBackgroundColor('#1a1722');panel(this,'Animation制御','同じアニメを速度変更・停止・逆再生');for(let i=0;i<6;i++){const key='ac'+i;if(this.textures.exists(key))continue;const g=this.make.graphics({add:false});g.fillStyle(Phaser.Display.Color.HSLToColor(i/6,.8,.55).color,1).fillRoundedRect(4,4,72,72,14);g.fillStyle(0xffffff,1).fillCircle(18+i*8,40,8);g.generateTexture(key,80,80);g.destroy()}if(!this.anims.exists('acRun'))this.anims.create({key:'acRun',frames:[0,1,2,3,4,5].map(i=>({key:'ac'+i})),frameRate:8,repeat:-1});const s=this.add.sprite(195,300,'ac0').setScale(1.7).play('acRun');const tx=this.add.text(195,420,'NORMAL',{fontSize:'18px'}).setOrigin(.5);[['SLOW',90,.35],['NORMAL',195,1],['FAST',300,2]].forEach(([l,x,v])=>{this.add.rectangle(x,490,95,38,0x293852).setInteractive().on('pointerdown',()=>{s.anims.timeScale=v;s.anims.resume();tx.setText(l)});this.add.text(x,490,l,{fontSize:'12px'}).setOrigin(.5)});this.add.rectangle(140,535,100,34,0x3c2d48).setInteractive().on('pointerdown',()=>{s.anims.pause();tx.setText('PAUSE')});this.add.text(140,535,'PAUSE',{fontSize:'12px'}).setOrigin(.5);this.add.rectangle(250,535,100,34,0x3c2d48).setInteractive().on('pointerdown',()=>{s.anims.reverse();s.anims.resume();tx.setText('REVERSE')});this.add.text(250,535,'REVERSE',{fontSize:'12px'}).setOrigin(.5);note(this,'用途例：キャラ、図柄、役物、演出速度の可変制御')}}
 class SleepWake extends Phaser.Scene{constructor(){super('sleepWake')}create(){this.cameras.main.setBackgroundColor('#152019');panel(this,'Scene Sleep / Wake','Sceneを破棄せず眠らせて、その状態のまま復帰');let n=this.registry.get('sleepDemoN')||0;const t=this.add.text(195,265,'COUNT '+n,{fontSize:'32px'}).setOrigin(.5);const ev=this.time.addEvent({delay:300,loop:true,callback:()=>{n++;this.registry.set('sleepDemoN',n);t.setText('COUNT '+n)}});const b=this.add.rectangle(195,385,220,52,0x2a3b34).setInteractive();const bt=this.add.text(195,385,'SLEEP 1秒',{fontSize:'18px'}).setOrigin(.5);b.on('pointerdown',()=>{bt.setText('SLEEPING…');ev.paused=true;this.time.delayedCall(1000,()=>{ev.paused=false;bt.setText('WAKE!');this.time.delayedCall(500,()=>bt.setText('SLEEP 1秒'))})});note(this,'実運用ではSceneManagerのsleep/wakeで画面状態を保持できる')}}
 class EventsScene extends Phaser.Scene{constructor(){super('events')}create(){this.cameras.main.setBackgroundColor('#181725');panel(this,'Event通信','直接つながず「イベント名」で処理同士を連携');const bus=new Phaser.Events.EventEmitter();const lamp=this.add.circle(195,285,52,0x374151);const log=this.add.text(195,410,'EVENT待機中',{fontSize:'17px'}).setOrigin(.5);bus.on('jackpot',value=>{lamp.setFillStyle(0xffd166);log.setText('jackpot受信: '+value);this.tweens.add({targets:lamp,scale:1.5,duration:180,yoyo:true})});this.add.rectangle(195,500,190,46,0x4c3b1d).setInteractive().on('pointerdown',()=>bus.emit('jackpot',Phaser.Math.Between(1,999)));this.add.text(195,500,'EVENT EMIT',{fontSize:'15px'}).setOrigin(.5);note(this,'用途例：当選通知、UI更新、演出開始、モジュール間通信')}}
 class FadeScene extends Phaser.Scene{constructor(){super('fade')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'Camera Fade遷移','画面全体をフェードして場面転換を作る');const bg=this.add.rectangle(195,320,300,260,0x27506a);this.add.text(195,300,'SCENE',{fontSize:'38px',fontStyle:'bold'}).setOrigin(.5);const tx=this.add.text(195,360,'BLUE',{fontSize:'20px'}).setOrigin(.5);let blue=true;this.add.rectangle(195,500,180,46,0x293852).setInteractive().on('pointerdown',()=>{this.cameras.main.fadeOut(400,0,0,0);this.cameras.main.once('camerafadeoutcomplete',()=>{blue=!blue;bg.setFillStyle(blue?0x27506a:0x6a2747);tx.setText(blue?'BLUE':'MAGENTA');this.cameras.main.fadeIn(400,0,0,0)})});this.add.text(195,500,'FADE CHANGE',{fontSize:'14px'}).setOrigin(.5);note(this,'用途例：ステージ移動、ボーナス突入、暗転、場面切替')}}
 class GridScene extends Phaser.Scene{constructor(){super('grid')}create(){this.cameras.main.setBackgroundColor('#111820');panel(this,'自動生成グリッド','配列・ルールから盤面をその場で生成');const cells=[];const ox=65,oy=175,s=43;for(let y=0;y<7;y++)for(let x=0;x<7;x++){const v=Phaser.Math.Between(0,2),c=[0x26344a,0x315f59,0x6a4b27][v];const r=this.add.rectangle(ox+x*s,oy+y*s,37,37,c).setStrokeStyle(1,0x8290a5,.5).setInteractive();r.state=v;r.on('pointerdown',()=>{r.state=(r.state+1)%3;r.setFillStyle([0x26344a,0x315f59,0x6a4b27][r.state])});cells.push(r)}this.add.text(195,505,'49セル / タップで状態変更',{fontSize:'14px'}).setOrigin(.5);note(this,'用途例：マップ、パズル、カード盤面、ダンジョン、配置エディタ')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,physics:{default:'arcade',arcade:{gravity:{x:0,y:450},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Parallax,VectorScene,GravityScene,AnimCtrl,SleepWake,EventsScene,FadeScene,GridScene]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
