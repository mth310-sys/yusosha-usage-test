<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 14</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced13.html">← Advanced 13</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR '+String(e.message||e.error||e)+'</span>');
window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR '+String(e.reason?.message||e.reason||e)+'</span>');
function loadScript(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),done=false,t=setTimeout(()=>{if(!done){done=true;s.remove();ng(new Error('timeout'))}},to);s.src=src;s.onload=()=>{if(!done){done=true;clearTimeout(t);window.Phaser?ok():ng(new Error('Phaser missing'))}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);ng(new Error('load error'))}};document.head.appendChild(s)})}
async function load(){const src=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<src.length;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${src[i][0]}…`;try{await loadScript(src[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗 / 再読込してください</span>'}
function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};
const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 14',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,68,t,{fontSize:'21px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,100,d,{fontSize:'11px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};
const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);
const I=[['大量オブジェクト性能試験','stress'],['簡易生態系シミュレーション','ecosystem'],['交通・経路シミュレーション','traffic'],['天候システム','weather'],['経済シミュレーション','economy'],['AI学習っぽい適応','adaptive'],['破壊連鎖シミュレーション','chain'],['遊技機演出シーケンサー','sequence']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'Phaser Advanced 14',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,58,'ゲームの裏側を動かす仕組み 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=99;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Stress extends Phaser.Scene{constructor(){super('stress')}create(){panel(this,'大量オブジェクト性能試験','画面上の物体を増やしてスマホ描画負荷を観察');this.cameras.main.setBackgroundColor('#081018');this.items=[];this.count=100;this.fps=this.add.text(20,135,'',{fontSize:'13px'});for(let i=0;i<600;i++){let o=this.add.circle(Math.random()*390,170+Math.random()*350,2+Math.random()*3,Phaser.Display.Color.RandomRGB().color);o.vx=-1+Math.random()*2;o.vy=-1+Math.random()*2;o.setVisible(i<this.count);this.items.push(o)}this.add.text(195,520,'TAP：+100 objects',{fontSize:'15px',backgroundColor:'#24344d',padding:{x:12,y:7}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.count=Math.min(600,this.count+100));this.events.on('update',()=>{for(let i=0;i<this.items.length;i++){let o=this.items[i];o.setVisible(i<this.count);if(i>=this.count)continue;o.x+=o.vx;o.y+=o.vy;if(o.x<0||o.x>390)o.vx*=-1;if(o.y<150||o.y>500)o.vy*=-1}this.fps.setText(`Objects ${this.count} / FPS ${Math.round(this.game.loop.actualFps)}`)});note(this,'性能限界を数値と見た目で探るための基礎試験')}}
class Ecosystem extends Phaser.Scene{constructor(){super('ecosystem')}create(){panel(this,'簡易生態系','草→草食→捕食の関係を小さな世界で回す');this.cameras.main.setBackgroundColor('#102015');this.grass=[];this.prey=[];this.pred=[];for(let i=0;i<35;i++)this.grass.push(this.add.circle(20+Math.random()*350,150+Math.random()*360,3,0x6ee7a0));for(let i=0;i<12;i++){let o=this.add.circle(30+Math.random()*330,180+Math.random()*300,6,0xffd166);o.vx=-1+Math.random()*2;o.vy=-1+Math.random()*2;this.prey.push(o)}for(let i=0;i<3;i++){let o=this.add.circle(50+Math.random()*290,200+Math.random()*260,9,0xff6b6b);this.pred.push(o)}this.info=this.add.text(20,130,'',{fontSize:'12px'});this.time.addEvent({delay:1800,loop:true,callback:()=>{if(this.grass.length<60)this.grass.push(this.add.circle(20+Math.random()*350,150+Math.random()*360,3,0x6ee7a0))}});this.events.on('update',()=>{this.prey=this.prey.filter(o=>o.active);this.grass=this.grass.filter(o=>o.active);this.prey.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<15||p.x>375)p.vx*=-1;if(p.y<145||p.y>520)p.vy*=-1;let g=this.grass.find(g=>Phaser.Math.Distance.Between(p.x,p.y,g.x,g.y)<12);if(g){g.destroy();if(this.prey.length<25&&Math.random()<.08){let n=this.add.circle(p.x,p.y,6,0xffd166);n.vx=-1+Math.random()*2;n.vy=-1+Math.random()*2;this.prey.push(n)}}});this.pred.forEach(r=>{let p=this.prey[0];if(!p)return;let a=Phaser.Math.Angle.Between(r.x,r.y,p.x,p.y);r.x+=Math.cos(a)*.7;r.y+=Math.sin(a)*.7;if(Phaser.Math.Distance.Between(r.x,r.y,p.x,p.y)<12)p.destroy()});this.info.setText(`草 ${this.grass.length} / 草食 ${this.prey.length} / 捕食 ${this.pred.length}`)});note(this,'NPC世界・放置ゲーム・シミュレーションへ発展可能')}}
class Traffic extends Phaser.Scene{constructor(){super('traffic')}create(){panel(this,'交通・経路シミュレーション','複数の車が交差点を流れる簡易交通モデル');this.cameras.main.setBackgroundColor('#18202a');this.add.rectangle(195,330,390,90,0x374151);this.add.rectangle(195,330,90,390,0x374151);this.cars=[];for(let i=0;i<18;i++){let horizontal=i%2===0,o=this.add.rectangle(horizontal?-i*55:175,horizontal?310:-i*55,horizontal?26:14,horizontal?14:26,i%3?0x4ea5d9:0xffd166);o.h=horizontal;o.v=1.2+Math.random()*1.5;this.cars.push(o)}this.events.on('update',()=>this.cars.forEach((c,i)=>{let ahead=this.cars.some((o,j)=>j!==i&&o.h===c.h&&(c.h?o.x>c.x&&o.x-c.x<35:o.y>c.y&&o.y-c.y<35));let v=ahead?c.v*.15:c.v;if(c.h){c.x+=v;if(c.x>420)c.x=-30}else{c.y+=v;if(c.y>550)c.y=120}}));note(this,'経路・渋滞・NPC移動の考え方を可視化')}}
class Weather extends Phaser.Scene{constructor(){super('weather')}create(){panel(this,'天候システム','晴れ→雨→嵐を時間で切り替え、世界の見た目を変える');this.cameras.main.setBackgroundColor('#3c78a8');this.rain=[];for(let i=0;i<100;i++){let r=this.add.rectangle(Math.random()*390,130+Math.random()*430,2,12,0x9bdcff,.75);r.setVisible(false);this.rain.push(r)}this.state=0;this.label=this.add.text(195,300,'☀ 晴れ',{fontSize:'32px'}).setOrigin(.5);this.time.addEvent({delay:2800,loop:true,callback:()=>{this.state=(this.state+1)%3;this.label.setText(['☀ 晴れ','☂ 雨','⚡ 嵐'][this.state]);this.cameras.main.setBackgroundColor([0x3c78a8,0x263b52,0x171b2a][this.state]);this.rain.forEach(r=>r.setVisible(this.state>0))}});this.events.on('update',()=>this.rain.forEach(r=>{if(!r.visible)return;r.y+=this.state===2?9:5;r.x+=this.state===2?2:.3;if(r.y>590){r.y=130;r.x=Math.random()*390}}));note(this,'天候は背景だけでなく移動・敵・イベントにも接続できる')}}
class Economy extends Phaser.Scene{constructor(){super('economy')}create(){panel(this,'経済シミュレーション','需要と在庫で価格が変化する小さな市場');this.cameras.main.setBackgroundColor('#141b24');this.stock=60;this.money=500;this.demand=50;this.txt=this.add.text(195,220,'',{fontSize:'18px',align:'center'}).setOrigin(.5);let buy=this.add.text(120,390,'仕入 +10',{fontSize:'16px',backgroundColor:'#24405c',padding:{x:12,y:9}}).setOrigin(.5).setInteractive(),sell=this.add.text(270,390,'販売 -5',{fontSize:'16px',backgroundColor:'#4a3040',padding:{x:12,y:9}}).setOrigin(.5).setInteractive();const price=()=>Math.max(10,Math.round(30+this.demand*.8-this.stock*.35)),draw=()=>this.txt.setText(`所持金 ¥${this.money}\n在庫 ${this.stock}\n需要 ${this.demand}\n現在価格 ¥${price()}`);buy.on('pointerdown',()=>{if(this.money>=200){this.money-=200;this.stock+=10;draw()}});sell.on('pointerdown',()=>{let n=Math.min(5,this.stock);this.stock-=n;this.money+=n*price();draw()});this.time.addEvent({delay:1200,loop:true,callback:()=>{this.demand=Phaser.Math.Clamp(this.demand+Phaser.Math.Between(-8,8),10,90);draw()}});draw();note(this,'ショップ・相場・経営ゲームの土台になる')}}
class Adaptive extends Phaser.Scene{constructor(){super('adaptive')}create(){panel(this,'AI学習っぽい適応','プレイヤーの移動傾向を記録して敵の予測位置を変える');this.cameras.main.setBackgroundColor('#111827');let p=this.add.circle(100,350,16,0x55d6be).setInteractive({draggable:true}),e=this.add.circle(300,250,18,0xff6b6b),avgX=195,samples=1;this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>{o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,160,510));samples++;avgX+=(o.x-avgX)/samples});this.pred=this.add.text(195,140,'',{fontSize:'12px'}).setOrigin(.5);this.events.on('update',()=>{let targetX=avgX,a=Phaser.Math.Angle.Between(e.x,e.y,targetX,p.y);e.x+=Math.cos(a)*1.1;e.y+=Math.sin(a)*1.1;this.pred.setText(`記録した平均X ${Math.round(avgX)} / 敵はそこを狙う`) });note(this,'本物の機械学習ではなく「行動履歴→適応」のゲームAI例')}}
class Chain extends Phaser.Scene{constructor(){super('chain')}create(){panel(this,'破壊連鎖','1個の爆発が近くの物体へ伝播する連鎖処理');this.cameras.main.setBackgroundColor('#120f16');this.nodes=[];for(let i=0;i<32;i++){let o=this.add.circle(30+Math.random()*330,160+Math.random()*350,8,0xa78bfa).setInteractive();o.hit=false;o.on('pointerdown',()=>this.boom(o));this.nodes.push(o)}note(this,'どれか1個をタップ → 距離で爆発が連鎖') }boom(o){if(!o.active||o.hit)return;o.hit=true;o.setFillStyle(0xffd166);this.tweens.add({targets:o,scale:3,alpha:0,duration:450,onComplete:()=>o.destroy()});this.nodes.forEach(n=>{if(n!==o&&n.active&&!n.hit&&Phaser.Math.Distance.Between(o.x,o.y,n.x,n.y)<75)this.time.delayedCall(120,()=>this.boom(n))})}}
class Sequence extends Phaser.Scene{constructor(){super('sequence')}create(){panel(this,'遊技機演出シーケンサー','複数演出を時間順に組み、1本の当たり演出へ');this.cameras.main.setBackgroundColor('#090b10');let frame=this.add.rectangle(195,315,300,250,0x101827).setStrokeStyle(4,0x596579),title=this.add.text(195,270,'READY',{fontSize:'35px',fontStyle:'bold'}).setOrigin(.5),meter=this.add.rectangle(95,390,0,12,0xffd166).setOrigin(0,.5),btn=this.add.text(195,485,'演出 START',{fontSize:'18px',backgroundColor:'#5a2235',padding:{x:18,y:10}}).setOrigin(.5).setInteractive();let busy=false;btn.on('pointerdown',()=>{if(busy)return;busy=true;title.setText('CHANCE').setColor('#ffd166');this.cameras.main.flash(180,255,200,80);this.tweens.add({targets:meter,displayWidth:200,duration:900});this.time.delayedCall(900,()=>{title.setText('激 熱').setScale(1.4);this.cameras.main.shake(300,.015)});this.time.delayedCall(1700,()=>{frame.setStrokeStyle(8,0xffd166);title.setText('BONUS').setColor('#ffffff');this.cameras.main.flash(400,255,255,255)});this.time.delayedCall(2800,()=>{busy=false;meter.displayWidth=0;frame.setStrokeStyle(4,0x596579);title.setText('READY').setScale(1).setColor('#ffffff')})});note(this,'Tween・Camera・Timer・UIを順番に束ねると演出制御になる')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#0d1422',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Menu,Stress,Ecosystem,Traffic,Weather,Economy,Adaptive,Chain,Sequence]})}
load();
</script></body></html>
