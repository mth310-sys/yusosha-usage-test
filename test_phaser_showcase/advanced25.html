<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>遊創舎 Phaser Advanced 25</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#070910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw;min-height:100vh}#top{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#151927;border-bottom:1px solid #30374d;font-size:14px}#top a{color:#8fd3ff;text-decoration:none}#diag{margin-left:auto;font-size:12px;color:#8ef0a8}.head{padding:14px 16px 10px}.title{font-size:22px;font-weight:750}.sub{font-size:14px;color:#b8c3d8;margin-top:5px;line-height:1.5}.stage{margin:0 16px;border-radius:14px;overflow:hidden;border:1px solid #34405a;background:#080b12}.stagebar{display:flex;padding:9px 11px;background:#151b29}.stagebar b{font-size:14px}.stagebar span{margin-left:auto;font-size:12px;color:#9eabc2}canvas{display:block;width:100%!important;height:auto!important;touch-action:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 16px 5px}.tab,.btn{border:1px solid #46536d;background:#1b2639;color:#fff;border-radius:10px;text-align:center;user-select:none}.tab{padding:11px 2px;font-size:12px;font-weight:650}.tab.on{background:#344b70;border-color:#7ca0d0}.panel{padding:10px 16px}.panel h3{font-size:17px;margin:0 0 6px}.panel p{font-size:14px;line-height:1.5;color:#b8c3d8;margin:0 0 10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:12px 8px;font:650 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.btn:active{transform:scale(.98)}.wide{grid-column:1/3}.log{margin-top:9px;background:#111725;border:1px solid #2d3850;border-radius:10px;padding:10px 11px;font-size:14px;line-height:1.45;color:#dbe3ef}.tip{padding:5px 16px 22px;font-size:13px;line-height:1.55;color:#9ca9bf}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced24.html">← Advanced 24</a><b>Advanced 25</b><div id="diag">Phaser読込中…</div></div><div class="head"><div class="title">Visual / Effect Lab 01</div><div class="sub">ここから演出・映像表現を重点研究。まずは遊技機やアクション演出にも使いやすい4系統を比較する。</div></div><div class="stage"><div class="stagebar"><b>Phaser演出領域</b><span>タップでも発動</span></div><div id="game"></div></div><div class="tabs"><div class="tab on" data-mode="burst">爆発</div><div class="tab" data-mode="lightning">雷</div><div class="tab" data-mode="shock">衝撃波</div><div class="tab" data-mode="aura">オーラ</div></div><div class="panel"><h3 id="ttl">① 爆発・火花</h3><p id="desc">中心フラッシュ、火花、煙、カメラ振動を重ねて一発の爆発に見せる。</p><div class="controls"><div class="btn wide" id="play">演出を発動</div><div class="btn" id="weak">弱</div><div class="btn" id="strong">強</div></div><div class="log" id="log">強度：標準 / 画面をタップしても発動できます</div></div><div class="tip">固定文字は高精細HTML/CSS。Phaserは光・粒子・線・Tween・カメラを担当。外部画像素材なし。</div></div><script>const diag=document.getElementById('diag'),ttl=document.getElementById('ttl'),desc=document.getElementById('desc'),log=document.getElementById('log');let S=null,booted=false,intensity=1;const src=['https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'];function one(u){return new Promise((ok,no)=>{let s=document.createElement('script'),done=0,t=setTimeout(()=>{if(!done){done=1;s.remove();no()}},6000);s.src=u;s.onload=()=>{if(!done){done=1;clearTimeout(t);window.Phaser?ok():no()}};s.onerror=()=>{if(!done){done=1;clearTimeout(t);no()}};document.head.appendChild(s)})}async function load(){for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3…`;try{await one(src[i]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">読込失敗 / 再読込してください</span>'}function boot(){if(booted)return;booted=1;const D=Math.min(devicePixelRatio||1,3);class FX extends Phaser.Scene{create(){S=this;this.mode='burst';this.cameras.main.setBackgroundColor('#060911');this.add.rectangle(179,170,310,230,0x101827).setStrokeStyle(1,0x26344d);this.core=this.add.circle(179,170,18,0x55d6be);this.input.on('pointerdown',p=>{if(p.y>35&&p.y<330)this.play(p.x,p.y)});diag.textContent=`OK / Retina ${D}x`}clean(o,d=900){this.time.delayedCall(d,()=>o?.active&&o.destroy())}burst(x,y,k){let flash=this.add.circle(x,y,10,0xffffff,.95).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:flash,scale:5*k,alpha:0,duration:180,onComplete:()=>flash.destroy()});for(let i=0;i<26*k;i++){let a=Math.random()*Math.PI*2,r=Phaser.Math.Between(45,120)*k,o=this.add.circle(x,y,Phaser.Math.Between(2,5),i%3?0xffa62b:0xfff2a8).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:o,x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,alpha:0,scale:.2,duration:Phaser.Math.Between(280,650),ease:'Quad.easeOut',onComplete:()=>o.destroy()})}for(let i=0;i<7*k;i++){let o=this.add.circle(x+Phaser.Math.Between(-12,12),y,Phaser.Math.Between(9,17),0x6d7280,.35);this.tweens.add({targets:o,y:y-Phaser.Math.Between(35,85),x:o.x+Phaser.Math.Between(-30,30),scale:1.8,alpha:0,duration:800,onComplete:()=>o.destroy()})}this.cameras.main.shake(120,.008*k)}lightning(x,y,k){let g=this.add.graphics().setBlendMode(Phaser.BlendModes.ADD);for(let n=0;n<k+1;n++){let px=x+Phaser.Math.Between(-8,8),py=35;g.lineStyle(n?2:5,n?0x76d7ff:0xffffff,n?.8:1);g.beginPath();g.moveTo(px,py);while(py<y){py+=Phaser.Math.Between(15,30);px+=Phaser.Math.Between(-25,25);g.lineTo(px,Math.min(py,y))}g.strokePath()}let glow=this.add.circle(x,y,12,0x8fd3ff,.9).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:[g,glow],alpha:0,duration:260,delay:80,onComplete:()=>{g.destroy();glow.destroy()}});this.cameras.main.flash(80,180,220,255,false)}shock(x,y,k){for(let i=0;i<3;i++){let r=this.add.circle(x,y,12,0xffffff,0).setStrokeStyle(5-i, [0xffffff,0x8fd3ff,0xb16cff][i],.9).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:r,scale:(5+i*2)*k,alpha:0,duration:420+i*100,ease:'Cubic.easeOut',onComplete:()=>r.destroy()})}for(let i=0;i<16*k;i++){let a=Math.random()*6.283,o=this.add.rectangle(x,y,Phaser.Math.Between(3,8),2,0xffffff,.8).setRotation(a);this.tweens.add({targets:o,x:x+Math.cos(a)*Phaser.Math.Between(55,130)*k,y:y+Math.sin(a)*Phaser.Math.Between(55,130)*k,alpha:0,duration:380,onComplete:()=>o.destroy()})}this.cameras.main.shake(90,.004*k)}aura(x,y,k){let group=[];for(let i=0;i<35*k;i++){let a=Math.random()*6.283,r=Phaser.Math.Between(20,65),o=this.add.circle(x+Math.cos(a)*r,y+Math.sin(a)*r,Phaser.Math.Between(2,6),i%2?0xb16cff:0x55d6be,.8).setBlendMode(Phaser.BlendModes.ADD);group.push(o);this.tweens.add({targets:o,y:o.y-Phaser.Math.Between(35,100),x:x+(o.x-x)*.35,alpha:0,scale:1.8,duration:Phaser.Math.Between(500,1000),onComplete:()=>o.destroy()})}let halo=this.add.circle(x,y,28,0x7b61ff,.22).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:halo,scale:3*k,alpha:0,duration:800,onComplete:()=>halo.destroy()})}play(x=179,y=170){let k=intensity===2?2:1;if(this.mode==='burst')this.burst(x,y,k);if(this.mode==='lightning')this.lightning(x,y,k);if(this.mode==='shock')this.shock(x,y,k);if(this.mode==='aura')this.aura(x,y,k)}}new Phaser.Game({type:Phaser.AUTO,width:358,height:340,parent:'game',backgroundColor:'#060911',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[FX]});document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(!S)return;S.mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));const d={burst:['① 爆発・火花','中心フラッシュ、火花、煙、カメラ振動を重ねて一発の爆発に見せる。'],lightning:['② 稲妻・落雷','Graphicsで折れ線を瞬間生成し、加算発光とフラッシュを重ねる。'],shock:['③ 衝撃波・リング','複数リングを時間差で拡大し、破片を放射して衝撃の広がりを作る。'],aura:['④ オーラ・エネルギー','発光粒子を上昇・収束させ、中心のハローと重ねてエネルギー感を作る。']}[S.mode];ttl.textContent=d[0];desc.textContent=d[1];log.textContent=`強度：${intensity===2?'強':'標準'} / 画面をタップしても発動できます`});document.getElementById('play').onclick=()=>S?.play();document.getElementById('weak').onclick=()=>{intensity=1;log.textContent='強度：標準'};document.getElementById('strong').onclick=()=>{intensity=2;log.textContent='強度：強（粒子・広がり増加）'}}window.addEventListener('error',()=>diag.innerHTML='<span class="ng">RUNTIME ERROR</span>');window.addEventListener('unhandledrejection',()=>diag.innerHTML='<span class="ng">PROMISE ERROR</span>');load();</script></body></html>
