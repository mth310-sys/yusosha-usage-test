<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 10</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced9.html">← Advanced 9</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>const diag=document.getElementById('diag');let booted=false;function ls(src,n,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1],a[i][0]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}function boot(){if(booted)return;booted=true;try{const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 10',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu'));s.add.text(195,70,t,{fontSize:'22px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'12px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['群れ分裂・合流','swarm'],['液体メタボール風','metaball'],['レーザー視界網','lasergrid'],['ボス攻撃予告','telegraph'],['ノード接続パズル','nodes'],['重力レンズ風','lens'],['リズム同期演出','rhythm'],['スロット演出合成','slotfx']];class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 10',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'挙動・予告・パズル・演出合成 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}class Swarm extends Phaser.Scene{constructor(){super('swarm')}create(){panel(this,'群れ分裂・合流','1つの群れが障害物を避けて二手に分かれ再合流');this.cameras.main.setBackgroundColor('#101922');let os=[];for(let i=0;i<45;i++)os.push({o:this.add.circle(30+Math.random()*50,260+Math.random()*120,5,0x55d6be),v:1+Math.random()});this.add.rectangle(195,330,55,210,0x475569);this.events.on('update',()=>os.forEach(p=>{p.o.x+=p.v;if(p.o.x>150&&p.o.x<240&&Math.abs(p.o.y-330)<125)p.o.y+=p.o.y<330?-1.3:1.3;if(p.o.x>380){p.o.x=15;p.o.y=280+Math.random()*100}}));note(this,'用途：群れAI、敵集団、交通、群衆演出')}}class Meta extends Phaser.Scene{constructor(){super('metaball')}create(){panel(this,'液体メタボール風','円同士を重ねて有機的な液体っぽい動き');this.cameras.main.setBackgroundColor('#090e18');let bs=[];for(let i=0;i<14;i++){let o=this.add.circle(195,330,18+Math.random()*22,0x4ea5ff,.32);bs.push({o,a:Math.random()*6.28,r:30+Math.random()*130,s:.005+Math.random()*.01})}this.events.on('update',(_,dt)=>bs.forEach(b=>{b.a+=b.s*dt;b.o.setPosition(195+Math.cos(b.a)*b.r,330+Math.sin(b.a*1.3)*b.r*.65)}));note(this,'用途：液体背景、魔力、スライム、エネルギー')}}class Laser extends Phaser.Scene{constructor(){super('lasergrid')}create(){panel(this,'レーザー視界網','動くレーザーに触れたかをリアルタイム判定');this.cameras.main.setBackgroundColor('#160d12');let p=this.add.circle(195,450,16,0xffd166).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(x,y));let g=this.add.graphics(),t=0,tx=this.add.text(195,510,'SAFE',{fontSize:'22px'}).setOrigin(.5);this.events.on('update',(_,dt)=>{t+=dt*.002;g.clear().lineStyle(3,0xff3355,.8);let hit=false;for(let i=0;i<5;i++){let y=210+i*55+Math.sin(t+i)*35;g.lineBetween(35,y,355,y);if(Math.abs(p.y-y)<18)hit=true}tx.setText(hit?'DETECTED!':'SAFE').setColor(hit?'#ff6b6b':'#8ef0a8')});note(this,'用途：ステルス、罠、警備、回避ゲーム')}}class Telegraph extends Phaser.Scene{constructor(){super('telegraph')}create(){panel(this,'ボス攻撃予告','危険範囲を先に表示してから攻撃を発生');this.cameras.main.setBackgroundColor('#171018');let btn=this.add.rectangle(195,500,180,40,0x7c2d12).setInteractive();this.add.text(195,500,'BOSS ATTACK',{fontSize:'14px'}).setOrigin(.5);btn.on('pointerdown',()=>{let x=80+Math.random()*230,c=this.add.circle(x,320,75,0xff3333,.12).setStrokeStyle(3,0xff5555,.8);this.tweens.add({targets:c,alpha:.45,scale:.25,duration:900,onComplete:()=>{c.destroy();let boom=this.add.circle(x,320,20,0xffd166);this.tweens.add({targets:boom,scale:5,alpha:0,duration:350,onComplete:()=>boom.destroy()});this.cameras.main.shake(180,.012)}})});note(this,'用途：ボス戦、AOE、予告音、回避アクション')}}class Nodes extends Phaser.Scene{constructor(){super('nodes')}create(){panel(this,'ノード接続パズル','点をタップしてネットワークを作る');this.cameras.main.setBackgroundColor('#0f1720');let pts=[],g=this.add.graphics(),last=null;for(let i=0;i<12;i++){let o=this.add.circle(55+(i%4)*95,190+Math.floor(i/4)*120,14,0x4ea5d9).setInteractive();pts.push(o);o.on('pointerdown',()=>{if(last&&last!==o){g.lineStyle(4,0x55d6be,.7).lineBetween(last.x,last.y,o.x,o.y)}o.setFillStyle(0xffd166);last=o})}note(this,'用途：配線、スキルツリー、回路、経路パズル')}}class Lens extends Phaser.Scene{constructor(){super('lens')}create(){panel(this,'重力レンズ風','中心の周囲で星が曲げられるような錯視');this.cameras.main.setBackgroundColor('#030611');let stars=[];for(let i=0;i<100;i++)stars.push({o:this.add.circle(Math.random()*390,150+Math.random()*370,1+Math.random()*2,0xffffff,.8),x:0,y:0});stars.forEach(s=>{s.x=s.o.x;s.y=s.o.y});this.events.on('update',()=>stars.forEach(s=>{let dx=s.x-195,dy=s.y-330,d=Math.hypot(dx,dy)||1,f=Math.max(0,1-d/180)*35;s.o.setPosition(s.x+dx/d*f,s.y+dy/d*f)}));this.add.circle(195,330,34,0x000000).setStrokeStyle(3,0x8b5cf6,.7);note(this,'用途：宇宙、ワープ、ブラックホール、特殊背景')}}class Rhythm extends Phaser.Scene{constructor(){super('rhythm')}create(){panel(this,'リズム同期演出','一定拍ごとに画面・UI・オブジェクトを同期');this.cameras.main.setBackgroundColor('#10101c');let beat=0,r=this.add.circle(195,330,70,0x8b5cf6,.35),tx=this.add.text(195,330,'BEAT',{fontSize:'24px'}).setOrigin(.5);this.time.addEvent({delay:500,loop:true,callback:()=>{beat++;r.setScale(.65);this.tweens.add({targets:r,scale:1.25,duration:420,ease:'Quad.easeOut'});tx.setText('BEAT '+beat);if(beat%4===0)this.cameras.main.flash(90,100,70,180)}});note(this,'用途：音ゲー、BGM同期、演出テンポ、LED同期')}}class SlotFX extends Phaser.Scene{constructor(){super('slotfx')}create(){panel(this,'スロット演出合成','リール風表示＋発光＋揺れ＋フラッシュを合成');this.cameras.main.setBackgroundColor('#120e05');let sy=['7','★','BAR'],rs=[];for(let i=0;i<3;i++){let box=this.add.rectangle(95+i*100,320,82,130,0x181818).setStrokeStyle(3,0xd4af37),t=this.add.text(95+i*100,320,'7',{fontSize:'45px',fontStyle:'bold',color:'#ffd166'}).setOrigin(.5);rs.push(t)}let b=this.add.rectangle(195,500,190,44,0x8a4b08).setInteractive();this.add.text(195,500,'SPIN / CHANCE',{fontSize:'15px',fontStyle:'bold'}).setOrigin(.5);b.on('pointerdown',()=>{let n=0,e=this.time.addEvent({delay:70,repeat:18,callback:()=>{rs.forEach(t=>t.setText(sy[Math.floor(Math.random()*3)]));if(++n===19){rs.forEach(t=>t.setText('7'));this.cameras.main.flash(250,255,210,70);this.cameras.main.shake(450,.012);rs.forEach((t,i)=>this.tweens.add({targets:t,scale:1.5,yoyo:true,duration:300,delay:i*90}))}}})});note(this,'用途：リール、当選告知、チャンス演出、遊技機表現')}}new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Swarm,Meta,Laser,Telegraph,Nodes,Lens,Rhythm,SlotFX]})}catch(e){diag.innerHTML='<span class="ng">ERROR '+String(e.message||e)+'</span>'}}load();</script></body></html>
