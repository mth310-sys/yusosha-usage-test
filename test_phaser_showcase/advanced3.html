<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced2.html">← Advanced 2</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){
 const s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
 s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};
 s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};
 document.head.appendChild(s)
}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;
 Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 3',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 const ITEMS=[['Loader進捗','loader'],['BitmapText風比較','bitmap'],['追尾弾','homing'],['ドラッグ&ドロップ','drop'],['カメラ分割','split'],['残像エフェクト','trail'],['弾幕パターン','bulletHell'],['疑似シェーダー演出','pseudoFx']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 3',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'見た目で分かる演出・ゲーム機能 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 3 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class LoaderScene extends Phaser.Scene{constructor(){super('loader')}create(){this.cameras.main.setBackgroundColor('#121a24');panel(this,'Loader進捗','素材読み込み時の進捗UIを再現');const bar=this.add.rectangle(195,315,0,34,0x55d6be).setOrigin(0,.5);this.add.rectangle(195,315,280,34).setOrigin(.5).setStrokeStyle(3,0xffffff);const t=this.add.text(195,375,'0%',{fontSize:'28px'}).setOrigin(.5);let p=0;this.time.addEvent({delay:80,loop:true,callback:()=>{p+=Phaser.Math.Between(2,7);if(p>100)p=0;bar.width=2.8*p;t.setText(p+'%')}});note(this,'実際のpreloadでは画像・音声のロード率表示に使える')}}
 class BitmapScene extends Phaser.Scene{constructor(){super('bitmap')}create(){this.cameras.main.setBackgroundColor('#1a1b25');panel(this,'BitmapText風比較','文字をTexture化して使う考え方を比較');const normal=this.add.text(195,245,'PHASER TEXT',{fontSize:'30px',fontStyle:'bold'}).setOrigin(.5);const tex=this.textures.createCanvas('textTex',300,70),ctx=tex.getContext();ctx.clearRect(0,0,300,70);ctx.font='bold 32px sans-serif';ctx.fillStyle='#ffd166';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('TEXTURE TEXT',150,35);tex.refresh();this.add.image(195,360,'textTex');this.tweens.add({targets:normal,scale:1.12,duration:700,yoyo:true,repeat:-1});note(this,'BitmapText本番では専用フォントAtlasで高速・安定表示が可能')}}
 class Homing extends Phaser.Scene{constructor(){super('homing')}create(){this.cameras.main.setBackgroundColor('#101a20');panel(this,'追尾弾','毎フレーム角度を更新して対象を追う');dot(this,'hBullet',0xffd166,20);const target=this.add.circle(195,300,26,0xff6b6b).setStrokeStyle(3,0xffffff);this.tweens.add({targets:target,x:{from:90,to:300},y:{from:220,to:420},duration:2600,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});const bullets=[];this.time.addEvent({delay:600,loop:true,callback:()=>{const b=this.add.image(195,520,'hBullet');b.speed=120;bullets.push(b)}});this.events.on('update',(_,dt)=>bullets.forEach(b=>{if(!b.active)return;const a=Phaser.Math.Angle.Between(b.x,b.y,target.x,target.y);b.x+=Math.cos(a)*b.speed*dt/1000;b.y+=Math.sin(a)*b.speed*dt/1000;if(Phaser.Math.Distance.Between(b.x,b.y,target.x,target.y)<25){b.destroy();this.cameras.main.flash(70,255,180,120)}}));note(this,'用途例：追尾ミサイル、吸い込み演出、誘導アイコン')}}
 class DropScene extends Phaser.Scene{constructor(){super('drop')}create(){this.cameras.main.setBackgroundColor('#191724');panel(this,'ドラッグ&ドロップ','掴む→運ぶ→指定場所へ落とす');const zone=this.add.rectangle(195,400,180,100,0x26344a,.8).setStrokeStyle(3,0x8fd3ff);this.add.text(195,400,'DROP ZONE',{fontSize:'18px'}).setOrigin(.5);const card=this.add.rectangle(195,220,90,120,0xffd166).setStrokeStyle(3,0xffffff).setInteractive({draggable:true});this.add.text(195,220,'CARD',{fontSize:'18px',color:'#111'}).setOrigin(.5);this.input.setDraggable(card);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));this.input.on('dragend',(p,o)=>{if(Phaser.Geom.Intersects.RectangleToRectangle(o.getBounds(),zone.getBounds())){o.setPosition(195,400);this.cameras.main.flash(120,120,220,255)}else o.setPosition(195,220)});note(this,'用途例：カード、装備、アイテム配置、パズル')}}
 class SplitScene extends Phaser.Scene{constructor(){super('split')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'カメラ分割','1つのSceneを2画面に分けて別視点で表示');for(let i=0;i<20;i++)this.add.rectangle(25+i*55,300,35,90,i%2?0x4ea5d9:0x55d6be);const a=this.add.circle(120,270,22,0xffd166),b=this.add.circle(900,330,22,0xff6b6b);this.tweens.add({targets:a,x:900,duration:5000,yoyo:true,repeat:-1});this.tweens.add({targets:b,x:120,duration:5000,yoyo:true,repeat:-1});this.cameras.main.setViewport(0,0,195,600).setBounds(0,0,1100,600).startFollow(a,true,.08,.08);const c2=this.cameras.add(195,0,195,600).setBounds(0,0,1100,600);c2.startFollow(b,true,.08,.08);this.add.rectangle(195,300,4,600,0xffffff).setScrollFactor(0).setDepth(1000);note(this,'用途例：対戦、同時演出、左右比較、2地点監視')}}
 class TrailScene extends Phaser.Scene{constructor(){super('trail')}create(){this.cameras.main.setBackgroundColor('#101421');panel(this,'残像エフェクト','移動物体の過去位置を薄く残す');dot(this,'trailDot',0x66e8ff,42);const s=this.add.image(80,320,'trailDot');const ghosts=[];for(let i=0;i<12;i++)ghosts.push(this.add.image(s.x,s.y,'trailDot').setAlpha(.35*(1-i/12)));this.tweens.add({targets:s,x:310,y:250,duration:1400,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});let hist=[];this.events.on('update',()=>{hist.unshift({x:s.x,y:s.y});if(hist.length>48)hist.pop();ghosts.forEach((g,i)=>{const p=hist[i*4];if(p)g.setPosition(p.x,p.y)})});note(this,'用途例：高速移動、斬撃、光跡、役物残像')}}
 class BulletHell extends Phaser.Scene{constructor(){super('bulletHell')}create(){this.cameras.main.setBackgroundColor('#15111b');panel(this,'弾幕パターン','角度計算で多数の弾を円形に放つ');dot(this,'bh',0xff6b6b,14);const bullets=[];let ang=0;this.time.addEvent({delay:300,loop:true,callback:()=>{for(let i=0;i<18;i++){const a=ang+i*(Math.PI*2/18),b=this.add.image(195,300,'bh');b.vx=Math.cos(a)*120;b.vy=Math.sin(a)*120;bullets.push(b)}ang+=.17}});this.events.on('update',(_,dt)=>bullets.forEach(b=>{if(!b.active)return;b.x+=b.vx*dt/1000;b.y+=b.vy*dt/1000;if(b.x<-20||b.x>410||b.y<120||b.y>620)b.destroy()}));note(this,'用途例：シューティング、花火、放射演出、払い出演出')}}
 class PseudoFx extends Phaser.Scene{constructor(){super('pseudoFx')}create(){this.cameras.main.setBackgroundColor('#11151e');panel(this,'疑似シェーダー演出','色・Blend・Alphaを重ねてGPU系演出を疑似再現');const core=this.add.circle(195,310,65,0x7a5cff).setBlendMode(Phaser.BlendModes.ADD);const glow=this.add.circle(195,310,120,0x4ea5ff,.16).setBlendMode(Phaser.BlendModes.ADD);const ring=this.add.circle(195,310,95,0xffffff,.05).setStrokeStyle(4,0x8fd3ff,.9).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:[core,glow,ring],scale:{from:.8,to:1.35},alpha:{from:.25,to:.8},duration:850,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});this.tweens.add({targets:ring,angle:360,duration:2200,repeat:-1});note(this,'本物のPipeline/PostFXへ進む前の「発光・オーラ」実験')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,LoaderScene,BitmapScene,Homing,DropScene,SplitScene,TrailScene,BulletHell,PseudoFx]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
