<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 17</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced16.html">← Advanced 16</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR '+String(e.message||e.error||e)+'</span>');window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR '+String(e.reason?.message||e.reason||e)+'</span>');
function ls(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}
function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 17',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,68,t,{fontSize:'21px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,100,d,{fontSize:'11px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);
const I=[['固定タイムステップ','fixed'],['オブジェクトプール実戦','pool'],['画面外カリング','cull'],['空間分割グリッド','spatial'],['イベントバス','eventbus'],['状態機械デバッガ','fsm'],['決定論リプレイ','replay'],['Sceneレイヤー構成','layers']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'Phaser Advanced 17',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,58,'ゲームエンジン内部技術 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=99;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Fixed extends Phaser.Scene{constructor(){super('fixed')}create(){panel(this,'固定タイムステップ','FPSが揺れても内部シミュレーションを一定刻みで進める');this.cameras.main.setBackgroundColor('#101827');this.a=this.add.circle(60,300,14,0x55d6be);this.b=this.add.circle(60,380,14,0xffd166);this.ax=60;this.bx=60;this.acc=0;this.info=this.add.text(20,135,'',{fontSize:'12px'});note(this,'上：delta依存 / 下：16.67ms固定刻み')}update(_,dt){this.ax+=dt*.08;if(this.ax>360)this.ax=30;this.a.x=this.ax;this.acc+=Math.min(dt,100);while(this.acc>=16.67){this.bx+=16.67*.08;if(this.bx>360)this.bx=30;this.acc-=16.67}this.b.x=this.bx;this.info.setText(`frame delta ${dt.toFixed(1)}ms / FPS ${Math.round(this.game.loop.actualFps)}`)}}
class Pool extends Phaser.Scene{constructor(){super('pool')}create(){panel(this,'オブジェクトプール実戦','生成破棄を繰り返さず再利用して弾を回す');this.cameras.main.setBackgroundColor('#0d1620');this.pool=[];for(let i=0;i<80;i++){let o=this.add.circle(-50,-50,4,0x8fd3ff).setVisible(false);o.active2=false;this.pool.push(o)}this.used=0;this.info=this.add.text(20,135,'',{fontSize:'12px'});this.add.text(195,500,'TAPで20発',{fontSize:'15px',backgroundColor:'#24405c',padding:{x:15,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{for(let n=0;n<20;n++){let o=this.pool.find(x=>!x.active2);if(!o)break;o.active2=true;o.setVisible(true).setPosition(195,430);o.vx=(Math.random()-.5)*4;o.vy=-2-Math.random()*4}});note(this,'弾・敵・演出片など大量再利用に有効')}update(){let c=0;this.pool.forEach(o=>{if(!o.active2)return;c++;o.x+=o.vx;o.y+=o.vy;if(o.y<130||o.x<0||o.x>390){o.active2=false;o.setVisible(false)}});this.info.setText(`Pool 80 / 使用中 ${c} / 新規生成 0`)}}
class Cull extends Phaser.Scene{constructor(){super('cull')}create(){panel(this,'画面外カリング','大きな世界のうち見えている物体だけ描画する考え方');this.cameras.main.setBounds(0,0,1600,600);this.world=[];for(let i=0;i<500;i++){let o=this.add.rectangle(Math.random()*1600,150+Math.random()*360,5,5,0xa78bfa);this.world.push(o)}this.camX=0;this.info=this.add.text(20,135,'',{fontSize:'12px'}).setScrollFactor(0);this.input.on('pointermove',p=>{if(p.isDown)this.camX=Phaser.Math.Clamp(this.camX-p.velocity.x,0,1210)});note(this,'ドラッグで横移動 / 可視範囲だけvisible=true').setScrollFactor(0)}update(){this.cameras.main.scrollX=this.camX;let left=this.camX-20,right=this.camX+410,c=0;this.world.forEach(o=>{let v=o.x>=left&&o.x<=right;o.visible=v;if(v)c++});this.info.setText(`World 500 / 描画中 ${c}`)}}
class Spatial extends Phaser.Scene{constructor(){super('spatial')}create(){panel(this,'空間分割グリッド','近接判定を全組み合わせではなく近いマスだけに絞る');this.cameras.main.setBackgroundColor('#111827');this.n=[];for(let i=0;i<300;i++){let o=this.add.circle(Math.random()*390,150+Math.random()*350,3,0x55d6be);o.vx=(Math.random()-.5);o.vy=(Math.random()-.5);this.n.push(o)}this.info=this.add.text(20,135,'',{fontSize:'12px'});note(this,'300体でも候補ペア数を大幅に削れる')}update(){let grid=new Map(),size=50;this.n.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<0||o.x>390)o.vx*=-1;if(o.y<150||o.y>520)o.vy*=-1;let k=`${Math.floor(o.x/size)},${Math.floor(o.y/size)}`;if(!grid.has(k))grid.set(k,[]);grid.get(k).push(o)});let checks=0;for(let arr of grid.values())checks+=arr.length*(arr.length-1)/2;this.info.setText(`300体 / 同一セル候補 ${Math.round(checks)} / 全探索なら 44850`)}}
class EventBus extends Phaser.Scene{constructor(){super('eventbus')}create(){panel(this,'イベントバス','直接つながっていないシステム同士をイベントで連携');this.cameras.main.setBackgroundColor('#16121d');this.bus=new Phaser.Events.EventEmitter();this.score=0;this.hp=100;this.log=this.add.text(30,170,'',{fontSize:'13px',lineSpacing:8});this.bus.on('enemyDown',()=>{this.score+=100;this.bus.emit('scoreChanged')});this.bus.on('scoreChanged',()=>this.draw('SCORE更新'));this.bus.on('damage',v=>{this.hp-=v;this.draw(`DAMAGE ${v}`)});this.add.text(110,430,'敵撃破',{fontSize:'15px',backgroundColor:'#28495d',padding:{x:14,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.bus.emit('enemyDown'));this.add.text(275,430,'被弾',{fontSize:'15px',backgroundColor:'#5d2835',padding:{x:14,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.bus.emit('damage',10));this.draw('READY');note(this,'UI・音・実績・戦闘を疎結合にできる')}draw(m){this.log.setText(`${m}\n\nSCORE ${this.score}\nHP ${this.hp}`)}}
class FSM extends Phaser.Scene{constructor(){super('fsm')}create(){panel(this,'状態機械デバッガ','AIの状態を明示して遷移を観察する');this.cameras.main.setBackgroundColor('#10151c');this.states=['IDLE','PATROL','CHASE','ATTACK'];this.i=0;this.txt=this.add.text(195,280,'IDLE',{fontSize:'36px',fontStyle:'bold'}).setOrigin(.5);this.hist=this.add.text(195,360,'履歴: IDLE',{fontSize:'12px',color:'#b7c1d6'}).setOrigin(.5);this.add.text(195,460,'TAPで次状態',{fontSize:'15px',backgroundColor:'#26384f',padding:{x:18,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{this.i=(this.i+1)%this.states.length;let s=this.states[this.i];this.txt.setText(s);this.hist.setText(this.hist.text+' → '+s)});note(this,'複雑な敵AIや画面遷移の追跡が楽になる')}}
class Replay extends Phaser.Scene{constructor(){super('replay')}create(){panel(this,'決定論リプレイ','入力だけ記録して同じ動きを再生する考え方');this.cameras.main.setBackgroundColor('#111827');this.p=this.add.circle(195,330,14,0xffd166);this.rec=[];this.replaying=false;this.idx=0;this.msg=this.add.text(195,150,'画面をドラッグして記録',{fontSize:'12px'}).setOrigin(.5);this.input.on('pointermove',q=>{if(q.isDown&&!this.replaying){this.p.setPosition(q.x,q.y);this.rec.push({x:q.x,y:q.y})}});this.add.text(195,500,'REPLAY',{fontSize:'16px',backgroundColor:'#4b305d',padding:{x:18,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{if(!this.rec.length)return;this.replaying=true;this.idx=0;this.msg.setText(`再生中 ${this.rec.length} frames`)});note(this,'本格実装では乱数シード＋入力時刻も記録')}update(){if(this.replaying){let q=this.rec[this.idx++];if(q)this.p.setPosition(q.x,q.y);else{this.replaying=false;this.msg.setText('再生完了')}}}}
class Layers extends Phaser.Scene{constructor(){super('layers')}create(){panel(this,'Sceneレイヤー構成','ゲーム・HUD・ポーズ表示を別レイヤー感覚で重ねる');this.cameras.main.setBackgroundColor('#0e1720');for(let i=0;i<25;i++)this.add.circle(Math.random()*390,150+Math.random()*350,5,0x355a6b);this.player=this.add.circle(195,330,18,0xffd166);this.hud=this.add.container(0,0).setDepth(100);this.hud.add(this.add.rectangle(195,145,360,38,0x091018,.8));this.hud.add(this.add.text(28,135,'HP 100   SCORE 02400',{fontSize:'13px'}));this.pause=this.add.container(0,0).setDepth(200).setVisible(false);this.pause.add(this.add.rectangle(195,330,330,260,0x000000,.75));this.pause.add(this.add.text(195,310,'PAUSE',{fontSize:'35px',fontStyle:'bold'}).setOrigin(.5));this.add.text(195,500,'PAUSE切替',{fontSize:'15px',backgroundColor:'#32445d',padding:{x:16,y:8}}).setOrigin(.5).setInteractive().setDepth(300).on('pointerdown',()=>this.pause.setVisible(!this.pause.visible));note(this,'実際は複数Sceneを並列起動してHUDだけ残す構成も可能')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#0d1422',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Menu,Fixed,Pool,Cull,Spatial,EventBus,FSM,Replay,Layers]})}load();
</script></body></html>
