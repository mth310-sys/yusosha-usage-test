<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 7</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head>
<body><div id="wrap"><div id="top"><a href="./advanced6.html">← Advanced 6</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');let booted=false;
window.addEventListener('error',e=>{if(!booted)diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>'});window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.reason?.message||e.reason||'Promise')+'</span>');
function loadScript(src,label,timeout=6000){return new Promise((ok,ng)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(done)return;done=true;s.remove();ng(new Error(label+' timeout'))},timeout);s.src=src;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(timer);window.Phaser?ok():ng(new Error(label+' Phaser未検出'))};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);ng(new Error(label+' error'))};document.head.appendChild(s)})}
async function loadPhaser(){const sources=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<sources.length;i++){const [name,url]=sources[i];diag.textContent=`Phaser読込 ${i+1}/3: ${name}…`;try{await loadScript(url,name);diag.textContent=`Phaser OK (${name}) / 起動中…`;boot();return}catch(e){console.warn(e)}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗 / 再読込してください</span>'}
function boot(){if(booted)return;booted=true;try{const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});o.setResolution?.(DPR);return o};
const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 7',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);
const ITEMS=[['Radar Scanner','radar'],['Ricochet Laser','ricochet'],['Spring / Elastic','spring'],['Fog Reveal','fog'],['Enemy State Machine','fsm'],['Radial Menu','radial'],['Time Dilation','slowmo'],['Screen Wrap','wrap']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 7',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'探索・AI・時間・物理感 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 7 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
class Radar extends Phaser.Scene{constructor(){super('radar')}create(){this.cameras.main.setBackgroundColor('#071510');panel(this,'Radar Scanner','回転する走査線で対象を検出');const cx=195,cy=330;[60,110,155].forEach(r=>this.add.circle(cx,cy,r,0,0).setStrokeStyle(1,0x55d6be,.4));const sweep=this.add.rectangle(cx,cy,150,4,0x7dffca,.8).setOrigin(0,.5),blips=[];for(let i=0;i<10;i++){const a=Math.random()*6.28,r=35+Math.random()*110;blips.push(this.add.circle(cx+Math.cos(a)*r,cy+Math.sin(a)*r,5,0xffd166,.18))}this.events.on('update',()=>{sweep.rotation+=.025;blips.forEach(b=>{if(Math.abs(Phaser.Math.Angle.Wrap(Math.atan2(b.y-cy,b.x-cx)-sweep.rotation))<.12){b.setAlpha(1);this.tweens.add({targets:b,alpha:.18,duration:700})}})});note(this,'用途例：索敵、ミニマップ、宝探し、センサー')}}
class Ricochet extends Phaser.Scene{constructor(){super('ricochet')}create(){this.cameras.main.setBackgroundColor('#10131b');panel(this,'Ricochet Laser','壁で反射するレーザー軌道');const g=this.add.graphics(),p={x:90,y:410};let vx=4.4,vy=-3.1;const draw=()=>{g.clear().lineStyle(5,0x66c7ff,.9).beginPath().moveTo(p.x,p.y);let x=p.x,y=p.y,dx=vx,dy=vy;for(let k=0;k<5;k++){const tx=dx>0?(345-x)/dx:(45-x)/dx,ty=dy>0?(500-y)/dy:(155-y)/dy,t=Math.min(tx>0?tx:9999,ty>0?ty:9999);x+=dx*t;y+=dy*t;g.lineTo(x,y);if(x<47||x>343)dx*=-1;if(y<157||y>498)dy*=-1}g.strokePath()};draw();this.add.rectangle(195,327,300,345,0,0).setStrokeStyle(2,0x71809b);this.input.on('pointermove',q=>{if(q.y<140)return;vx=(q.x-p.x)/60;vy=(q.y-p.y)/60;draw()});note(this,'用途例：反射弾、レーザー、ビリヤード')}}
class Spring extends Phaser.Scene{constructor(){super('spring')}create(){this.cameras.main.setBackgroundColor('#171621');panel(this,'Spring / Elastic','バネのような柔らかい追従');const t=this.add.circle(195,260,18,0xffd166).setInteractive({draggable:true}),f=this.add.circle(195,420,28,0x55d6be);this.input.setDraggable(t);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));let vx=0,vy=0;const g=this.add.graphics();this.events.on('update',()=>{vx+=(t.x-f.x)*.018;vy+=(t.y-f.y)*.018;vx*=.88;vy*=.88;f.x+=vx;f.y+=vy;g.clear().lineStyle(2,0x8fd3ff,.5).lineBetween(t.x,t.y,f.x,f.y)});note(this,'用途例：UI、尻尾、吊り下げ、カメラ追従')}}
class Fog extends Phaser.Scene{constructor(){super('fog')}create(){this.cameras.main.setBackgroundColor('#132019');panel(this,'Fog Reveal','指で暗闇を削って下を表示');for(let i=0;i<35;i++)this.add.rectangle(35+(i%7)*53,165+Math.floor(i/7)*68,36,42,[0x315f59,0x3c536c,0x705c36][i%3]);const rt=this.add.renderTexture(0,130,390,390).setOrigin(0);rt.fill(0x000000,.88);if(!this.textures.exists('fogBrush7')){const b=this.make.graphics({add:false});b.fillStyle(0xffffff).fillCircle(42,42,40).generateTexture('fogBrush7',84,84);b.destroy()}const erase=p=>{if(p.y>130&&p.y<520)rt.erase('fogBrush7',p.x-42,p.y-172)};this.input.on('pointerdown',erase);this.input.on('pointermove',p=>p.isDown&&erase(p));note(this,'用途例：探索、隠し絵、スクラッチ、視界')}}
class FSM extends Phaser.Scene{constructor(){super('fsm')}create(){this.cameras.main.setBackgroundColor('#18151a');panel(this,'Enemy State Machine','PATROL → CHASE → ATTACK');const p=this.add.circle(195,430,22,0xffd166).setInteractive({draggable:true}),e=this.add.rectangle(90,250,48,48,0x4ea5d9),tx=this.add.text(195,145,'STATE: PATROL',{fontSize:'16px'}).setOrigin(.5);this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(x,y));let dir=1;this.events.on('update',(_,dt)=>{const d=Phaser.Math.Distance.Between(e.x,e.y,p.x,p.y),st=d<75?'ATTACK':d<190?'CHASE':'PATROL';if(st==='PATROL'){e.x+=dir*55*dt/1000;if(e.x<70||e.x>320)dir*=-1;e.setFillStyle(0x4ea5d9)}else if(st==='CHASE'){const a=Phaser.Math.Angle.Between(e.x,e.y,p.x,p.y);e.x+=Math.cos(a)*85*dt/1000;e.y+=Math.sin(a)*85*dt/1000;e.setFillStyle(0xffd166)}else e.setFillStyle(0xff6b6b);tx.setText('STATE: '+st)});note(this,'用途例：敵AI、NPC、ボス行動、進行制御')}}
class Radial extends Phaser.Scene{constructor(){super('radial')}create(){this.cameras.main.setBackgroundColor('#151923');panel(this,'Radial Menu','放射状に展開するスマホ向けUI');const c=this.add.circle(195,330,42,0x293852).setInteractive();this.add.text(195,330,'MENU',{fontSize:'14px'}).setOrigin(.5);const ls=['攻撃','防御','道具','魔法','逃走','設定'],it=[];ls.forEach((l,i)=>{const a=-1.57+i*6.28/6,o=this.add.circle(195,330,31,[0xff6b6b,0x55d6be,0x4ea5d9,0xa78bfa,0xffd166,0x60a5fa][i]).setAlpha(0),t=this.add.text(195,330,l,{fontSize:'11px'}).setOrigin(.5).setAlpha(0);it.push({o,t,a})});let open=false;c.on('pointerdown',()=>{open=!open;it.forEach(({o,t,a},i)=>this.tweens.add({targets:[o,t],x:open?195+Math.cos(a)*120:195,y:open?330+Math.sin(a)*120:330,alpha:open?1:0,duration:220+i*25}))});note(this,'用途例：コマンド、武器選択、ショートカット')}}
class Slowmo extends Phaser.Scene{constructor(){super('slowmo')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'Time Dilation','ゲーム内時間を遅くしてスローモーション');const os=[];for(let i=0;i<12;i++){const o=this.add.circle(45+Math.random()*300,180+Math.random()*250,10,[0x55d6be,0xffd166,0xff6b6b][i%3]);o.vx=-120+Math.random()*240;o.vy=-120+Math.random()*240;os.push(o)}let scale=1;const tx=this.add.text(195,475,'TIME x1.00',{fontSize:'20px'}).setOrigin(.5),b=this.add.rectangle(195,520,200,38,0x293852).setInteractive();this.add.text(195,520,'SLOW MOTION',{fontSize:'14px'}).setOrigin(.5);b.on('pointerdown',()=>{scale=scale===1?.18:1;tx.setText('TIME x'+scale.toFixed(2))});this.events.on('update',(_,dt)=>os.forEach(o=>{o.x+=o.vx*dt/1000*scale;o.y+=o.vy*dt/1000*scale;if(o.x<30||o.x>360)o.vx*=-1;if(o.y<150||o.y>450)o.vy*=-1}));note(this,'用途例：必殺技、回避、決定瞬間、演出の溜め')}}
class Wrap extends Phaser.Scene{constructor(){super('wrap')}create(){this.cameras.main.setBackgroundColor('#0d1420');panel(this,'Screen Wrap','端から出ると反対側から戻る');const s=this.add.triangle(195,320,-18,-14,20,0,-18,14,0xffd166);s.vx=95;s.vy=58;this.events.on('update',(_,dt)=>{s.x+=s.vx*dt/1000;s.y+=s.vy*dt/1000;if(s.x<-20)s.x=410;if(s.x>410)s.x=-20;if(s.y<130)s.y=540;if(s.y>540)s.y=130});this.add.rectangle(195,335,350,390,0,0).setStrokeStyle(2,0x526580,.6);note(this,'用途例：宇宙ゲーム、無限フィールド、ループマップ')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Radar,Ricochet,Spring,Fog,FSM,Radial,Slowmo,Wrap]});}catch(e){booted=false;diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}loadPhaser();
</script></body></html>
