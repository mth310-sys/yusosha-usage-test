<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced6.html">← Advanced 6</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};document.head.appendChild(s)}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 7',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000).setScrollFactor(0);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5).setScrollFactor(0);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5).setScrollFactor(0)}
 const ITEMS=[['Radar Scanner','radar'],['Ricochet Laser','ricochet'],['Spring / Elastic','spring'],['Fog Reveal','fog'],['Enemy State Machine','fsm'],['Radial Menu','radial'],['Time Dilation','slowmo'],['Screen Wrap','wrap']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 7',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'探索・AI・時間・物理感 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 7 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class Radar extends Phaser.Scene{constructor(){super('radar')}create(){this.cameras.main.setBackgroundColor('#071510');panel(this,'Radar Scanner','回転する走査線と距離判定でレーダーを表現');const cx=195,cy=330;[60,110,155].forEach(r=>this.add.circle(cx,cy,r,0xffffff,0).setStrokeStyle(1,0x55d6be,.35));this.add.line(cx,cy,-155,0,155,0,0x55d6be,.25);this.add.line(cx,cy,0,-155,0,155,0x55d6be,.25);const sweep=this.add.rectangle(cx,cy,150,4,0x7dffca,.8).setOrigin(0,.5);const blips=[];for(let i=0;i<10;i++){const a=Phaser.Math.FloatBetween(0,Math.PI*2),r=Phaser.Math.FloatBetween(35,145);blips.push(this.add.circle(cx+Math.cos(a)*r,cy+Math.sin(a)*r,5,0xffd166,.18))}this.events.on('update',()=>{sweep.rotation+=.025;const a=sweep.rotation;blips.forEach(b=>{const ba=Math.atan2(b.y-cy,b.x-cx),diff=Math.abs(Phaser.Math.Angle.Wrap(ba-a));if(diff<.12){b.setAlpha(1);this.tweens.add({targets:b,alpha:.18,duration:700})}})});note(this,'用途例：索敵、ミニマップ、宝探し、センサー、探索演出')}}
 class Ricochet extends Phaser.Scene{constructor(){super('ricochet')}create(){this.cameras.main.setBackgroundColor('#10131b');panel(this,'Ricochet Laser','壁反射を計算してレーザーの軌道を描く');const g=this.add.graphics();let p={x:90,y:410},vx:4.4,vy:-3.1;const draw=()=>{g.clear();g.lineStyle(7,0x4ea5ff,.16);g.beginPath().moveTo(p.x,p.y);let x=p.x,y=p.y,dx=vx,dy=vy;for(let k=0;k<5;k++){let tx=dx>0?(345-x)/dx:(45-x)/dx,ty=dy>0?(500-y)/dy:(155-y)/dy,t=Math.min(tx>0?tx:9999,ty>0?ty:9999);x+=dx*t;y+=dy*t;g.lineTo(x,y);if(Math.abs(x-45)<2||Math.abs(x-345)<2)dx*=-1;if(Math.abs(y-155)<2||Math.abs(y-500)<2)dy*=-1}g.strokePath();g.lineStyle(2,0xaee8ff,1);g.strokePath()};draw();this.add.rectangle(195,327,300,345,0xffffff,0).setStrokeStyle(2,0x71809b);this.input.on('pointermove',q=>{if(q.y<140)return;vx=(q.x-p.x)/60;vy=(q.y-p.y)/60;if(Math.hypot(vx,vy)<.5)return;draw()});note(this,'用途例：反射弾、レーザー、ビリヤード、パズル照準')}}
 class Spring extends Phaser.Scene{constructor(){super('spring')}create(){this.cameras.main.setBackgroundColor('#171621');panel(this,'Spring / Elastic','バネっぽい追従で硬いTweenとは違う動きを作る');const target=this.add.circle(195,300,18,0xffd166).setInteractive({draggable:true});this.input.setDraggable(target);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));const follower=this.add.circle(195,420,28,0x55d6be).setStrokeStyle(3,0xffffff);let vx=0,vy=0;this.events.on('update',(_,dt)=>{const k=.018,damp=.88;vx+=(target.x-follower.x)*k*(dt/16.67);vy+=(target.y-follower.y)*k*(dt/16.67);vx*=damp;vy*=damp;follower.x+=vx;follower.y+=vy});this.add.line(0,0,target.x,target.y,follower.x,follower.y,0xffffff,.3).setOrigin(0);const line=this.add.graphics();this.events.on('update',()=>{line.clear().lineStyle(2,0x8fd3ff,.5).lineBetween(target.x,target.y,follower.x,follower.y)});note(this,'用途例：カメラ追従、UI、尻尾、吊り下げ、柔らかい操作感')}}
 class Fog extends Phaser.Scene{constructor(){super('fog')}create(){this.cameras.main.setBackgroundColor('#132019');panel(this,'Fog Reveal','指でなぞった場所だけ暗闇を削って地図を見せる');for(let i=0;i<35;i++)this.add.rectangle(35+(i%7)*53,165+Math.floor(i/7)*68,36,42,[0x315f59,0x3c536c,0x705c36][i%3]);const rt=this.add.renderTexture(0,130,390,390).setOrigin(0);rt.fill(0x000000,.88);const brush=this.make.graphics({add:false});brush.fillStyle(0xffffff,1).fillCircle(42,42,40);brush.generateTexture('fogBrush7',84,84);brush.destroy();rt.setBlendMode(Phaser.BlendModes.NORMAL);this.input.on('pointermove',p=>{if(p.isDown&&p.y>130&&p.y<520){rt.erase('fogBrush7',p.x-42,p.y-130-42)}});this.input.on('pointerdown',p=>{if(p.y>130&&p.y<520)rt.erase('fogBrush7',p.x-42,p.y-130-42)});note(this,'用途例：探索マップ、隠し絵、視界、スクラッチ、発見演出')}}
 class FSM extends Phaser.Scene{constructor(){super('fsm')}create(){this.cameras.main.setBackgroundColor('#18151a');panel(this,'Enemy State Machine','敵が PATROL→CHASE→ATTACK を状態で切り替える');const player=this.add.circle(195,430,22,0xffd166).setInteractive({draggable:true});this.input.setDraggable(player);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));const e=this.add.rectangle(90,250,48,48,0x4ea5d9);let dir=1,state='PATROL',cool=0;const tx=this.add.text(195,145,'STATE: PATROL',{fontSize:'16px'}).setOrigin(.5);this.events.on('update',(_,dt)=>{const d=Phaser.Math.Distance.Between(e.x,e.y,player.x,player.y);cool-=dt;if(d<75)state='ATTACK';else if(d<190)state='CHASE';else state='PATROL';if(state==='PATROL'){e.x+=dir*55*dt/1000;if(e.x<70||e.x>320)dir*=-1;e.setFillStyle(0x4ea5d9)}else if(state==='CHASE'){const a=Phaser.Math.Angle.Between(e.x,e.y,player.x,player.y);e.x+=Math.cos(a)*85*dt/1000;e.y+=Math.sin(a)*85*dt/1000;e.setFillStyle(0xffd166)}else{e.setFillStyle(0xff6b6b);if(cool<=0){cool=600;this.cameras.main.shake(80,.006)}}tx.setText('STATE: '+state)});note(this,'用途例：敵AI、NPC、ボス行動、演出状態、ゲーム進行制御')}}
 class Radial extends Phaser.Scene{constructor(){super('radial')}create(){this.cameras.main.setBackgroundColor('#151923');panel(this,'Radial Menu','中央から放射状に選択肢を展開するUI');const center=this.add.circle(195,330,42,0x293852).setInteractive();this.add.text(195,330,'MENU',{fontSize:'14px'}).setOrigin(.5);const labels=['攻撃','防御','道具','魔法','逃走','設定'];const items=[];labels.forEach((l,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;const c=this.add.circle(195,330,31,[0xff6b6b,0x55d6be,0x4ea5d9,0xa78bfa,0xffd166,0x60a5fa][i]).setAlpha(0).setScale(.2).setInteractive();const t=this.add.text(195,330,l,{fontSize:'11px'}).setOrigin(.5).setAlpha(0);items.push({c,t,a})});let open=false;center.on('pointerdown',()=>{open=!open;items.forEach(({c,t,a},i)=>{const x=open?195+Math.cos(a)*120:195,y=open?330+Math.sin(a)*120:330;this.tweens.add({targets:[c,t],x,y,alpha:open?1:0,scale:open?1:.2,duration:250+i*35,ease:'Back.easeOut'})})});items.forEach(({c,t},i)=>c.on('pointerdown',()=>{this.add.text(195,505,labels[i]+' SELECT',{fontSize:'18px',color:'#ffd166'}).setOrigin(.5).setAlpha(1);this.cameras.main.flash(80,120,180,255)}));note(this,'用途例：スマホ操作、コマンド、武器選択、ショートカット')}}
 class Slowmo extends Phaser.Scene{constructor(){super('slowmo')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'Time Dilation','ゲーム内時間だけを遅くして「スローモーション」を作る');const objs=[];for(let i=0;i<12;i++){const o=this.add.circle(Phaser.Math.Between(45,345),Phaser.Math.Between(180,430),10,[0x55d6be,0xffd166,0xff6b6b][i%3]);o.vx=Phaser.Math.FloatBetween(-120,120);o.vy=Phaser.Math.FloatBetween(-120,120);objs.push(o)}let scale=1;const tx=this.add.text(195,475,'TIME x1.0',{fontSize:'20px'}).setOrigin(.5);const b=this.add.rectangle(195,520,200,38,0x293852).setInteractive();this.add.text(195,520,'SLOW MOTION',{fontSize:'14px'}).setOrigin(.5);b.on('pointerdown',()=>{scale=scale===1?.18:1;tx.setText('TIME x'+scale.toFixed(2));this.cameras.main.flash(80,120,160,255)});this.events.on('update',(_,dt)=>objs.forEach(o=>{o.x+=o.vx*dt/1000*scale;o.y+=o.vy*dt/1000*scale;if(o.x<30||o.x>360)o.vx*=-1;if(o.y<150||o.y>450)o.vy*=-1}));note(this,'用途例：決定瞬間、回避、必殺技、期待感、演出の溜め')}}
 class Wrap extends Phaser.Scene{constructor(){super('wrap')}create(){this.cameras.main.setBackgroundColor('#0d1420');panel(this,'Screen Wrap','画面端から出た物体を反対側へつなぐ');const ship=this.add.triangle(195,320,-18,-14,20,0,-18,14,0xffd166).setInteractive({draggable:true});this.input.setDraggable(ship);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));ship.vx=95;ship.vy=58;this.events.on('update',(_,dt)=>{if(!this.input.activePointer.isDown){ship.x+=ship.vx*dt/1000;ship.y+=ship.vy*dt/1000}if(ship.x<-20)ship.x=410;if(ship.x>410)ship.x=-20;if(ship.y<130)ship.y=540;if(ship.y>540)ship.y=130});this.add.rectangle(195,335,350,390,0xffffff,0).setStrokeStyle(2,0x526580,.6);note(this,'用途例：宇宙ゲーム、無限フィールド、ループマップ、弾幕')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Radar,Ricochet,Spring,Fog,FSM,Radial,Slowmo,Wrap]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
