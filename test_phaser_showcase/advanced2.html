<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Advanced 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./advanced.html">← Advanced 1</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
function loadPhaser(){
 const s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
 s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};
 s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};
 document.head.appendChild(s)
}
function boot(){try{
 const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
 const old=Phaser.GameObjects.GameObjectFactory.prototype.text;
 Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};
 function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}
 function panel(sc,t,d){sc.add.text(18,18,'← Advanced 2',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
 const ITEMS=[['複数カメラ','multiCam'],['Tween連続演出','tweenChain'],['Group / Object Pool','pool'],['Registryデータ共有','registry'],['Pause / Resume','pause'],['スワイプ・長押し','gesture'],['Overlap判定','overlap'],['Camera Zoom / Rotate','camTransform']];
 class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 2',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'ゲーム構成・入力・管理 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 2 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
 class MultiCam extends Phaser.Scene{constructor(){super('multiCam')}create(){this.cameras.main.setBackgroundColor('#111827');panel(this,'複数カメラ','同じSceneを別々の視点で同時表示');for(let i=0;i<18;i++)this.add.rectangle(30+i*55,300,38,100,i%2?0x55d6be:0x4ea5d9);const p=this.add.circle(100,300,24,0xffd166).setStrokeStyle(3,0xffffff);this.tweens.add({targets:p,x:900,duration:5000,yoyo:true,repeat:-1});this.cameras.main.setBounds(0,0,1000,600).startFollow(p,true,.05,.05);const mini=this.cameras.add(235,150,135,110).setZoom(.35).setBackgroundColor('#081019');mini.setBounds(0,0,1000,600);mini.startFollow(p,true,.1,.1);this.add.rectangle(302.5,205,135,110).setScrollFactor(0).setStrokeStyle(3,0xffffff).setDepth(999);note(this,'用途例：ミニマップ、別窓演出、監視カメラ')}}
 class TweenChain extends Phaser.Scene{constructor(){super('tweenChain')}create(){this.cameras.main.setBackgroundColor('#211827');panel(this,'Tween連続演出','複数の動きを順番につないで1演出にする');const s=this.add.star(90,310,5,26,52,0xffd166).setStrokeStyle(3,0xffffff).setInteractive();const play=()=>{s.setPosition(90,310).setScale(1).setAlpha(1).setAngle(0);this.tweens.chain({targets:s,tweens:[{x:300,duration:450,ease:'Sine.easeInOut'},{angle:360,scale:1.7,duration:450,ease:'Back.easeOut'},{y:210,alpha:.25,duration:350},{x:90,y:310,scale:1,alpha:1,duration:500,ease:'Sine.easeInOut'}]})};s.on('pointerdown',play);this.add.text(195,440,'星をタップ',{fontSize:'16px'}).setOrigin(.5);note(this,'用途例：当たり告知、UI遷移、連続カットイン')}}
 class Pool extends Phaser.Scene{constructor(){super('pool')}create(){this.cameras.main.setBackgroundColor('#101d24');panel(this,'Group / Object Pool','大量オブジェクトを作り直さず再利用する');dot(this,'poolDot',0x55d6be,24);const group=this.add.group({defaultKey:'poolDot',maxSize:24});for(let i=0;i<24;i++){const o=group.create(-50,-50).setActive(false).setVisible(false);o.speed=0}const fire=()=>{const o=group.get(195,470);if(!o)return;o.setActive(true).setVisible(true).setPosition(195,470);o.speed=Phaser.Math.Between(180,330)};this.time.addEvent({delay:110,loop:true,callback:fire});this.events.on('update',(_,dt)=>group.getChildren().forEach(o=>{if(!o.active)return;o.y-=o.speed*dt/1000;if(o.y<140){o.setActive(false).setVisible(false)}}));this.add.text(195,455,'24個を使い回し',{fontSize:'15px'}).setOrigin(.5);note(this,'用途例：弾、コイン、敵、エフェクトの大量管理')}}
 class RegistryScene extends Phaser.Scene{constructor(){super('registry')}create(){this.cameras.main.setBackgroundColor('#1b1825');panel(this,'Registryデータ共有','Sceneをまたいで共通データを保持');if(!this.registry.has('catalogScore'))this.registry.set('catalogScore',0);const t=this.add.text(195,285,'SCORE '+this.registry.get('catalogScore'),{fontSize:'30px',fontStyle:'bold'}).setOrigin(.5);const b=this.add.rectangle(195,365,170,48,0x293852).setInteractive();this.add.text(195,365,'+10',{fontSize:'20px'}).setOrigin(.5);b.on('pointerdown',()=>{this.registry.inc('catalogScore',10);t.setText('SCORE '+this.registry.get('catalogScore'))});this.add.text(195,435,'カタログへ戻って再入場しても残る',{fontSize:'13px',color:'#aebbd2'}).setOrigin(.5);note(this,'用途例：スコア、設定、所持数、共通進行状態')}}
 class PauseScene extends Phaser.Scene{constructor(){super('pause')}create(){this.cameras.main.setBackgroundColor('#18211b');panel(this,'Pause / Resume','Scene内の動作を一時停止・再開');let n=0,paused=false;const t=this.add.text(195,280,'0',{fontSize:'52px',fontStyle:'bold'}).setOrigin(.5);this.time.addEvent({delay:250,loop:true,callback:()=>{n++;t.setText(String(n))}});const b=this.add.rectangle(195,390,180,50,0x2a3b34).setInteractive();const bt=this.add.text(195,390,'PAUSE',{fontSize:'18px'}).setOrigin(.5);b.on('pointerdown',()=>{paused=!paused;this.time.paused=paused;bt.setText(paused?'RESUME':'PAUSE')});note(this,'用途例：ポーズ、メニュー中停止、演出待機')}}
 class GestureScene extends Phaser.Scene{constructor(){super('gesture')}create(){this.cameras.main.setBackgroundColor('#1a1925');panel(this,'スワイプ・長押し','Pointerの距離と時間からジェスチャーを判定');const tx=this.add.text(195,300,'ここをスワイプ\nまたは長押し',{fontSize:'22px',align:'center'}).setOrigin(.5);let sx=0,sy=0,st=0;this.input.on('pointerdown',p=>{if(p.y<130)return;sx=p.x;sy=p.y;st=this.time.now;tx.setText('入力中…')});this.input.on('pointerup',p=>{if(st===0)return;const dx=p.x-sx,dy=p.y-sy,dt=this.time.now-st,dist=Math.hypot(dx,dy);if(dt>650&&dist<35)tx.setText('LONG PRESS');else if(dist>80)tx.setText(Math.abs(dx)>Math.abs(dy)?(dx>0?'SWIPE →':'← SWIPE'):(dy>0?'SWIPE ↓':'SWIPE ↑'));else tx.setText('TAP');st=0});note(this,'用途例：カード操作、ページ切替、長押し決定')}}
 class OverlapScene extends Phaser.Scene{constructor(){super('overlap')}create(){this.cameras.main.setBackgroundColor('#14202a');panel(this,'Overlap判定','ぶつかっても反発せず「重なった」だけ検出');this.physics.world.setBounds(45,150,300,350);const a=this.add.rectangle(110,300,55,55,0x55d6be);const b=this.add.rectangle(280,300,65,65,0xff6b6b);this.physics.add.existing(a);this.physics.add.existing(b);a.body.setCollideWorldBounds(true).setVelocity(150,90).setBounce(1);b.body.setImmovable(true);const tx=this.add.text(195,470,'NO HIT',{fontSize:'20px'}).setOrigin(.5);this.physics.add.overlap(a,b,()=>{tx.setText('OVERLAP!');this.cameras.main.flash(80,100,220,255);this.time.delayedCall(200,()=>tx.setText('NO HIT'))});note(this,'用途例：取得判定、センサー、攻撃範囲、ゴール')}}
 class CamTransform extends Phaser.Scene{constructor(){super('camTransform')}create(){this.cameras.main.setBackgroundColor('#181a24');panel(this,'Camera Zoom / Rotate','カメラ自体を拡大・回転して画面全体を演出');for(let i=0;i<12;i++)this.add.rectangle(55+(i%4)*95,190+Math.floor(i/4)*100,70,70,[0x55d6be,0x4ea5d9,0xffd166][i%3]);const go=()=>{this.cameras.main.zoomTo(1.35,350,'Sine.easeInOut',true);this.cameras.main.rotateTo(0.10,false,350,'Sine.easeInOut',true);this.time.delayedCall(500,()=>{this.cameras.main.zoomTo(1,450,'Sine.easeInOut',true);this.cameras.main.rotateTo(0,false,450,'Sine.easeInOut',true)})};this.add.rectangle(195,510,160,42,0x293852).setScrollFactor(0).setInteractive().on('pointerdown',go);this.add.text(195,510,'CAMERA FX',{fontSize:'15px'}).setScrollFactor(0).setOrigin(.5);note(this,'用途例：衝撃、期待度アップ、画面転換')}}
 new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,MultiCam,TweenChain,Pool,RegistryScene,PauseScene,GestureScene,OverlapScene,CamTransform]});
}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}
loadPhaser();
</script>
</body>
</html>
