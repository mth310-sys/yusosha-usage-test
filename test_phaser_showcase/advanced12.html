<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 12</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced11.html">← Advanced 11</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>const diag=document.getElementById('diag');let booted=false;function ls(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}function boot(){if(booted)return;booted=true;try{const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 12',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,70,t,{fontSize:'22px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'12px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['エンドレスランナー','runner'],['タップシューター','shooter'],['マッチ3','match3'],['釣りタイミング','fishing'],['落下ボール','dropball'],['避けゲー','dodge'],['ブロック崩し','breakout'],['ミニRPGバトル','rpg']];class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 12',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'「機能」から「遊べる形」へ 8ミニゲーム',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}class Runner extends Phaser.Scene{constructor(){super('runner')}create(){panel(this,'エンドレスランナー','タップでジャンプして障害物を避ける');this.cameras.main.setBackgroundColor('#182635');let p=this.add.rectangle(80,430,28,38,0xffd166),vy=0,ground=450,obs=[],score=0,tx=this.add.text(300,145,'0m',{fontSize:'18px'});this.add.rectangle(195,468,390,36,0x334155);this.time.addEvent({delay:1100,loop:true,callback:()=>obs.push(this.add.rectangle(420,430,22,38,0xff6b6b))});this.input.on('pointerdown',()=>{if(p.y>=430)vy=-8.5});this.events.on('update',(_,dt)=>{vy+=.45;p.y+=vy;if(p.y>430){p.y=430;vy=0}obs.forEach(o=>{o.x-=4.2;if(Math.abs(o.x-p.x)<25&&Math.abs(o.y-p.y)<34){this.cameras.main.flash(100,255,60,60);o.x=420;score=0}});score+=dt*.01;tx.setText(Math.floor(score)+'m')});note(this,'ジャンプ・障害物・スコアだけでも1ジャンル成立')}}class Shooter extends Phaser.Scene{constructor(){super('shooter')}create(){panel(this,'タップシューター','タップ方向へ弾を撃つシンプルな射撃');this.cameras.main.setBackgroundColor('#0b1420');let p=this.add.circle(195,420,18,0x55d6be),bul=[],en=[],score=0,tx=this.add.text(285,145,'SCORE 0',{fontSize:'14px'});for(let i=0;i<7;i++){let e=this.add.circle(45+Math.random()*300,180+Math.random()*150,13,0xff6b6b);en.push(e)}this.input.on('pointerdown',q=>{let a=Phaser.Math.Angle.Between(p.x,p.y,q.x,q.y),b=this.add.circle(p.x,p.y,5,0xffd166);b.vx=Math.cos(a)*7;b.vy=Math.sin(a)*7;bul.push(b)});this.events.on('update',()=>{bul.forEach(b=>{b.x+=b.vx;b.y+=b.vy;en.forEach(e=>{if(e.active&&Phaser.Math.Distance.Between(b.x,b.y,e.x,e.y)<18){e.setPosition(45+Math.random()*300,180+Math.random()*150);b.destroy();score++;tx.setText('SCORE '+score)}})})});note(this,'照準・弾・敵判定でシューティングの核')}}class Match3 extends Phaser.Scene{constructor(){super('match3')}create(){panel(this,'マッチ3','隣接ピースを入れ替えて3つ揃える');this.cameras.main.setBackgroundColor('#171520');const C=6,S=48,OX=75,OY=190,cols=[0xff6b6b,0x55d6be,0x4ea5d9,0xffd166,0xa78bfa];let board=[],sel=null,score=0,tx=this.add.text(260,500,'SCORE 0',{fontSize:'14px'});for(let y=0;y<C;y++){board[y]=[];for(let x=0;x<C;x++){let v=Phaser.Math.Between(0,4),o=this.add.circle(OX+x*S,OY+y*S,18,cols[v]).setInteractive();o.gx=x;o.gy=y;o.v=v;board[y][x]=o;o.on('pointerdown',()=>pick(o))}}const swap=(a,b)=>{[a.v,b.v]=[b.v,a.v];a.setFillStyle(cols[a.v]);b.setFillStyle(cols[b.v])},check=()=>{let hit=new Set();for(let y=0;y<C;y++)for(let x=0;x<C-2;x++){let v=board[y][x].v;if(board[y][x+1].v===v&&board[y][x+2].v===v)[board[y][x],board[y][x+1],board[y][x+2]].forEach(o=>hit.add(o))}for(let x=0;x<C;x++)for(let y=0;y<C-2;y++){let v=board[y][x].v;if(board[y+1][x].v===v&&board[y+2][x].v===v)[board[y][x],board[y+1][x],board[y+2][x]].forEach(o=>hit.add(o))}hit.forEach(o=>{o.v=Phaser.Math.Between(0,4);o.setFillStyle(cols[o.v]);score++});tx.setText('SCORE '+score)};function pick(o){if(!sel){sel=o;o.setScale(1.25);return}sel.setScale(1);let d=Math.abs(sel.gx-o.gx)+Math.abs(sel.gy-o.gy);if(d===1){swap(sel,o);check()}sel=null}note(this,'パズル・連鎖・消去演出へ拡張できる')}}class Fishing extends Phaser.Scene{constructor(){super('fishing')}create(){panel(this,'釣りタイミング','動く針を成功ゾーンで止める');this.cameras.main.setBackgroundColor('#10202a');let zone=this.add.rectangle(195,330,90,70,0x55d6be,.22),bar=this.add.rectangle(50,330,8,100,0xffd166),dir=1,score=0,tx=this.add.text(195,460,'TAP TO CATCH',{fontSize:'18px'}).setOrigin(.5);this.input.on('pointerdown',()=>{let ok=Math.abs(bar.x-195)<45;tx.setText(ok?'CATCH! +1':'MISS').setColor(ok?'#8ef0a8':'#ff8f8f');if(ok)score++;this.time.delayedCall(500,()=>tx.setText('SCORE '+score))});this.events.on('update',()=>{bar.x+=dir*4;if(bar.x<45||bar.x>345)dir*=-1});note(this,'ゲージ型ミニゲーム、目押し、釣り、採掘にも応用')}}class DropBall extends Phaser.Scene{constructor(){super('dropball')}create(){panel(this,'落下ボール','上から落としてピンに当てながらスコアゾーンへ');this.cameras.main.setBackgroundColor('#14141b');let pins=[];for(let y=0;y<6;y++)for(let x=0;x<7;x++)pins.push(this.add.circle(55+x*47+(y%2)*23,220+y*45,6,0x94a3b8));let balls=[],score=0,tx=this.add.text(195,520,'TAP TO DROP',{fontSize:'15px'}).setOrigin(.5);[70,130,190,250,310].forEach((x,i)=>{this.add.rectangle(x,480,50,30,[0x334155,0x475569][i%2]);this.add.text(x,480,String((i+1)*10),{fontSize:'11px'}).setOrigin(.5)});this.input.on('pointerdown',p=>{let b=this.add.circle(Phaser.Math.Clamp(p.x,35,355),160,9,0xffd166);b.vx=0;b.vy=0;balls.push(b)});this.events.on('update',()=>balls.forEach(b=>{b.vy+=.16;b.x+=b.vx;b.y+=b.vy;pins.forEach(p=>{let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<15&&d>0){b.vx+=dx/d*1.2;b.vy=-Math.abs(b.vy)*.55}});if(b.x<20||b.x>370)b.vx*=-.8;if(b.y>470){score+=10+Math.floor(b.x/78)*10;tx.setText('SCORE '+score);b.destroy()}}));note(this,'ピンボール、プリンク、物理風抽選、落下ゲーム')}}class Dodge extends Phaser.Scene{constructor(){super('dodge')}create(){panel(this,'避けゲー','指で自機を動かし降ってくる弾を避け続ける');this.cameras.main.setBackgroundColor('#100d18');let p=this.add.circle(195,470,14,0x55d6be).setInteractive({draggable:true}),es=[],time=0,tx=this.add.text(275,145,'TIME 0.0',{fontSize:'14px'});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,150,520)));this.time.addEvent({delay:220,loop:true,callback:()=>{let e=this.add.circle(Math.random()*390,150,7,0xff6b6b);e.v=2.5+Math.random()*3;es.push(e)}});this.events.on('update',(_,dt)=>{time+=dt/1000;tx.setText('TIME '+time.toFixed(1));es.forEach(e=>{e.y+=e.v;if(Phaser.Math.Distance.Between(e.x,e.y,p.x,p.y)<20){time=0;this.cameras.main.shake(120,.015);e.destroy()}if(e.y>550)e.destroy()})});note(this,'弾幕、回避、耐久、ボス戦の基礎')}}class Breakout extends Phaser.Scene{constructor(){super('breakout')}create(){panel(this,'ブロック崩し','パドルを動かしてボールを跳ね返す');this.cameras.main.setBackgroundColor('#0d1720');let pad=this.add.rectangle(195,500,90,14,0x55d6be).setInteractive({draggable:true}),ball=this.add.circle(195,430,9,0xffd166),vx=3.1,vy=-4.2,blocks=[];this.input.setDraggable(pad);this.input.on('drag',(p,o,x)=>o.x=Phaser.Math.Clamp(x,50,340));for(let y=0;y<4;y++)for(let x=0;x<7;x++)blocks.push(this.add.rectangle(48+x*49,190+y*32,42,22,[0xff6b6b,0xffd166,0x4ea5d9,0xa78bfa][y]));this.events.on('update',()=>{ball.x+=vx;ball.y+=vy;if(ball.x<12||ball.x>378)vx*=-1;if(ball.y<145)vy=Math.abs(vy);if(ball.y>540){ball.setPosition(195,430);vy=-4.2}if(ball.y>485&&ball.y<515&&Math.abs(ball.x-pad.x)<55)vy=-Math.abs(vy);blocks.forEach(b=>{if(b.active&&Math.abs(ball.x-b.x)<28&&Math.abs(ball.y-b.y)<18){b.setActive(false).setVisible(false);vy*=-1}})});note(this,'衝突・反射・破壊だけで完成度の高いミニゲーム')}}class RPG extends Phaser.Scene{constructor(){super('rpg')}create(){panel(this,'ミニRPGバトル','HP・ターン・コマンドだけで戦闘ループを作る');this.cameras.main.setBackgroundColor('#17131c');let hp=100,ehp=120,pt=this.add.text(55,190,'HERO HP 100',{fontSize:'15px'}),et=this.add.text(230,190,'ENEMY HP 120',{fontSize:'15px'}),hero=this.add.circle(90,320,32,0x55d6be),enemy=this.add.rectangle(300,320,58,70,0xff6b6b),msg=this.add.text(195,410,'YOUR TURN',{fontSize:'16px'}).setOrigin(.5);const act=(type)=>{if(hp<=0||ehp<=0)return;let dmg=type==='attack'?Phaser.Math.Between(12,25):Phaser.Math.Between(5,12);ehp=Math.max(0,ehp-dmg);et.setText('ENEMY HP '+ehp);msg.setText(type==='attack'?'ATTACK! -'+dmg:'SKILL! -'+dmg);this.tweens.add({targets:enemy,x:315,yoyo:true,duration:100});if(ehp<=0){msg.setText('VICTORY!');return}this.time.delayedCall(500,()=>{let d=Phaser.Math.Between(8,18);hp=Math.max(0,hp-d);pt.setText('HERO HP '+hp);msg.setText(hp<=0?'DEFEAT':'ENEMY ATTACK -'+d)})};[['ATTACK',130,'attack'],['SKILL',260,'skill']].forEach(([t,x,k])=>{let b=this.add.rectangle(x,500,110,40,0x293852).setInteractive();this.add.text(x,500,t,{fontSize:'14px'}).setOrigin(.5);b.on('pointerdown',()=>act(k))});note(this,'RPGの戦闘は状態管理＋UI＋演出の組み合わせ')}}new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Runner,Shooter,Match3,Fishing,DropBall,Dodge,Breakout,RPG]})}catch(e){diag.innerHTML='<span class="ng">ERROR '+String(e.message||e)+'</span>'}}load();</script></body></html>
