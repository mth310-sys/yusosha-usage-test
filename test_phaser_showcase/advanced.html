<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>遊創舎 Phaser Advanced</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:8px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8;flex:1}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./index.html">← 基本</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>const diag=document.getElementById('diag');window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');function loadPhaser(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';s.onload=()=>{diag.textContent='Phaser OK / 起動中…';boot()};s.onerror=()=>{diag.textContent='CDN切替中…';const f=document.createElement('script');f.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';f.onload=()=>{diag.textContent='Phaser OK (予備CDN) / 起動中…';boot()};f.onerror=()=>diag.innerHTML='<span class="ng">ERROR Phaser CDN 読込失敗</span>';document.head.appendChild(f)};document.head.appendChild(s)}function boot(){try{const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});if(o.setResolution)o.setResolution(DPR);return o};function dot(sc,key,c=0xffffff,z=32){if(sc.textures.exists(key))return;const g=sc.make.graphics({add:false});g.fillStyle(c,1).fillCircle(z/2,z/2,z/2-2);g.generateTexture(key,z,z);g.destroy()}function panel(sc,t,d){sc.add.text(18,18,'← Advanced',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>sc.scene.start('menu')).setDepth(1000);sc.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);sc.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}function note(sc,t){sc.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}const ITEMS=[['Graphics図形','graphics'],['TileSprite','tile'],['本物のParticles','particle'],['Camera追従','follow'],['Time Scale','timescale'],['Bitmap生成','canvasTex'],['入力Hit Area','hitarea'],['Flip / Tint','flipTint']];class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced カタログ',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'応用機能 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52})}}class GraphicsScene extends Phaser.Scene{constructor(){super('graphics')}create(){this.cameras.main.setBackgroundColor('#161b27');panel(this,'Graphics図形','コードだけで線・円・多角形などを描く');const g=this.add.graphics();g.lineStyle(5,0x8fd3ff).strokeRoundedRect(55,180,280,230,24);g.fillStyle(0xffd166).fillCircle(120,265,45);g.fillStyle(0x55d6be).fillTriangle(195,205,145,340,245,340);note(this,'画像素材なしでUI・枠・図形を作れる')}}class TileScene extends Phaser.Scene{constructor(){super('tile')}create(){this.cameras.main.setBackgroundColor('#101824');panel(this,'TileSprite','小さいTextureを繰り返して広い背景を作る');if(!this.textures.exists('tileDot')){const g=this.make.graphics({add:false});g.fillStyle(0x17243b).fillRect(0,0,48,48);g.fillStyle(0x4ea5d9).fillCircle(12,12,5);g.fillStyle(0x55d6be).fillCircle(36,36,5);g.generateTexture('tileDot',48,48);g.destroy()}const t=this.add.tileSprite(195,320,310,300,'tileDot');this.events.on('update',(_,dt)=>{t.tilePositionX+=dt*.04;t.tilePositionY+=dt*.02});note(this,'流れる背景・床・星空など')}}class ParticleScene extends Phaser.Scene{constructor(){super('particle')}create(){this.cameras.main.setBackgroundColor('#111520');panel(this,'本物のParticles','ParticleEmitterで大量の粒を管理');dot(this,'pDot',0xffd166,20);const e=this.add.particles(195,330,'pDot',{speed:{min:70,max:220},angle:{min:200,max:340},lifespan:{min:500,max:1100},scale:{start:1,end:0},alpha:{start:1,end:0},frequency:45,quantity:2,gravityY:180});this.add.rectangle(195,330,75,38,0x5a4a20).setInteractive().on('pointerdown',()=>e.explode(45,195,330));this.add.text(195,330,'BURST',{fontSize:'12px'}).setOrigin(.5);note(this,'火花・紙吹雪・爆発・オーラ')}}class FollowScene extends Phaser.Scene{constructor(){super('follow')}create(){this.cameras.main.setBackgroundColor('#101923');panel(this,'Camera追従','大きいWorld内で対象をカメラが追う');this.cameras.main.setBounds(0,0,1200,600);for(let x=0;x<1200;x+=100)this.add.rectangle(x+50,300,70,70,(x/100)%2?0x32445f:0x274f45);const p=this.add.circle(120,300,24,0xffd166);this.cameras.main.startFollow(p,true,.08,.08);this.tweens.add({targets:p,x:1080,duration:5000,yoyo:true,repeat:-1});note(this,'横スクロール・マップ・追従演出')}}class TimeScaleScene extends Phaser.Scene{constructor(){super('timescale')}create(){this.cameras.main.setBackgroundColor('#211625');panel(this,'Time Scale','ゲーム内時間の進み方を変える');const s=this.add.star(195,310,5,30,65,0xffd166);this.tweens.add({targets:s,angle:360,duration:1000,repeat:-1});const tx=this.add.text(195,430,'NORMAL ×1',{fontSize:'18px'}).setOrigin(.5);[[80,'SLOW ×0.25',.25],[195,'NORMAL ×1',1],[310,'FAST ×2',2]].forEach(([x,l,v])=>{this.add.rectangle(x,500,100,40,0x293852).setInteractive().on('pointerdown',()=>{this.time.timeScale=v;this.tweens.timeScale=v;tx.setText(l)});this.add.text(x,500,l,{fontSize:'12px'}).setOrigin(.5)});note(this,'スロー・早送り・演出テンポ調整')}}class CanvasTexScene extends Phaser.Scene{constructor(){super('canvasTex')}create(){this.cameras.main.setBackgroundColor('#17201d');panel(this,'Bitmap生成','実行中にCanvasTextureへ画像を作る');const tex=this.textures.createCanvas('runtimeCanvas',220,220),ctx=tex.getContext();const draw=()=>{ctx.fillStyle='#152034';ctx.fillRect(0,0,220,220);for(let i=0;i<28;i++){ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;ctx.beginPath();ctx.arc(Math.random()*220,Math.random()*220,5+Math.random()*18,0,Math.PI*2);ctx.fill()}tex.refresh()};draw();this.add.image(195,315,'runtimeCanvas').setInteractive().on('pointerdown',draw);note(this,'画像をタップ / 動的画像・ランダム模様')}}class HitAreaScene extends Phaser.Scene{constructor(){super('hitarea')}create(){this.cameras.main.setBackgroundColor('#171925');panel(this,'入力 Hit Area','見た目とは別にタップ判定範囲を決める');const v=this.add.circle(195,310,28,0x55d6be);const z=this.add.zone(195,310,180,180).setInteractive(new Phaser.Geom.Circle(90,90,90),Phaser.Geom.Circle.Contains);this.add.circle(195,310,90,0xffffff,.03).setStrokeStyle(2,0x8fd3ff,.5);z.on('pointerdown',()=>this.tweens.add({targets:v,scale:1.8,duration:120,yoyo:true}));note(this,'小さいボタンでも押しやすくできる')}}class FlipTintScene extends Phaser.Scene{constructor(){super('flipTint')}create(){this.cameras.main.setBackgroundColor('#1b1822');panel(this,'Flip / Tint','同じTextureを反転・着色して使い回す');dot(this,'ft',0xffffff,72);const a=[this.add.sprite(100,300,'ft'),this.add.sprite(195,300,'ft'),this.add.sprite(290,300,'ft')];a[0].setTint(0xff6b6b);a[1].setTint(0x55d6be);a[2].setTint(0x59c3ff).setFlipX(true).setScale(1.3,.75);note(this,'色違い・左右向き・状態変化・素材節約')}}new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,GraphicsScene,TileScene,ParticleScene,FollowScene,TimeScaleScene,CanvasTexScene,HitAreaScene,FlipTintScene]})}catch(e){diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}loadPhaser();</script></body></html>
