<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>遊創舎 Phaser Catalog Advanced</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:10px;padding:7px 8px;background:#172033;font-size:12px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 8px;border-radius:5px}#diag{color:#8ef0a8;flex:1}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none;image-rendering:auto}.ng{color:#ff8f8f}
</style>
</head>
<body>
<div id="wrap"><div id="top"><a href="./index.html">← 基本カタログ</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
const diag=document.getElementById('diag');
const DPR=Math.min(window.devicePixelRatio||1,3);
const UI_FONT='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif';
window.addEventListener('error',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>');
const oldText=Phaser.GameObjects.GameObjectFactory.prototype.text;
Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style={}){const t=oldText.call(this,x,y,text,{fontFamily:UI_FONT,...style});if(t&&t.setResolution)t.setResolution(DPR);return t};
function dotTexture(scene,key,color=0xffffff,size=32){if(scene.textures.exists(key))return;const g=scene.make.graphics({add:false});g.fillStyle(color,1).fillCircle(size/2,size/2,size/2-2);g.generateTexture(key,size,size);g.destroy()}
function panel(scene,title,desc){scene.add.text(18,18,'← Advanced',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>scene.scene.start('menu')).setDepth(1000);scene.add.text(195,70,title,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);scene.add.text(195,103,desc,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
function note(scene,text){scene.add.text(195,565,text,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5)}
const ITEMS=[['Graphics図形','graphics'],['TileSprite','tile'],['本物のParticles','particle'],['Camera追従','follow'],['Time Scale','timescale'],['Bitmap生成','canvasTex'],['入力Hit Area','hitarea'],['Flip / Tint','flipTint']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){const r=this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas';diag.textContent=`OK / Retina ${DPR}x / ${r}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced カタログ',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'既存カタログに続く応用機能',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([name,key],i)=>{const b=this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive();this.add.text(34,y,name,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);b.on('pointerdown',()=>this.scene.start(key));y+=52});this.add.text(195,540,'8機能追加',{fontSize:'12px',color:'#71809b'}).setOrigin(.5)}}
class GraphicsScene extends Phaser.Scene{constructor(){super('graphics')}create(){this.cameras.main.setBackgroundColor('#161b27');panel(this,'Graphics図形','コードだけで線・円・多角形などを描く');const g=this.add.graphics();g.lineStyle(5,0x8fd3ff,1).strokeRoundedRect(55,180,280,230,24);g.fillStyle(0xffd166,1).fillCircle(120,265,45);g.fillStyle(0x55d6be,1).fillTriangle(195,205,145,340,245,340);g.lineStyle(4,0xff6b6b,1).beginPath().moveTo(75,390).lineTo(315,190).strokePath();note(this,'画像素材なしでUI・ゲージ・枠・デバッグ表示を作れる')}}
class TileScene extends Phaser.Scene{constructor(){super('tile')}create(){this.cameras.main.setBackgroundColor('#101824');panel(this,'TileSprite','小さいTextureを繰り返して広い背景を作る');if(!this.textures.exists('tileDot')){const g=this.make.graphics({add:false});g.fillStyle(0x17243b,1).fillRect(0,0,48,48);g.fillStyle(0x4ea5d9,1).fillCircle(12,12,5);g.fillStyle(0x55d6be,1).fillCircle(36,36,5);g.generateTexture('tileDot',48,48);g.destroy()}const t=this.add.tileSprite(195,320,310,300,'tileDot').setInteractive();this.events.on('update',(_,dt)=>{t.tilePositionX+=dt*.04;t.tilePositionY+=dt*.02});note(this,'用途例：流れる背景、床、雲、星空、リール背景')}}}
class ParticleScene extends Phaser.Scene{constructor(){super('particle')}create(){this.cameras.main.setBackgroundColor('#111520');panel(this,'本物のParticles','ParticleEmitterで大量の粒を一括管理');dotTexture(this,'pDot',0xffd166,20);const emitter=this.add.particles(195,330,'pDot',{speed:{min:70,max:220},angle:{min:200,max:340},lifespan:{min:500,max:1100},scale:{start:1,end:0},alpha:{start:1,end:0},frequency:45,quantity:2,gravityY:180});this.add.rectangle(195,330,65,34,0x5a4a20).setInteractive().on('pointerdown',()=>emitter.explode(45,195,330));this.add.text(195,330,'BURST',{fontSize:'12px'}).setOrigin(.5);note(this,'ボタンをタップ / 用途例：火花、紙吹雪、爆発、オーラ')}}}
class FollowScene extends Phaser.Scene{constructor(){super('follow')}create(){this.cameras.main.setBackgroundColor('#101923');panel(this,'Camera追従','大きいWorld内で対象をカメラが追う');this.cameras.main.setBounds(0,0,1200,600);for(let x=0;x<1200;x+=100)this.add.rectangle(x+50,300,70,70,(x/100)%2?0x32445f:0x274f45);const p=this.add.circle(120,300,24,0xffd166).setStrokeStyle(3,0xffffff);this.cameras.main.startFollow(p,true,.08,.08);this.tweens.add({targets:p,x:1080,duration:5000,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});note(this,'用途例：横スクロール、マップ、追従演出')}}}
class TimeScaleScene extends Phaser.Scene{constructor(){super('timescale')}create(){this.cameras.main.setBackgroundColor('#211625');panel(this,'Time Scale','ゲーム内時間の進み方を変える');const s=this.add.star(195,310,5,30,65,0xffd166).setStrokeStyle(3,0xffffff);this.tweens.add({targets:s,angle:360,duration:1000,repeat:-1});const txt=this.add.text(195,440,'NORMAL ×1.0',{fontSize:'18px'}).setOrigin(.5);const btn=(x,label,v)=>{const b=this.add.rectangle(x,500,100,40,0x293852).setInteractive();this.add.text(x,500,label,{fontSize:'13px'}).setOrigin(.5);b.on('pointerdown',()=>{this.time.timeScale=v;this.tweens.timeScale=v;txt.setText(label)})};btn(80,'SLOW ×0.25',.25);btn(195,'NORMAL ×1.0',1);btn(310,'FAST ×2.0',2);note(this,'用途例：スロー演出、早送り、演出テンポ調整')}}
class CanvasTexScene extends Phaser.Scene{constructor(){super('canvasTex')}create(){this.cameras.main.setBackgroundColor('#17201d');panel(this,'Bitmap生成','実行中にCanvasTextureへ画像を作る');const tex=this.textures.createCanvas('runtimeCanvas',220,220),ctx=tex.getContext();const draw=()=>{ctx.fillStyle='#152034';ctx.fillRect(0,0,220,220);for(let i=0;i<28;i++){ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;ctx.beginPath();ctx.arc(Math.random()*220,Math.random()*220,5+Math.random()*18,0,Math.PI*2);ctx.fill()}tex.refresh()};draw();const img=this.add.image(195,315,'runtimeCanvas').setInteractive();img.on('pointerdown',draw);this.add.text(195,455,'画像をタップして再生成',{fontSize:'15px'}).setOrigin(.5);note(this,'用途例：動的サムネ、ペイント、ランダム模様、生成UI')}}
class HitAreaScene extends Phaser.Scene{constructor(){super('hitarea')}create(){this.cameras.main.setBackgroundColor('#171925');panel(this,'入力 Hit Area','見た目とは別にタップ判定範囲を決める');const visual=this.add.circle(195,310,28,0x55d6be).setStrokeStyle(3,0xffffff);const zone=this.add.zone(195,310,180,180).setInteractive(new Phaser.Geom.Circle(90,90,90),Phaser.Geom.Circle.Contains);this.add.circle(195,310,90,0xffffff,.03).setStrokeStyle(2,0x8fd3ff,.5);const t=this.add.text(195,440,'青い大円の中をタップ',{fontSize:'15px'}).setOrigin(.5);zone.on('pointerdown',()=>{visual.setScale(1.8);t.setText('HIT!');this.tweens.add({targets:visual,scale:1,duration:250})});note(this,'小さいボタンでも押しやすい判定にできる')}}
class FlipTintScene extends Phaser.Scene{constructor(){super('flipTint')}create(){this.cameras.main.setBackgroundColor('#1b1822');panel(this,'Flip / Tint','同じTextureを反転・着色して使い回す');dotTexture(this,'ft',0xffffff,72);const sprites=[this.add.sprite(100,300,'ft'),this.add.sprite(195,300,'ft'),this.add.sprite(290,300,'ft')];sprites[0].setTint(0xff6b6b);sprites[1].setTint(0x55d6be);sprites[2].setTint(0x59c3ff).setFlipX(true).setScale(1.3,.75);this.add.text(195,420,'1つのTexture → 3表現',{fontSize:'17px'}).setOrigin(.5);note(this,'用途例：色違い、左右向き、状態変化、素材節約')}}
new Phaser.Game({type:Phaser.WEBGL,width:390,height:600,parent:'game',backgroundColor:'#111827',resolution:DPR,antialias:true,antialiasGL:true,pixelArt:false,roundPixels:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,GraphicsScene,TileScene,ParticleScene,FollowScene,TimeScaleScene,CanvasTexScene,HitAreaScene,FlipTintScene]});
</script>
</body></html>
