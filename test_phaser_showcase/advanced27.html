<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>遊創舎 Phaser Advanced 27</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw;min-height:100vh}#top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#121722;border-bottom:1px solid #30394a;font-size:14px}#top a{color:#8fd3ff;text-decoration:none}#diag{margin-left:auto;font-size:12px;color:#8ef0a8}.head{padding:14px 16px 10px}.title{font-size:22px;font-weight:760}.sub{font-size:14px;color:#bcc6d7;margin-top:5px;line-height:1.5}.stage{margin:0 16px;border-radius:14px;overflow:hidden;border:1px solid #354158;background:#03050a}.stagebar{display:flex;padding:9px 11px;background:#141a26}.stagebar b{font-size:14px}.stagebar span{margin-left:auto;font-size:12px;color:#a5b0c3}canvas{display:block;width:100%!important;height:auto!important;touch-action:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 16px 5px}.tab,.btn{border:1px solid #46536d;background:#1b2639;color:#fff;border-radius:10px;text-align:center;user-select:none}.tab{padding:11px 2px;font-size:12px;font-weight:650}.tab.on{background:#3b4e6d;border-color:#8ca8d0}.panel{padding:10px 16px}.panel h3{font-size:17px;margin:0 0 6px}.panel p{font-size:14px;line-height:1.5;color:#bcc6d7;margin:0 0 10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:12px 8px;font:650 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wide{grid-column:1/3}.log{margin-top:9px;background:#101622;border:1px solid #2d3850;border-radius:10px;padding:10px 11px;font-size:14px;color:#dce4ef}.tip{padding:5px 16px 22px;font-size:13px;line-height:1.55;color:#9da9bb}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced26.html">← Advanced 26</a><b>Advanced 27</b><div id="diag">Phaser読込中…</div></div><div class="head"><div class="title">Realistic Visual Lab 01</div><div class="sub">単純な図形感を減らし、多層・濃淡・揺らぎ・残光・反射を重ねて「質感」を作る実験。</div></div><div class="stage"><div class="stagebar"><b>高品質レンダリング実験</b><span>見た目優先</span></div><div id="game"></div></div><div class="tabs"><div class="tab on" data-mode="fire">炎</div><div class="tab" data-mode="smoke">煙</div><div class="tab" data-mode="arc">雷</div><div class="tab" data-mode="metal">金属</div></div><div class="panel"><h3 id="ttl">① 多層リアル炎</h3><p id="desc">白熱コア・黄炎・赤炎・火の粉・煙・床面照り返しを別レイヤーで合成する。</p><div class="controls"><div class="btn wide" id="play">高品質演出を発動</div><div class="btn" id="normal">標準</div><div class="btn" id="max">MAX</div></div><div class="log" id="log">品質：標準 / MAXは粒子数とレイヤー数を増加</div></div><div class="tip">固定文字はHTML/CSSで高精細維持。素材画像を使わず、PhaserのGraphics・Blend Mode・Tweenだけで質感の限界を探る。</div></div><script>const diag=document.getElementById('diag'),ttl=document.getElementById('ttl'),desc=document.getElementById('desc'),log=document.getElementById('log');let S,quality=1,booted=0;const src=['https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'];function one(u){return new Promise((ok,no)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();no()}},6000);s.src=u;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():no()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);no()}};document.head.appendChild(s)})}async function load(){for(let i=0;i<src.length;i++){diag.textContent=`Phaser読込 ${i+1}/3…`;try{await one(src[i]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">読込失敗</span>'}function boot(){if(booted++)return;let D=Math.min(devicePixelRatio||1,3);class R extends Phaser.Scene{create(){S=this;this.mode='fire';this.cameras.main.setBackgroundColor('#02040a');this.add.rectangle(179,175,330,270,0x080d15).setStrokeStyle(1,0x263249);this.add.ellipse(179,278,250,35,0x10151d,.8);this.input.on('pointerdown',p=>{if(p.y>30&&p.y<330)this.play(p.x,p.y)});diag.textContent=`OK / Retina ${D}x`}fire(x,y,k){let floor=this.add.ellipse(x,y+45,130*k,28,0xff6a18,.12).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:floor,alpha:0,duration:1300,onComplete:()=>floor.destroy()});let layers=[[0x741800,.3,18,800],[0xff3b0a,.5,30,700],[0xffa30a,.7,38,600],[0xfff0a0,.85,16,480]];layers.forEach((L,li)=>{for(let i=0;i<L[2]*k;i++){let w=Phaser.Math.Between(5+li,12+li*2),o=this.add.ellipse(x+Phaser.Math.Between(-30,30),y+Phaser.Math.Between(-4,14),w,w*Phaser.Math.FloatBetween(1.3,2.4),L[0],L[1]).setBlendMode(li?Phaser.BlendModes.ADD:Phaser.BlendModes.NORMAL);this.tweens.add({targets:o,x:o.x+Phaser.Math.Between(-35,35),y:y-Phaser.Math.Between(45+li*8,120+li*12),scaleX:.15,scaleY:Phaser.Math.FloatBetween(1.2,2),alpha:0,duration:Phaser.Math.Between(L[3]-150,L[3]+220),delay:Phaser.Math.Between(0,250),ease:'Sine.easeOut',onComplete:()=>o.destroy()})}});for(let i=0;i<22*k;i++){let o=this.add.circle(x+Phaser.Math.Between(-25,25),y,Phaser.Math.Between(1,3),0xffd56a,.95).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:o,x:o.x+Phaser.Math.Between(-70,70),y:y-Phaser.Math.Between(90,190),alpha:0,duration:Phaser.Math.Between(650,1200),delay:Phaser.Math.Between(0,350),onComplete:()=>o.destroy()})}for(let i=0;i<9*k;i++){let o=this.add.circle(x+Phaser.Math.Between(-25,25),y-45,Phaser.Math.Between(12,25),0x555964,.12);this.tweens.add({targets:o,x:o.x+Phaser.Math.Between(-55,55),y:o.y-Phaser.Math.Between(60,130),scale:2.6,alpha:0,duration:1500,onComplete:()=>o.destroy()})}}smoke(x,y,k){for(let layer=0;layer<3;layer++)for(let i=0;i<(14+layer*7)*k;i++){let r=Phaser.Math.Between(12,27),shade=[0x22262d,0x4b5058,0x7d8188][layer],o=this.add.circle(x+Phaser.Math.Between(-30,30),y+Phaser.Math.Between(-10,15),r,shade,.11+layer*.035);this.tweens.add({targets:o,x:o.x+Phaser.Math.Between(-80,80),y:o.y-Phaser.Math.Between(75,180),scale:Phaser.Math.FloatBetween(2.2,4.2),alpha:0,duration:Phaser.Math.Between(1500,2600),delay:Phaser.Math.Between(0,350),ease:'Sine.easeInOut',onComplete:()=>o.destroy()})}for(let i=0;i<8*k;i++){let o=this.add.ellipse(x+Phaser.Math.Between(-20,20),y,35,15,0xb7bdc7,.07);this.tweens.add({targets:o,rotation:Phaser.Math.FloatBetween(-2,2),scaleX:4,scaleY:2,y:o.y-120,alpha:0,duration:2200,onComplete:()=>o.destroy()})}}arc(x,y,k){let glow=this.add.graphics().setBlendMode(Phaser.BlendModes.ADD),core=this.add.graphics().setBlendMode(Phaser.BlendModes.ADD);function bolt(g,w,c,a,ox=0){g.lineStyle(w,c,a);g.beginPath();let px=x+ox,py=28;g.moveTo(px,py);while(py<y){py+=Phaser.Math.Between(10,23);px+=Phaser.Math.Between(-18,18);g.lineTo(px,Math.min(py,y));if(Math.random()<.28){let bx=px,by=py;g.moveTo(bx,by);for(let q=0;q<2;q++){bx+=Phaser.Math.Between(-35,35);by+=Phaser.Math.Between(8,25);g.lineTo(bx,by)}g.moveTo(px,py)}}g.strokePath()}bolt(glow,13,0x477dff,.18);bolt(glow,7,0x73bfff,.35);bolt(core,2,0xffffff,1);for(let i=0;i<k;i++)bolt(core,1,0xa8dfff,.7,Phaser.Math.Between(-12,12));let hit=this.add.circle(x,y,20,0xffffff,.9).setBlendMode(Phaser.BlendModes.ADD);let halo=this.add.circle(x,y,55,0x5caeff,.22).setBlendMode(Phaser.BlendModes.ADD);this.cameras.main.flash(75,175,215,255,false);this.cameras.main.shake(100,.005*k);this.time.delayedCall(70,()=>{core.setVisible(false);glow.setAlpha(.35)});this.tweens.add({targets:[glow,hit,halo],alpha:0,scale:1.8,duration:380,onComplete:()=>{glow.destroy();core.destroy();hit.destroy();halo.destroy()}})}metal(x,y,k){let plate=this.add.graphics();plate.fillGradientStyle(0x17191e,0xc8ced8,0x08090c,0x646b75,1);plate.fillRoundedRect(x-95,y-55,190,110,18);plate.lineStyle(2,0xe8edf5,.7);plate.strokeRoundedRect(x-95,y-55,190,110,18);let dark=this.add.rectangle(x,y+25,170,22,0x000000,.22);let shine=this.add.polygon(x-130,y,[0,-65,55,-65,110,65,55,65],0xffffff,.18).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:shine,x:x+130,duration:850,ease:'Sine.easeInOut',onComplete:()=>shine.destroy()});for(let i=0;i<10*k;i++){let p=this.add.circle(x+Phaser.Math.Between(-80,80),y+Phaser.Math.Between(-45,45),Phaser.Math.Between(1,3),0xffffff,.8).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:p,alpha:0,scale:3,duration:500,delay:Phaser.Math.Between(0,500),onComplete:()=>p.destroy()})}this.time.delayedCall(1300,()=>{plate.destroy();dark.destroy()})}play(x=179,y=220){let k=quality===2?2:1;this[this.mode](x,y,k)}}new Phaser.Game({type:Phaser.AUTO,width:358,height:350,parent:'game',resolution:D,antialias:true,pixelArt:false,backgroundColor:'#02040a',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[R]});document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(!S)return;S.mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(a=>a.classList.toggle('on',a===t));let d={fire:['① 多層リアル炎','白熱コア・黄炎・赤炎・火の粉・煙・床面照り返しを別レイヤーで合成する。'],smoke:['② 多層ボリューム煙','暗部・中間色・明部を別速度で拡散し、濃淡と渦のような重なりを作る。'],arc:['③ 高密度エネルギー雷','太い残光、青白い発光、細い白熱コア、枝分かれ、着弾光を重ねる。'],metal:['④ 金属・反射質感','多方向グラデーション、暗部、輪郭ハイライト、走る反射光で金属板の質感を疑似生成する。']}[S.mode];ttl.textContent=d[0];desc.textContent=d[1]});document.getElementById('play').onclick=()=>S?.play();document.getElementById('normal').onclick=()=>{quality=1;log.textContent='品質：標準'};document.getElementById('max').onclick=()=>{quality=2;log.textContent='品質：MAX / 粒子・レイヤー増量'};window.addEventListener('error',()=>diag.innerHTML='<span class="ng">RUNTIME ERROR</span>');load();</script></body></html>
