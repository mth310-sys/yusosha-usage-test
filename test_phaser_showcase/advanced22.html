<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>遊創舎 Phaser Advanced 22</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw;min-height:100vh;background:#0b0f18}#top{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#172033;border-bottom:1px solid #26354b;font-size:14px}#top a{color:#8fd3ff;text-decoration:none}#diag{margin-left:auto;font-size:11px;color:#8ef0a8}.head{padding:14px 16px 10px}.title{font-size:22px;font-weight:750}.sub{font-size:13px;color:#aebbd2;margin-top:5px;line-height:1.48}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 10px}.card{background:#151f30;border:1px solid #2d3d55;border-radius:10px;padding:9px 10px}.card .k{font-size:11px;color:#8fa2bd}.card .v{font-size:17px;font-weight:700;margin-top:2px}.stage{margin:0 16px;border-radius:14px;overflow:hidden;border:1px solid #2b3a50;background:#101722}.stagebar{display:flex;padding:9px 11px;background:#151f2c;border-bottom:1px solid #26364b}.stagebar b{font-size:14px}.stagebar span{margin-left:auto;color:#91a4be;font-size:11px}#game{width:100%}canvas{display:block;width:100%!important;height:auto!important;touch-action:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 16px 4px}.tab{background:#1d2b40;border:1px solid #41546f;border-radius:10px;padding:10px 4px;text-align:center;font-size:11px;font-weight:650}.tab.on{background:#28476b;border-color:#6286b3}.panel{padding:10px 16px}.panel h3{font-size:16px;margin:0 0 5px}.panel p{font-size:12px;line-height:1.5;color:#aebbd2;margin:0 0 10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #41546f;background:#1d2b40;color:#fff;border-radius:10px;padding:11px 8px;font:600 13px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;text-align:center;user-select:none}.btn:active{transform:scale(.98);background:#263a56}.meter{height:11px;background:#182234;border:1px solid #2d405a;border-radius:999px;overflow:hidden;margin:10px 0 6px}.meter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#55d6be,#8fd3ff);transition:width .15s}.log{background:#111a28;border:1px solid #28384f;border-radius:10px;padding:10px 11px;font-size:12px;line-height:1.5;color:#d8e1ee;min-height:42px}.tip{font-size:12px;color:#8e9bb3;line-height:1.55;padding:8px 16px 22px}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced21.html">← Advanced 21</a><b>Advanced 22</b><div id="diag">Phaser読込中…</div></div><div class="head"><div class="title">操作猶予・戦闘フィール研究</div><div class="sub">高精細HTML UIを維持したまま、アクションゲームで効く「少しだけ助ける仕組み」を4種類試す。</div></div><div class="status"><div class="card"><div class="k">MODE</div><div class="v" id="mode">コヨーテ</div></div><div class="card"><div class="k">STATE</div><div class="v" id="state">READY</div></div><div class="card"><div class="k">FPS</div><div class="v" id="fps">--</div></div></div><div class="stage"><div class="stagebar"><b>Phaserゲーム領域</b><span>固定文字なし</span></div><div id="game"></div></div><div class="tabs"><div class="tab on" data-mode="coyote">コヨーテ</div><div class="tab" data-mode="cancel">キャンセル</div><div class="tab" data-mode="lock">ロックオン</div><div class="tab" data-mode="pool">数字プール</div></div><div class="panel"><h3 id="panelTitle">① コヨーテタイム</h3><p id="panelDesc">足場から離れた直後でも、ほんの少しだけジャンプ入力を受け付ける。</p><div class="controls"><div class="btn" id="left">← 左へ</div><div class="btn" id="right">右へ →</div><div class="btn" id="action">ジャンプ</div><div class="btn" id="reset">リセット</div></div><div class="meter"><i id="meter"></i></div><div class="log" id="log">準備中…</div></div><div class="tip">読む文字はHTML/CSS、動く図形と演出はPhaser。Advanced 20以降の高精細UI標準を継続。</div></div><script>const diag=document.getElementById('diag'),modeEl=document.getElementById('mode'),stateEl=document.getElementById('state'),fpsEl=document.getElementById('fps'),titleEl=document.getElementById('panelTitle'),descEl=document.getElementById('panelDesc'),meter=document.getElementById('meter'),log=document.getElementById('log');let sceneRef=null,booted=false;const sources=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];function loadScript(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),done=false,t=setTimeout(()=>{if(!done){done=true;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!done){done=true;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){for(let i=0;i<sources.length;i++){diag.textContent=`Phaser読込 ${i+1}/3…`;try{await loadScript(sources[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">Phaser読込失敗 / 再読込してください</span>'}function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3);class Lab extends Phaser.Scene{constructor(){super('lab')}create(){sceneRef=this;this.mode='coyote';this.cameras.main.setBackgroundColor('#101722');this.fpsT=0;this.leftHeld=false;this.rightHeld=false;this.makeWorld();diag.textContent=`OK / Retina ${D}x`;this.input.on('pointerdown',p=>{if(this.mode==='lock'&&p.y<350)this.pickLock(p.x,p.y)});this.applyMode('coyote')}makeWorld(){this.objects=[];this.graphics=this.add.graphics();this.player=this.add.rectangle(90,235,28,38,0x55d6be);this.platform=this.add.rectangle(115,275,180,18,0x42536b);this.platform2=this.add.rectangle(300,250,80,18,0x42536b);this.enemies=[this.add.circle(235,205,15,0xff6b6b),this.add.circle(310,185,15,0xff9f43),this.add.circle(275,295,15,0xb16cff)];this.ring=this.add.circle(0,0,24,0xffffff,0).setStrokeStyle(2,0xffd166).setVisible(false);this.damagePool=[];for(let i=0;i<10;i++){let t=this.add.circle(-50,-50,7,0xffd166).setVisible(false);this.damagePool.push(t)}this.resetSim()}resetSim(){this.player.setPosition(90,235);this.vx=0;this.vy=0;this.grounded=true;this.coyote=0;this.attackT=0;this.cancelOpen=false;this.locked=null;this.ring.setVisible(false);this.damagePool.forEach(o=>o.setVisible(false));stateEl.textContent='READY';meter.style.width='0%';log.textContent='リセットしました'}applyMode(m){this.mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));const data={coyote:['コヨーテ','① コヨーテタイム','足場から離れた直後でも、ほんの少しだけジャンプ入力を受け付ける。','ジャンプ'],cancel:['キャンセル','② アニメーションキャンセル窓','攻撃後の短い受付時間だけ、次の行動へ素早く移れる。','攻撃 / 回避'],lock:['ロックオン','③ ターゲットロック','複数の敵から対象を選び、リングを追従させる。','次の敵へ'],pool:['数字プール','④ ダメージ表示プール','毎回作り直さず、あらかじめ用意した表示用オブジェクトを再利用する。','10連ヒット']};modeEl.textContent=data[m][0];titleEl.textContent=data[m][1];descEl.textContent=data[m][2];document.getElementById('action').textContent=data[m][3];this.resetSim()}pickLock(x,y){let best=null,bd=1e9;this.enemies.forEach(e=>{let d=Phaser.Math.Distance.Between(x,y,e.x,e.y);if(d<bd){bd=d;best=e}});if(best){this.locked=best;this.ring.setVisible(true);log.textContent='タップ位置に近い敵をロック'}}doAction(){if(this.mode==='coyote'){if(this.grounded||this.coyote>0){this.vy=-285;this.grounded=false;this.coyote=0;stateEl.textContent='JUMP';log.textContent='ジャンプ受付';}else log.textContent='ジャンプ受付外'}else if(this.mode==='cancel'){if(this.attackT<=0){this.attackT=620;this.cancelOpen=false;stateEl.textContent='ATTACK';this.tweens.add({targets:this.player,x:this.player.x+55,duration:130,yoyo:true});log.textContent='攻撃開始。中盤にキャンセル窓が開く'}else if(this.cancelOpen){this.attackT=0;this.cancelOpen=false;stateEl.textContent='CANCEL!';this.tweens.add({targets:this.player,y:this.player.y-35,duration:90,yoyo:true});log.textContent='キャンセル成功'}}else if(this.mode==='lock'){let i=this.locked?this.enemies.indexOf(this.locked):-1;this.locked=this.enemies[(i+1)%this.enemies.length];this.ring.setVisible(true);log.textContent='次の敵へロック切替'}else{let cx=260,cy=210;for(let i=0;i<10;i++){let o=this.damagePool[i];o.setPosition(cx+Phaser.Math.Between(-25,25),cy+Phaser.Math.Between(-12,12)).setVisible(true).setAlpha(1);this.tweens.killTweensOf(o);this.tweens.add({targets:o,y:o.y-55,alpha:0,duration:420+i*18,onComplete:()=>o.setVisible(false)})}stateEl.textContent='10 HIT';log.textContent='10個の表示オブジェクトを再利用'}}update(_,dt){this.fpsT+=dt;if(this.fpsT>300){fpsEl.textContent=Math.round(this.game.loop.actualFps||0);this.fpsT=0}if(this.mode==='coyote'){let ax=(this.rightHeld?1:0)-(this.leftHeld?1:0);this.vx=Phaser.Math.Linear(this.vx,ax*120,.12);this.player.x=Phaser.Math.Clamp(this.player.x+this.vx*dt/1000,20,370);this.vy+=620*dt/1000;this.player.y+=this.vy*dt/1000;let on1=this.player.x<205,on2=this.player.x>255&&this.player.x<345,groundY=on1?247:(on2?222:999);if(this.player.y>=groundY&&this.vy>=0){this.player.y=groundY;this.vy=0;this.grounded=true;this.coyote=110}else{if(this.grounded){this.grounded=false;this.coyote=110}this.coyote=Math.max(0,this.coyote-dt)}meter.style.width=`${Math.round(this.coyote/110*100)}%`;stateEl.textContent=this.grounded?'GROUND':this.coyote>0?'COYOTE':'AIR'}else if(this.mode==='cancel'){if(this.attackT>0){this.attackT-=dt;this.cancelOpen=this.attackT<390&&this.attackT>230;meter.style.width=`${this.cancelOpen?100:Math.max(0,this.attackT/620*100)}%`;if(this.cancelOpen)stateEl.textContent='CANCEL OK';else if(this.attackT<=0)stateEl.textContent='READY'}}else if(this.mode==='lock'){if(this.locked){this.ring.setPosition(this.locked.x,this.locked.y);this.ring.rotation+=dt*.004}meter.style.width=this.locked?'100%':'0%'}else meter.style.width='100%'}}new Phaser.Game({type:Phaser.AUTO,width:358,height:360,parent:'game',backgroundColor:'#101722',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Lab]});const bindHold=(id,key)=>{let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(sceneRef)sceneRef[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{if(sceneRef)sceneRef[key]=false}))};bindHold('left','leftHeld');bindHold('right','rightHeld');document.getElementById('action').onclick=()=>sceneRef?.doAction();document.getElementById('reset').onclick=()=>sceneRef?.resetSim();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>sceneRef?.applyMode(t.dataset.mode))}window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR</span>');window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR</span>');load();</script></body></html>
