<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 9</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced8.html">← Advanced 8</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('error',e=>{if(!booted)diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>'});window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.reason?.message||e.reason||'Promise')+'</span>');
function loadScript(src,label,timeout=6000){return new Promise((ok,ng)=>{const s=document.createElement('script');let done=false,t=setTimeout(()=>{if(done)return;done=true;s.remove();ng(new Error(label+' timeout'))},timeout);s.src=src;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(t);window.Phaser?ok():ng(new Error(label+' Phaser未検出'))};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);ng(new Error(label+' error'))};document.head.appendChild(s)})}async function loadPhaser(){const a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<a.length;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await loadScript(a[i][1],a[i][0]);diag.textContent=`Phaser OK (${a[i][0]}) / 起動中…`;boot();return}catch(e){console.warn(e)}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗 / 再読込してください</span>'}
function boot(){if(booted)return;booted=true;try{const DPR=Math.min(devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...s});o.setResolution?.(DPR);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 9',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,70,t,{fontSize:'22px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'12px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const ITEMS=[['破壊できる地形','destruct'],['流体っぽい粒子','fluid'],['磁石フィールド','magnet'],['音波ビジュアライザ','audioViz'],['カードスタック','cards'],['群衆フロー','crowd'],['ワームホール','wormhole'],['大当たり複合演出','jackpot']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 9',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'破壊・群衆・フィールド・複合演出 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52})}}
class Destruct extends Phaser.Scene{constructor(){super('destruct')}create(){this.cameras.main.setBackgroundColor('#101820');panel(this,'破壊できる地形','タップした場所を削って穴を開ける');const blocks=[];for(let y=0;y<10;y++)for(let x=0;x<13;x++)blocks.push(this.add.rectangle(27+x*28,190+y*28,25,25,[0x315f59,0x3f6f63,0x52796f][y%3]));this.input.on('pointerdown',p=>{if(p.y<140)return;blocks.forEach(b=>{if(b.active&&Phaser.Math.Distance.Between(p.x,p.y,b.x,b.y)<48){b.setActive(false);this.tweens.add({targets:b,scale:0,alpha:0,rotation:1,duration:250})}});this.cameras.main.shake(80,.008)});note(this,'用途例：掘削、爆発、地形破壊、穴掘りゲーム')}}
class Fluid extends Phaser.Scene{constructor(){super('fluid')}create(){this.cameras.main.setBackgroundColor('#0c1622');panel(this,'流体っぽい粒子','多数の粒子を近傍へ寄せて液体感を出す');const ps=[];for(let i=0;i<70;i++)ps.push({o:this.add.circle(130+Math.random()*130,220+Math.random()*180,5,0x55bfff,.75),vx:0,vy:0});this.events.on('update',(_,dt)=>{ps.forEach((p,i)=>{p.vy+=18*dt/1000;ps.forEach((q,j)=>{if(i===j)return;const dx=p.o.x-q.o.x,dy=p.o.y-q.o.y,d=Math.hypot(dx,dy)||1;if(d<18){p.vx+=dx/d*.04;p.vy+=dy/d*.04}});p.o.x+=p.vx;p.o.y+=p.vy;p.vx*=.985;p.vy*=.985;if(p.o.x<45||p.o.x>345)p.vx*=-.8;if(p.o.y>500){p.o.y=500;p.vy*=-.55}})});this.input.on('pointermove',p=>{if(!p.isDown)return;ps.forEach(q=>{const dx=q.o.x-p.x,dy=q.o.y-p.y,d=Math.hypot(dx,dy)||1;if(d<90){q.vx+=dx/d*2;q.vy+=dy/d*2}})});note(this,'用途例：水、スライム、煙、砂、粒子シミュレーション')}}
class Magnet extends Phaser.Scene{constructor(){super('magnet')}create(){this.cameras.main.setBackgroundColor('#16131d');panel(this,'磁石フィールド','指の位置から引力・斥力を発生');const os=[];for(let i=0;i<35;i++){const o=this.add.circle(30+Math.random()*330,170+Math.random()*330,7,[0xff6b6b,0x55d6be,0xffd166][i%3]);o.vx=0;o.vy=0;os.push(o)}let repel=false;this.input.on('pointerdown',()=>repel=!repel);this.events.on('update',()=>{const p=this.input.activePointer;os.forEach(o=>{const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1;if(d<180){const f=(1-d/180)*.45*(repel?-1:1);o.vx+=dx/d*f;o.vy+=dy/d*f}o.vx*=.97;o.vy*=.97;o.x+=o.vx;o.y+=o.vy})});note(this,'タップで ATTRACT / REPEL 切替。用途：吸引、爆風、能力範囲')}}
class AudioViz extends Phaser.Scene{constructor(){super('audioViz')}create(){this.cameras.main.setBackgroundColor('#101522');panel(this,'音波ビジュアライザ','音量データ風の値をリアルタイム描画');const g=this.add.graphics();let phase=0;this.events.on('update',(_,dt)=>{phase+=dt*.006;g.clear();for(let i=0;i<32;i++){const h=20+Math.abs(Math.sin(phase+i*.37)*Math.cos(phase*.7+i*.12))*190;g.fillStyle(Phaser.Display.Color.HSVToRGB(i/32,.7,1).color,.85).fillRect(18+i*11,430-h,7,h)}});note(this,'実際はWebAudio解析値にも接続可能。用途：音ゲー、BGM演出、メーター')}}
class Cards extends Phaser.Scene{constructor(){super('cards')}create(){this.cameras.main.setBackgroundColor('#171522');panel(this,'カードスタック','重なったカードをスワイプで飛ばす');let n=0;const spawn=()=>{const c=this.add.rectangle(195,330-n*4,210,270,[0x334155,0x475569,0x5b4d75][n%3]).setStrokeStyle(3,0xffffff,.7).setInteractive({draggable:true}).setDepth(n);this.add.text(195,330-n*4,'CARD '+(n+1),{fontSize:'24px'}).setOrigin(.5).setDepth(n+.1);this.input.setDraggable(c);c.on('drag',(p,x,y)=>{c.x=x;c.y=y;c.rotation=(x-195)*.003});c.on('dragend',()=>{if(Math.abs(c.x-195)>80)this.tweens.add({targets:c,x:c.x<195?-300:690,rotation:c.x<195?-1:1,duration:300});else this.tweens.add({targets:c,x:195,y:330-n*4,rotation:0,duration:220})});n++};for(let i=0;i<5;i++)spawn();note(this,'用途例：カードゲーム、選択UI、写真閲覧、Tinder型操作')}}
class Crowd extends Phaser.Scene{constructor(){super('crowd')}create(){this.cameras.main.setBackgroundColor('#111a18');panel(this,'群衆フロー','多数キャラが目的地へ流れつつ互いを避ける');const os=[];for(let i=0;i<45;i++){const o=this.add.circle(30+Math.random()*330,170+Math.random()*330,6,[0x55d6be,0xffd166,0x8fd3ff][i%3]);o.vx=0;o.vy=0;os.push(o)}let goal={x:195,y:330};this.input.on('pointerdown',p=>goal={x:p.x,y:p.y});this.events.on('update',()=>os.forEach((o,i)=>{let dx=goal.x-o.x,dy=goal.y-o.y,d=Math.hypot(dx,dy)||1;o.vx+=dx/d*.08;o.vy+=dy/d*.08;os.forEach((q,j)=>{if(i===j)return;const ax=o.x-q.x,ay=o.y-q.y,ad=Math.hypot(ax,ay)||1;if(ad<18){o.vx+=ax/ad*.12;o.vy+=ay/ad*.12}});o.vx*=.96;o.vy*=.96;o.x+=o.vx;o.y+=o.vy}));note(this,'タップ位置へ群衆が移動。用途：RTS、群衆、敵集団、避難シミュレーション')}}
class Wormhole extends Phaser.Scene{constructor(){super('wormhole')}create(){this.cameras.main.setBackgroundColor('#070812');panel(this,'ワームホール','回転・縮小・色変化で空間の穴を表現');const g=this.add.graphics(),stars=[];for(let i=0;i<80;i++)stars.push({a:Math.random()*6.28,r:25+Math.random()*170,s:.004+Math.random()*.012});this.events.on('update',(_,dt)=>{g.clear();stars.forEach((p,i)=>{p.a+=p.s*dt;p.r-=dt*.025;if(p.r<18)p.r=170;const x=195+Math.cos(p.a)*p.r,y=335+Math.sin(p.a)*p.r*.65,sz=1+(170-p.r)/45;g.fillStyle([0x8b5cf6,0x38bdf8,0xffffff][i%3],.85).fillCircle(x,y,sz)});for(let r=120;r>20;r-=18)g.lineStyle(3,0x8b5cf6,(130-r)/130+.15).strokeEllipse(195,335,r*2,r*.9)});note(this,'用途例：ワープ、召喚、ステージ遷移、吸い込み演出')}}
class Jackpot extends Phaser.Scene{constructor(){super('jackpot')}create(){this.cameras.main.setBackgroundColor('#160f05');panel(this,'大当たり複合演出','複数機能を同時に重ねて一つの演出へ');const title=this.add.text(195,300,'JACKPOT',{fontSize:'46px',fontStyle:'bold',color:'#ffd166'}).setOrigin(.5).setAlpha(.15),g=this.add.graphics(),btn=this.add.rectangle(195,490,210,46,0x7c2d12).setInteractive();this.add.text(195,490,'TRIGGER',{fontSize:'17px',fontStyle:'bold'}).setOrigin(.5);btn.on('pointerdown',()=>{title.setAlpha(1).setScale(.2);this.tweens.add({targets:title,scale:1.25,duration:500,ease:'Back.easeOut',yoyo:true});this.cameras.main.flash(220,255,220,90);this.cameras.main.shake(500,.015);g.clear();for(let i=0;i<55;i++){const a=Math.random()*6.28,r=40+Math.random()*170;g.fillStyle([0xffd166,0xff6b6b,0x55d6be,0xffffff][i%4],1).fillCircle(195+Math.cos(a)*r,300+Math.sin(a)*r,3+Math.random()*5)}this.time.delayedCall(700,()=>g.clear())});note(this,'Tween + Flash + Shake + Particle風 = 大当たり/勝利/報酬演出')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Destruct,Fluid,Magnet,AudioViz,Cards,Crowd,Wormhole,Jackpot]})}catch(e){booted=false;diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}loadPhaser();
</script></body></html>
