<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 15</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced14.html">← Advanced 14</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR '+String(e.message||e.error||e)+'</span>');window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR '+String(e.reason?.message||e.reason||e)+'</span>');
function ls(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}
function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 15',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,68,t,{fontSize:'21px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,100,d,{fontSize:'11px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['2000物体ストレス試験','stress2k'],['弾幕1000発試験','bullets'],['群衆500体フロー','crowd500'],['パーティクル嵐','particleStorm'],['ワールド座標・ミニマップ','minimap'],['昼夜＋天候＋照明','worldCycle'],['オートバトル集団戦','autobattle'],['スロット演出負荷試験','slotStress']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'Phaser Advanced 15',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,58,'iPhone限界探査＋複合システム 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=99;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Stress2K extends Phaser.Scene{constructor(){super('stress2k')}create(){panel(this,'2000物体ストレス試験','600が余裕だったので最大2000まで段階的に増加');this.cameras.main.setBackgroundColor('#070d15');this.items=[];this.count=200;this.info=this.add.text(20,130,'',{fontSize:'13px'});for(let i=0;i<2000;i++){let o=this.add.rectangle(Math.random()*390,155+Math.random()*350,3,3,Phaser.Display.Color.RandomRGB().color);o.vx=-1+Math.random()*2;o.vy=-1+Math.random()*2;o.visible=i<this.count;this.items.push(o)}this.add.text(195,530,'TAP +200',{fontSize:'16px',backgroundColor:'#263b58',padding:{x:18,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.count=Math.min(2000,this.count+200));this.events.on('update',()=>{for(let i=0;i<2000;i++){let o=this.items[i],on=i<this.count;o.visible=on;if(!on)continue;o.x+=o.vx;o.y+=o.vy;if(o.x<0||o.x>390)o.vx*=-1;if(o.y<150||o.y>510)o.vy*=-1}this.info.setText(`Objects ${this.count} / FPS ${Math.round(this.game.loop.actualFps)}`)});note(this,'FPS低下や操作の重さが出た数を覚えておく')}}
class Bullets extends Phaser.Scene{constructor(){super('bullets')}create(){panel(this,'弾幕1000発試験','大量の弾を毎フレーム動かすCPU＋描画試験');this.cameras.main.setBackgroundColor('#080812');this.b=[];this.count=200;this.info=this.add.text(20,130,'',{fontSize:'13px'});for(let i=0;i<1000;i++){let a=Math.random()*Math.PI*2,r=Math.random()*180,o=this.add.circle(195+Math.cos(a)*r,330+Math.sin(a)*r,2.5,i%3?0xff6b6b:0xffd166);o.a=a;o.r=r;o.sp=.004+Math.random()*.01;o.visible=i<this.count;this.b.push(o)}this.add.text(195,530,'TAP +100 BULLETS',{fontSize:'15px',backgroundColor:'#4a2635',padding:{x:15,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.count=Math.min(1000,this.count+100));this.events.on('update',()=>{for(let i=0;i<1000;i++){let o=this.b[i],on=i<this.count;o.visible=on;if(!on)continue;o.a+=o.sp;o.r+=.08;if(o.r>190)o.r=10;o.x=195+Math.cos(o.a)*o.r;o.y=330+Math.sin(o.a)*o.r}this.info.setText(`Bullets ${this.count} / FPS ${Math.round(this.game.loop.actualFps)}`)});note(this,'弾幕ゲームは「数」だけでなく判定処理を加えるとさらに重くなる')}}
class Crowd500 extends Phaser.Scene{constructor(){super('crowd500')}create(){panel(this,'群衆500体フロー','500体がタップ地点へ向かう簡易群衆シミュレーション');this.cameras.main.setBackgroundColor('#111827');this.target={x:195,y:330};this.a=[];for(let i=0;i<500;i++){let o=this.add.circle(Math.random()*390,150+Math.random()*370,2.5,i%5?0x55d6be:0xffd166);o.off=(Math.random()-.5)*100;this.a.push(o)}this.input.on('pointerdown',p=>{this.target.x=p.x;this.target.y=p.y});this.info=this.add.text(20,130,'TAPで目的地変更',{fontSize:'12px'});this.events.on('update',()=>{this.a.forEach((o,i)=>{let tx=this.target.x+Math.sin(i*2.1)*35,ty=this.target.y+Math.cos(i*1.7)*35,a=Phaser.Math.Angle.Between(o.x,o.y,tx,ty);o.x+=Math.cos(a)*.7;o.y+=Math.sin(a)*.7});this.info.setText(`Agents 500 / FPS ${Math.round(this.game.loop.actualFps)} / TAPで誘導`)});note(this,'敵軍・観客・住民など大量NPC表現の入口')}}
class ParticleStorm extends Phaser.Scene{constructor(){super('particleStorm')}create(){panel(this,'パーティクル嵐','雨・火花・煙風を同時に動かす複合描画');this.cameras.main.setBackgroundColor('#121927');this.p=[];for(let i=0;i<500;i++){let type=i%3,o=this.add.circle(Math.random()*390,145+Math.random()*390,type===0?1.5:2.5,[0x8fd3ff,0xffd166,0x94a3b8][type],type===2?.35:.8);o.type=type;o.vx=type===0?2:type===1?(Math.random()-.5)*2:.2;o.vy=type===0?7:type===1?-2-Math.random()*3:-.4-Math.random();this.p.push(o)}this.info=this.add.text(20,130,'500 particles',{fontSize:'12px'});this.events.on('update',()=>this.p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.y>550||o.y<140||o.x>400){o.x=Math.random()*390;o.y=o.type===0?145:520}}));note(this,'異なる粒子系を重ねると天候・爆発・遊技機演出へ')}}
class Minimap extends Phaser.Scene{constructor(){super('minimap')}create(){panel(this,'ワールド座標・ミニマップ','大きな世界をカメラ追従し、小窓で全体位置も表示');this.cameras.main.setBackgroundColor('#132018');this.cameras.main.setBounds(0,0,1200,900);for(let i=0;i<80;i++)this.add.circle(Math.random()*1200,Math.random()*900,8,0x315c43);let p=this.add.circle(200,250,18,0xffd166).setInteractive({draggable:true});this.input.setDraggable(p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,1180),Phaser.Math.Clamp(y,20,880)));this.cameras.main.startFollow(p,true,.08,.08);let mini=this.cameras.add(270,145,105,80).setZoom(.085).setBackgroundColor('#08120c');mini.setBounds(0,0,1200,900);mini.centerOn(600,450);note(this,'本格マップ・探索ゲームで重要な「世界」と「画面」の分離')}}
class WorldCycle extends Phaser.Scene{constructor(){super('worldCycle')}create(){panel(this,'昼夜＋天候＋照明','複数の環境システムを同時進行させる');this.cameras.main.setBackgroundColor('#4078a0');this.sun=this.add.circle(50,190,18,0xffe28a);this.stars=[];for(let i=0;i<40;i++)this.stars.push(this.add.circle(Math.random()*390,145+Math.random()*170,1.5,0xffffff,0));this.rain=[];for(let i=0;i<70;i++){let r=this.add.rectangle(Math.random()*390,150+Math.random()*390,2,10,0x9bdcff,.7);this.rain.push(r)}this.t=0;this.info=this.add.text(20,130,'',{fontSize:'12px'});this.events.on('update',(_,dt)=>{this.t=(this.t+dt*.000025)%1;let night=(1-Math.cos(this.t*Math.PI*2))*.5,rain=this.t>.55&&this.t<.78;this.sun.x=30+this.t*330;this.sun.y=270-Math.sin(this.t*Math.PI)*100;this.stars.forEach(s=>s.alpha=night*.9);this.rain.forEach(r=>{r.visible=rain;if(rain){r.y+=6;if(r.y>550)r.y=150}});let c=Phaser.Display.Color.Interpolate.ColorWithColor({r:65,g:120,b:160},{r:12,g:18,b:38},100,Math.round(night*100));this.cameras.main.setBackgroundColor(Phaser.Display.Color.GetColor(c.r,c.g,c.b));this.info.setText(`時刻 ${Math.floor(this.t*24)}時 / ${rain?'雨':'晴れ'}`)});note(this,'環境システム同士を連携させる実践例')}}
class AutoBattle extends Phaser.Scene{constructor(){super('autobattle')}create(){panel(this,'オートバトル集団戦','2チームが索敵→接近→攻撃を自動で繰り返す');this.cameras.main.setBackgroundColor('#16151c');this.units=[];for(let i=0;i<40;i++){let team=i<20?0:1,o=this.add.circle(team?300+Math.random()*60:30+Math.random()*60,180+Math.random()*320,6,team?0xff6b6b:0x55d6be);o.team=team;o.hp=3;this.units.push(o)}this.info=this.add.text(20,130,'',{fontSize:'12px'});this.events.on('update',(_,dt)=>{let alive=this.units.filter(u=>u.active);alive.forEach(u=>{let enemies=alive.filter(e=>e.team!==u.team),e=enemies.reduce((a,b)=>!a||Phaser.Math.Distance.Between(u.x,u.y,b.x,b.y)<Phaser.Math.Distance.Between(u.x,u.y,a.x,a.y)?b:a,null);if(!e)return;let d=Phaser.Math.Distance.Between(u.x,u.y,e.x,e.y);if(d>13){let a=Phaser.Math.Angle.Between(u.x,u.y,e.x,e.y);u.x+=Math.cos(a)*.35;u.y+=Math.sin(a)*.35}else if(Math.random()<dt*.0007){e.hp--;if(e.hp<=0)e.destroy()}});let a=alive.filter(u=>u.team===0).length,b=alive.filter(u=>u.team===1).length;this.info.setText(`BLUE ${a} vs RED ${b}`)});note(this,'索敵・ターゲット選択・戦闘AIを多数同時実行')}}
class SlotStress extends Phaser.Scene{constructor(){super('slotStress')}create(){panel(this,'スロット演出負荷試験','リール・光・粒子・カメラを同時に動かす遊技機向け試験');this.cameras.main.setBackgroundColor('#08070d');this.reels=[];for(let i=0;i<3;i++){let t=this.add.text(105+i*90,300,'7',{fontSize:'62px',fontStyle:'bold',color:'#ffd166'}).setOrigin(.5);this.reels.push(t)}this.fx=[];for(let i=0;i<180;i++){let o=this.add.circle(195,330,2+Math.random()*3,i%2?0xffd166:0xff5a7a,0);o.a=Math.random()*6.28;o.r=Math.random()*20;this.fx.push(o)}let btn=this.add.text(195,475,'SPIN / EFFECT',{fontSize:'17px',backgroundColor:'#5b243a',padding:{x:18,y:10}}).setOrigin(.5).setInteractive(),run=false,t=0;btn.on('pointerdown',()=>{if(run)return;run=true;t=0;this.fx.forEach(o=>o.alpha=1);this.cameras.main.flash(120,255,220,120)});this.events.on('update',(_,dt)=>{if(!run)return;t+=dt;this.reels.forEach((r,i)=>r.setText(['7','BAR','★','V'][Math.floor((t/60+i)%4)]));this.fx.forEach(o=>{o.r+=2;o.a+=.02;o.x=195+Math.cos(o.a)*o.r;o.y=330+Math.sin(o.a)*o.r;o.alpha=Math.max(0,1-o.r/260)});if(t>1200){this.reels.forEach(r=>r.setText('7'));this.cameras.main.shake(350,.018);this.cameras.main.flash(300,255,255,255);if(t>1900){run=false;this.fx.forEach(o=>{o.r=Math.random()*20;o.alpha=0})}}});note(this,'遊創舎向け：複数演出を同時実行した時の負荷を見る')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#0d1422',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Menu,Stress2K,Bullets,Crowd500,ParticleStorm,Minimap,WorldCycle,AutoBattle,SlotStress]})}load();
</script></body></html>
