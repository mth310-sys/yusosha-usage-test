<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 16</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;gap:7px;align-items:center;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px}#diag{color:#8ef0a8}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced15.html">← Advanced 15</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div><script>
const diag=document.getElementById('diag');let booted=false;window.addEventListener('error',e=>diag.innerHTML='<span class="ng">RUNTIME ERROR '+String(e.message||e.error||e)+'</span>');window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">PROMISE ERROR '+String(e.reason?.message||e.reason||e)+'</span>');
function ls(src,to=6000){return new Promise((ok,ng)=>{let s=document.createElement('script'),d=0,t=setTimeout(()=>{if(!d){d=1;s.remove();ng()}},to);s.src=src;s.onload=()=>{if(!d){d=1;clearTimeout(t);window.Phaser?ok():ng()}};s.onerror=()=>{if(!d){d=1;clearTimeout(t);ng()}};document.head.appendChild(s)})}async function load(){let a=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3: ${a[i][0]}…`;try{await ls(a[i][1]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗</span>'}
function boot(){if(booted)return;booted=true;const D=Math.min(devicePixelRatio||1,3),F='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,s={}){let o=old.call(this,x,y,t,{fontFamily:F,...s});o.setResolution?.(D);return o};const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 16',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,68,t,{fontSize:'21px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,100,d,{fontSize:'11px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);const I=[['セーブ / ロード実戦','save'],['ステージシード生成','seed'],['タッチ操作ラボ','touchlab'],['AI難易度切替','aidiff'],['演出タイムライン','timeline'],['疑似3Dダンジョン','pseudo3d'],['クエスト・進行管理','quest'],['スマホ診断モニター','device']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${D}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,30,'Phaser Advanced 16',{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,58,'実際のゲーム基盤を作る 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=99;I.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'14px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px'}).setOrigin(.5);y+=52})}}
class Save extends Phaser.Scene{constructor(){super('save')}create(){panel(this,'セーブ / ロード実戦','レベル・コイン・設定をブラウザへ保存');this.cameras.main.setBackgroundColor('#121925');this.dataObj={level:1,coins:100,sound:true};this.txt=this.add.text(195,210,'',{fontSize:'20px',align:'center'}).setOrigin(.5);const draw=()=>this.txt.setText(`LEVEL ${this.dataObj.level}\nCOIN ${this.dataObj.coins}\nSOUND ${this.dataObj.sound?'ON':'OFF'}`),b=(x,y,t,fn)=>this.add.text(x,y,t,{fontSize:'14px',backgroundColor:'#263852',padding:{x:10,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',fn);b(95,350,'育成 +1',()=>{this.dataObj.level++;this.dataObj.coins+=25;draw()});b(195,350,'SAVE',()=>{try{localStorage.setItem('yusoshaA16',JSON.stringify(this.dataObj));this.status.setText('保存しました')}catch(e){this.status.setText('保存失敗')}});b(295,350,'LOAD',()=>{try{let v=localStorage.getItem('yusoshaA16');if(v)this.dataObj=JSON.parse(v);draw();this.status.setText(v?'読込しました':'保存データなし')}catch(e){this.status.setText('読込失敗')}});b(195,410,'SOUND切替',()=>{this.dataObj.sound=!this.dataObj.sound;draw()});b(195,465,'RESET',()=>{this.dataObj={level:1,coins:100,sound:true};try{localStorage.removeItem('yusoshaA16')}catch(e){}draw();this.status.setText('初期化')});this.status=this.add.text(195,515,'',{fontSize:'12px',color:'#8ef0a8'}).setOrigin(.5);draw();note(this,'再読み込みしてLOADすると保存が残っているか確認できる')}}
class Seed extends Phaser.Scene{constructor(){super('seed')}create(){panel(this,'ステージシード生成','同じ数字なら同じマップを再現する');this.cameras.main.setBackgroundColor('#101820');this.seed=1234;this.g=this.add.graphics();this.label=this.add.text(195,135,'',{fontSize:'13px'}).setOrigin(.5);this.add.text(115,520,'別SEED',{fontSize:'15px',backgroundColor:'#30445f',padding:{x:14,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{this.seed=Phaser.Math.Between(1,99999);this.drawMap()});this.add.text(275,520,'同じSEED再生成',{fontSize:'13px',backgroundColor:'#38513c',padding:{x:10,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.drawMap());this.drawMap();note(this,'ローグライク・日替わりステージ・共有ステージに使える')}rng(){let x=this.seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}drawMap(){let r=this.rng();this.g.clear();for(let y=0;y<8;y++)for(let x=0;x<8;x++){let wall=r()<.28;this.g.fillStyle(wall?0x3d5168:0x1d2c3a,1);this.g.fillRect(43+x*38,165+y*38,34,34)}this.label.setText(`SEED : ${this.seed}`)}}
class TouchLab extends Phaser.Scene{constructor(){super('touchlab')}create(){panel(this,'タッチ操作ラボ','タップ・ドラッグ・スワイプ・長押しを1画面で判定');this.cameras.main.setBackgroundColor('#111827');this.out=this.add.text(195,180,'画面を触ってください',{fontSize:'17px',align:'center'}).setOrigin(.5);let dot=this.add.circle(195,340,25,0x55d6be).setInteractive({draggable:true});this.input.setDraggable(dot);let down=null,longTimer=null;this.input.on('pointerdown',p=>{down={x:p.x,y:p.y,t:performance.now()};longTimer=this.time.delayedCall(650,()=>this.out.setText('LONG PRESS'))});this.input.on('drag',(p,o,x,y)=>{o.setPosition(x,y);this.out.setText(`DRAG\n${Math.round(x)}, ${Math.round(y)}`)});this.input.on('pointerup',p=>{if(longTimer)longTimer.remove(false);if(!down)return;let dx=p.x-down.x,dy=p.y-down.y,dist=Math.hypot(dx,dy),dt=performance.now()-down.t;if(dist>70&&dt<700)this.out.setText(`SWIPE ${Math.abs(dx)>Math.abs(dy)?(dx>0?'RIGHT':'LEFT'):(dy>0?'DOWN':'UP')}`);else if(dt<350&&dist<20)this.out.setText('TAP');down=null});note(this,'iPhone中心なら入力方式の研究はゲーム性そのものに直結する')}}
class AIDiff extends Phaser.Scene{constructor(){super('aidiff')}create(){panel(this,'AI難易度切替','同じ敵でも反応速度と予測力で難易度を変える');this.cameras.main.setBackgroundColor('#141522');this.mode=1;this.p=this.add.circle(80,340,16,0x55d6be).setInteractive({draggable:true});this.e=this.add.circle(310,260,18,0xff6b6b);this.input.setDraggable(this.p);this.input.on('drag',(q,o,x,y)=>o.setPosition(Phaser.Math.Clamp(x,20,370),Phaser.Math.Clamp(y,160,500)));this.lbl=this.add.text(195,135,'NORMAL',{fontSize:'14px'}).setOrigin(.5);['EASY','NORMAL','HARD'].forEach((t,i)=>this.add.text(95+i*100,510,t,{fontSize:'13px',backgroundColor:'#263852',padding:{x:9,y:7}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{this.mode=i;this.lbl.setText(t)}));this.events.on('update',()=>{let speed=[.35,.75,1.25][this.mode],lead=[0,12,28][this.mode],a=Phaser.Math.Angle.Between(this.e.x,this.e.y,this.p.x+lead,this.p.y);this.e.x+=Math.cos(a)*speed;this.e.y+=Math.sin(a)*speed});note(this,'数値を変えるだけでなく「判断の賢さ」で難易度を作れる')}}
class Timeline extends Phaser.Scene{constructor(){super('timeline')}create(){panel(this,'演出タイムライン','時間軸に沿って文字・光・揺れ・図形を順番再生');this.cameras.main.setBackgroundColor('#090c13');this.title=this.add.text(195,280,'READY',{fontSize:'38px',fontStyle:'bold'}).setOrigin(.5);this.bar=this.add.rectangle(55,410,0,10,0xffd166).setOrigin(0,.5);this.btn=this.add.text(195,500,'PLAY TIMELINE',{fontSize:'16px',backgroundColor:'#51263d',padding:{x:16,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.play());this.busy=false;note(this,'演出を「時間表」として管理すると複雑なシーケンスも組みやすい')}play(){if(this.busy)return;this.busy=true;this.title.setText('START').setColor('#fff');this.bar.displayWidth=0;this.tweens.add({targets:this.bar,displayWidth:280,duration:2600,ease:'Linear'});this.time.delayedCall(400,()=>{this.title.setText('CHANCE');this.cameras.main.flash(150,255,210,100)});this.time.delayedCall(1000,()=>{this.title.setText('PUSH');this.cameras.main.shake(220,.01)});this.time.delayedCall(1700,()=>{this.title.setText('激熱').setColor('#ffd166').setScale(1.4)});this.time.delayedCall(2400,()=>{this.title.setText('BONUS').setColor('#fff');this.cameras.main.flash(350,255,255,255)});this.time.delayedCall(3200,()=>{this.title.setText('READY').setScale(1);this.bar.displayWidth=0;this.busy=false})}}
class Pseudo3D extends Phaser.Scene{constructor(){super('pseudo3d')}create(){panel(this,'疑似3Dダンジョン','2D Graphicsだけで奥行きのある通路を表現');this.cameras.main.setBackgroundColor('#05070a');this.g=this.add.graphics();this.depth=0;this.info=this.add.text(195,480,'TAP：前進',{fontSize:'15px',backgroundColor:'#26313f',padding:{x:16,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>{this.depth++;this.draw()});this.draw();note(this,'Phaserは2D中心でも遠近法で3D風表現はかなり作れる')}draw(){this.g.clear();for(let i=0;i<7;i++){let z=i/7,w=330*(1-z*.82),h=330*(1-z*.82),x=195-w/2,y=150+(330-h)/2;let c=(i+this.depth)%2?0x34495e:0x233140;this.g.lineStyle(2,c,1);this.g.strokeRect(x,y,w,h);if((i+this.depth)%3===0){this.g.fillStyle(0x7c4d58,.75);this.g.fillRect(195-w*.25,y+h*.28,w*.5,h*.44)}}}}
class Quest extends Phaser.Scene{constructor(){super('quest')}create(){panel(this,'クエスト・進行管理','条件を満たすと次の目的へ自動更新');this.cameras.main.setBackgroundColor('#151b24');this.kills=0;this.coins=0;this.stage=0;this.txt=this.add.text(195,205,'',{fontSize:'17px',align:'center',wordWrap:{width:330}}).setOrigin(.5);let btn=(x,y,t,fn)=>this.add.text(x,y,t,{fontSize:'14px',backgroundColor:'#2b3b51',padding:{x:12,y:9}}).setOrigin(.5).setInteractive().on('pointerdown',fn);btn(110,400,'敵を倒す',()=>{this.kills++;this.check()});btn(280,400,'コイン獲得',()=>{this.coins+=10;this.check()});btn(195,465,'RESET',()=>{this.kills=0;this.coins=0;this.stage=0;this.draw()});this.draw();note(this,'RPG・ミッション・実績・チュートリアルにも共通する進行管理')}check(){if(this.stage===0&&this.kills>=3)this.stage=1;if(this.stage===1&&this.coins>=30)this.stage=2;this.draw()}draw(){let q=this.stage===0?`任務1：敵を3体倒す\n${this.kills}/3`:this.stage===1?`任務2：コインを30集める\n${this.coins}/30`:`COMPLETE!\n全任務達成`;this.txt.setText(q)}}
class Device extends Phaser.Scene{constructor(){super('device')}create(){panel(this,'スマホ診断モニター','現在のブラウザ・描画・画面・FPSをリアルタイム表示');this.cameras.main.setBackgroundColor('#101722');this.txt=this.add.text(25,145,'',{fontSize:'14px',lineSpacing:8,wordWrap:{width:340}});this.samples=[];note(this,'厳密なベンチマークではなく端末実測の観察用モニター')}update(_,dt){this.samples.push(dt);if(this.samples.length>60)this.samples.shift();let avg=this.samples.reduce((a,b)=>a+b,0)/this.samples.length,fps=1000/avg,mem=(performance.memory&&performance.memory.usedJSHeapSize)?`${Math.round(performance.memory.usedJSHeapSize/1048576)} MB`:'取得不可';this.txt.setText(`Renderer : ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}\nDPR : ${devicePixelRatio||1}\nPhaser解像度係数 : ${D}\nViewport : ${innerWidth} × ${innerHeight}\nGame : 390 × 600\nTouch points : ${navigator.maxTouchPoints||0}\nFPS(概算) : ${fps.toFixed(1)}\nFrame time : ${avg.toFixed(2)} ms\nJS Memory : ${mem}\n\nUserAgent:\n${navigator.userAgent}`)}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',backgroundColor:'#0d1422',antialias:true,pixelArt:false,resolution:D,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Menu,Save,Seed,TouchLab,AIDiff,Timeline,Pseudo3D,Quest,Device]})}load();
</script></body></html>
