<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>遊創舎 Phaser Advanced 8</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0b0f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw}#top{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#172033;font-size:11px}#top a{color:#8fd3ff;text-decoration:none;background:#20304a;padding:5px 7px;border-radius:5px;white-space:nowrap}#diag{color:#8ef0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#game{width:390px;max-width:100%}canvas{display:block;width:390px!important;max-width:100%!important;height:auto!important;touch-action:none}.ng{color:#ff8f8f}</style></head>
<body><div id="wrap"><div id="top"><a href="./advanced7.html">← Advanced 7</a><div id="diag">Phaser読込中…</div></div><div id="game"></div></div>
<script>
const diag=document.getElementById('diag');let booted=false;
window.addEventListener('error',e=>{if(!booted)diag.innerHTML='<span class="ng">ERROR '+String(e.message||'unknown')+'</span>'});window.addEventListener('unhandledrejection',e=>diag.innerHTML='<span class="ng">ERROR '+String(e.reason?.message||e.reason||'Promise')+'</span>');
function loadScript(src,label,timeout=6000){return new Promise((ok,ng)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(done)return;done=true;s.remove();ng(new Error(label+' timeout'))},timeout);s.src=src;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(timer);window.Phaser?ok():ng(new Error(label+' Phaser未検出'))};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);ng(new Error(label+' error'))};document.head.appendChild(s)})}
async function loadPhaser(){const sources=[['jsDelivr','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'],['cdnjs','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js'],['unpkg','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']];for(let i=0;i<sources.length;i++){const [name,url]=sources[i];diag.textContent=`Phaser読込 ${i+1}/3: ${name}…`;try{await loadScript(url,name);diag.textContent=`Phaser OK (${name}) / 起動中…`;boot();return}catch(e){console.warn(e)}}diag.innerHTML='<span class="ng">ERROR Phaser読込失敗 / 再読込してください</span>'}
function boot(){if(booted)return;booted=true;try{const DPR=Math.min(window.devicePixelRatio||1,3),FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';const old=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,t,st={}){const o=old.call(this,x,y,t,{fontFamily:FONT,...st});o.setResolution?.(DPR);return o};
const panel=(s,t,d)=>{s.add.text(18,18,'← Advanced 8',{fontSize:'15px',color:'#8fd3ff',backgroundColor:'#1d2a3f',padding:{x:8,y:6}}).setInteractive().on('pointerdown',()=>s.scene.start('menu')).setDepth(1000);s.add.text(195,70,t,{fontSize:'23px',fontStyle:'bold'}).setOrigin(.5);s.add.text(195,103,d,{fontSize:'13px',color:'#c8d0df',align:'center',wordWrap:{width:350}}).setOrigin(.5)};const note=(s,t)=>s.add.text(195,565,t,{fontSize:'11px',color:'#8e9bb3',align:'center',wordWrap:{width:350}}).setOrigin(.5);
const ITEMS=[['経路探索','pathfind'],['視野判定','los'],['ロープ / チェーン','rope'],['疑似3Dロード','road3d'],['軌道・重力','orbit'],['Procedural Terrain','terrain'],['Dissolve演出','dissolve'],['Screen Glitch','glitch']];
class Menu extends Phaser.Scene{constructor(){super('menu')}create(){diag.textContent=`OK / Retina ${DPR}x / ${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'}`;this.cameras.main.setBackgroundColor('#0d1422');this.add.text(195,31,'Phaser Advanced 8',{fontSize:'24px',fontStyle:'bold'}).setOrigin(.5);this.add.text(195,59,'経路・視野・疑似3D・画面効果 8種類',{fontSize:'12px',color:'#aebbd2'}).setOrigin(.5);let y=100;ITEMS.forEach(([n,k])=>{this.add.rectangle(195,y,340,42,0x202d43).setStrokeStyle(1,0x526580).setInteractive().on('pointerdown',()=>this.scene.start(k));this.add.text(34,y,n,{fontSize:'15px'}).setOrigin(0,.5);this.add.text(350,y,'›',{fontSize:'20px',color:'#91a6c8'}).setOrigin(.5);y+=52});this.add.text(195,540,'Advanced 8 / 8機能',{fontSize:'11px',color:'#71809b'}).setOrigin(.5)}}
class Pathfind extends Phaser.Scene{constructor(){super('pathfind')}create(){this.cameras.main.setBackgroundColor('#111923');panel(this,'経路探索','壁を避けて目的地まで最短ルートを探す');const C=8,R=8,S=38,OX=43,OY=165;let walls=new Set(['2,1','2,2','2,3','4,4','5,4','6,4','5,6']);const cells=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){const key=x+','+y,c=this.add.rectangle(OX+x*S,OY+y*S,32,32,walls.has(key)?0x39465a:0x1d2a3f).setInteractive();c.gx=x;c.gy=y;cells.push(c)}const actor=this.add.circle(OX,OY,11,0xffd166).setDepth(5);const route=this.add.graphics();const bfs=(sx,sy,tx,ty)=>{const q=[[sx,sy]],prev=new Map([[sx+','+sy,null]]);while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx>=0&&ny>=0&&nx<C&&ny<R&&!walls.has(k)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny])}})}const end=tx+','+ty;if(!prev.has(end))return[];let p=[tx,ty],out=[];while(p){out.push(p);p=prev.get(p[0]+','+p[1])}return out.reverse()};cells.forEach(c=>c.on('pointerdown',()=>{const path=bfs(Math.round((actor.x-OX)/S),Math.round((actor.y-OY)/S),c.gx,c.gy);if(!path.length)return;route.clear().lineStyle(4,0x55d6be,.8).beginPath();path.forEach((p,i)=>{const x=OX+p[0]*S,y=OY+p[1]*S;i?route.lineTo(x,y):route.moveTo(x,y)});route.strokePath();const pts=path.slice(1).map(p=>({x:OX+p[0]*S,y:OY+p[1]*S}));const go=()=>{const p=pts.shift();if(!p)return;this.tweens.add({targets:actor,x:p.x,y:p.y,duration:130,onComplete:go})};go()}));note(this,'用途例：敵AI、ダンジョン、NPC移動、タクティクス')}}
class LOS extends Phaser.Scene{constructor(){super('los')}create(){this.cameras.main.setBackgroundColor('#16181f');panel(this,'視野判定','角度と遮蔽物で「見えているか」を判定');const guard=this.add.triangle(105,330,-20,-14,22,0,-20,14,0x55d6be),player=this.add.circle(300,330,18,0xffd166).setInteractive({draggable:true}),wall=this.add.rectangle(200,300,40,170,0x475569);this.input.setDraggable(player);this.input.on('drag',(p,o,x,y)=>o.setPosition(x,y));const cone=this.add.graphics(),tx=this.add.text(195,480,'HIDDEN',{fontSize:'22px'}).setOrigin(.5);this.events.on('update',()=>{const ang=Phaser.Math.Angle.Between(guard.x,guard.y,player.x,player.y),dist=Phaser.Math.Distance.Between(guard.x,guard.y,player.x,player.y);const facing=0,diff=Math.abs(Phaser.Math.Angle.Wrap(ang-facing));const blocked=Phaser.Geom.Intersects.LineToRectangle(new Phaser.Geom.Line(guard.x,guard.y,player.x,player.y),wall.getBounds());const seen=dist<230&&diff<.62&&!blocked;cone.clear().fillStyle(seen?0x55d6be:0xff6b6b,.13).slice(guard.x,guard.y,225,-.62,.62,false).fillPath();tx.setText(seen?'VISIBLE':'HIDDEN').setColor(seen?'#8ef0a8':'#ff8f8f')});note(this,'用途例：ステルス、敵索敵、監視カメラ、視界')}}
class Rope extends Phaser.Scene{constructor(){super('rope')}create(){this.cameras.main.setBackgroundColor('#141822');panel(this,'ロープ / チェーン','複数点を距離拘束して柔らかい鎖を作る');const pts=[];for(let i=0;i<14;i++)pts.push({x:195,y:165+i*24,px:195,py:165+i*24});const g=this.add.graphics(),ball=this.add.circle(195,490,24,0xffd166);let drag=false;ball.setInteractive();ball.on('pointerdown',()=>drag=true);this.input.on('pointerup',()=>drag=false);this.input.on('pointermove',p=>{if(drag){pts[pts.length-1].x=p.x;pts[pts.length-1].y=p.y}});this.events.on('update',()=>{for(let k=0;k<4;k++){for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,err=(d-24)/d*.5;if(i>1){a.x+=dx*err;a.y+=dy*err}b.x-=dx*err;b.y-=dy*err}}pts[0].x=195;pts[0].y=165;for(let i=1;i<pts.length;i++){const p=pts[i],vx=(p.x-p.px)*.98,vy=(p.y-p.py)*.98+.55;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy}ball.setPosition(pts.at(-1).x,pts.at(-1).y);g.clear().lineStyle(5,0x8fd3ff,.7).beginPath().moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>g.lineTo(p.x,p.y));g.strokePath()});note(this,'用途例：鎖、ケーブル、尻尾、吊り橋、クレーン')}}
class Road3D extends Phaser.Scene{constructor(){super('road3d')}create(){this.cameras.main.setBackgroundColor('#8ac0e8');panel(this,'疑似3Dロード','遠近法だけで3Dっぽい道路を作る');const g=this.add.graphics();let off=0;this.events.on('update',(_,dt)=>{off=(off+dt*.12)%40;g.clear().fillStyle(0x355e3b).fillRect(0,130,390,390).fillStyle(0x30343b).fillTriangle(55,520,335,520,210,170).fillTriangle(55,520,210,170,180,170);for(let i=0;i<15;i++){const z=(i*40+off)%600,t=z/600,y=185+(1-t)*335,w=4+(1-t)*22;g.fillStyle(i%2?0xffffff:0xffd166).fillRect(195-w/2,y,w,12)}});note(this,'用途例：レース、奥行き背景、トンネル、擬似3D演出')}}
class Orbit extends Phaser.Scene{constructor(){super('orbit')}create(){this.cameras.main.setBackgroundColor('#080d18');panel(this,'軌道・重力','中心へ引く力で惑星風の軌道を作る');const sun=this.add.circle(195,330,28,0xffd166),objs=[];for(let i=0;i<7;i++){const o=this.add.circle(195+70+i*16,330,6+i%3,[0x55d6be,0x4ea5d9,0xff6b6b][i%3]);o.vx=0;o.vy=65+7*i;objs.push(o)}const tr=this.add.graphics();this.events.on('update',(_,dt)=>{tr.clear().lineStyle(1,0x8fd3ff,.12);objs.forEach(o=>{const dx=sun.x-o.x,dy=sun.y-o.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,a=180000/d2;o.vx+=dx/d*a*dt/1000;o.vy+=dy/d*a*dt/1000;o.x+=o.vx*dt/1000;o.y+=o.vy*dt/1000;tr.strokeCircle(o.x,o.y,2)})});note(this,'用途例：惑星、吸引、重力井戸、軌道演出')}}
class Terrain extends Phaser.Scene{constructor(){super('terrain')}create(){this.cameras.main.setBackgroundColor('#111923');panel(this,'Procedural Terrain','乱数と平滑化で地形を自動生成');const g=this.add.graphics();const draw=()=>{let h=330,arr=[];for(let x=0;x<=390;x+=10){h+=Phaser.Math.Between(-18,18);h=Phaser.Math.Clamp(h,230,430);arr.push([x,h])}for(let k=0;k<3;k++)arr=arr.map((p,i,a)=>[p[0],i===0||i===a.length-1?p[1]:(a[i-1][1]+p[1]+a[i+1][1])/3]);g.clear().fillStyle(0x315f59).beginPath().moveTo(0,520);arr.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(390,520).closePath().fillPath().lineStyle(3,0x8ef0a8,.8).beginPath().moveTo(arr[0][0],arr[0][1]);arr.slice(1).forEach(p=>g.lineTo(p[0],p[1]));g.strokePath()};draw();this.add.rectangle(195,500,170,38,0x293852).setInteractive().on('pointerdown',draw);this.add.text(195,500,'REGENERATE',{fontSize:'13px'}).setOrigin(.5);note(this,'用途例：地形、波、山、洞窟、ランダム背景')}}
class Dissolve extends Phaser.Scene{constructor(){super('dissolve')}create(){this.cameras.main.setBackgroundColor('#18141d');panel(this,'Dissolve演出','小片に分解して消える表現を画像なしで作る');const bits=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++)bits.push(this.add.rectangle(120+x*22,230+y*22,18,18,[0x55d6be,0x4ea5d9,0xa78bfa][(x+y)%3]));const reset=()=>bits.forEach((b,i)=>b.setPosition(120+(i%8)*22,230+Math.floor(i/8)*22).setAlpha(1).setScale(1));this.add.rectangle(195,500,180,42,0x293852).setInteractive().on('pointerdown',()=>{bits.forEach((b,i)=>this.tweens.add({targets:b,x:b.x+Phaser.Math.Between(-90,90),y:b.y+Phaser.Math.Between(-150,80),alpha:0,scale:.1,angle:Phaser.Math.Between(-180,180),delay:i*8,duration:650,onComplete:i===bits.length-1?reset:undefined}))});this.add.text(195,500,'DISSOLVE',{fontSize:'14px'}).setOrigin(.5);note(this,'用途例：消滅、撃破、変身、転送、カード演出')}}
class Glitch extends Phaser.Scene{constructor(){super('glitch')}create(){this.cameras.main.setBackgroundColor('#0b1018');panel(this,'Screen Glitch','画面の一部をズラしてノイズ感を作る');const base=[];for(let i=0;i<13;i++)base.push(this.add.rectangle(195,165+i*26,270,20,[0x1d4ed8,0x7c3aed,0x0891b2][i%3],.6));const tx=this.add.text(195,360,'SYSTEM',{fontSize:'42px',fontStyle:'bold'}).setOrigin(.5);let active=false;this.add.rectangle(195,500,180,42,0x293852).setInteractive().on('pointerdown',()=>{active=true;this.time.delayedCall(1000,()=>active=false)});this.add.text(195,500,'GLITCH',{fontSize:'14px'}).setOrigin(.5);this.events.on('update',()=>{if(active){base.forEach((b,i)=>b.x=195+Phaser.Math.Between(-30,30));tx.x=195+Phaser.Math.Between(-10,10);tx.setTint(Phaser.Display.Color.RandomRGB().color)}else{base.forEach(b=>b.x+=(195-b.x)*.25);tx.x+=(195-tx.x)*.25;tx.clearTint()}});note(this,'用途例：故障、ホラー、通信障害、激アツ煽り、画面破壊')}}
new Phaser.Game({type:Phaser.AUTO,width:390,height:600,parent:'game',resolution:DPR,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY,width:390,height:600},scene:[Menu,Pathfind,LOS,Rope,Road3D,Orbit,Terrain,Dissolve,Glitch]});}catch(e){booted=false;diag.innerHTML='<span class="ng">ERROR 起動失敗: '+String(e.message||e)+'</span>';console.error(e)}}loadPhaser();
</script></body></html>
