<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>遊創舎 Phaser Advanced 26</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#070910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}#wrap{width:390px;max-width:100vw;min-height:100vh}#top{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#151927;border-bottom:1px solid #30374d;font-size:14px}#top a{color:#8fd3ff;text-decoration:none}#diag{margin-left:auto;font-size:12px;color:#8ef0a8}.head{padding:14px 16px 10px}.title{font-size:22px;font-weight:750}.sub{font-size:14px;color:#b8c3d8;margin-top:5px;line-height:1.5}.stage{margin:0 16px;border-radius:14px;overflow:hidden;border:1px solid #34405a;background:#080b12}.stagebar{display:flex;padding:9px 11px;background:#151b29}.stagebar b{font-size:14px}.stagebar span{margin-left:auto;font-size:12px;color:#9eabc2}canvas{display:block;width:100%!important;height:auto!important;touch-action:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 16px 5px}.tab,.btn{border:1px solid #46536d;background:#1b2639;color:#fff;border-radius:10px;text-align:center;user-select:none}.tab{padding:11px 2px;font-size:12px;font-weight:650}.tab.on{background:#344b70;border-color:#7ca0d0}.panel{padding:10px 16px}.panel h3{font-size:17px;margin:0 0 6px}.panel p{font-size:14px;line-height:1.5;color:#b8c3d8;margin:0 0 10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:12px 8px;font:650 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.btn:active{transform:scale(.98)}.wide{grid-column:1/3}.log{margin-top:9px;background:#111725;border:1px solid #2d3850;border-radius:10px;padding:10px 11px;font-size:14px;line-height:1.45;color:#dbe3ef}.tip{padding:5px 16px 22px;font-size:13px;line-height:1.55;color:#9ca9bf}.ng{color:#ff8f8f}</style></head><body><div id="wrap"><div id="top"><a href="./advanced25.html">← Advanced 25</a><b>Advanced 26</b><div id="diag">Phaser読込中…</div></div><div class="head"><div class="title">Visual / Effect Lab 02</div><div class="sub">持続する演出と重ね合わせを研究。炎・煙・残像・光線を、外部画像なしでその場生成する。</div></div><div class="stage"><div class="stagebar"><b>Phaser演出領域</b><span>タップ位置に発動</span></div><div id="game"></div></div><div class="tabs"><div class="tab on" data-mode="fire">炎</div><div class="tab" data-mode="smoke">煙</div><div class="tab" data-mode="trail">残像</div><div class="tab" data-mode="beam">光線</div></div><div class="panel"><h3 id="ttl">① 炎・燃焼</h3><p id="desc">暖色の発光粒子を高速で上昇させ、縮小・揺らぎを重ねて炎らしく見せる。</p><div class="controls"><div class="btn wide" id="play">演出を発動</div><div class="btn" id="weak">標準</div><div class="btn" id="strong">強</div></div><div class="log" id="log">強度：標準 / 画面をタップしても発動できます</div></div><div class="tip">固定UIはHTML/CSS。Phaser側ではBlend Mode・Tween・Graphics・カメラを組み合わせている。</div></div><script>const diag=document.getElementById('diag'),ttl=document.getElementById('ttl'),desc=document.getElementById('desc'),log=document.getElementById('log');let S=null,booted=false,intensity=1;const src=['https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'];function one(u){return new Promise((ok,no)=>{let s=document.createElement('script'),done=0,t=setTimeout(()=>{if(!done){done=1;s.remove();no()}},6000);s.src=u;s.onload=()=>{if(!done){done=1;clearTimeout(t);window.Phaser?ok():no()}};s.onerror=()=>{if(!done){done=1;clearTimeout(t);no()}};document.head.appendChild(s)})}async function load(){for(let i=0;i<3;i++){diag.textContent=`Phaser読込 ${i+1}/3…`;try{await one(src[i]);boot();return}catch(e){}}diag.innerHTML='<span class="ng">読込失敗 / 再読込してください</span>'}function boot(){if(booted)return;booted=1;const D=Math.min(devicePixelRatio||1,3);class FX extends Phaser.Scene{create(){S=this;this.mode='fire';this.cameras.main.setBackgroundColor('#060911');this.add.rectangle(179,170,310,230,0x101827).setStrokeStyle(1,0x26344d);this.anchor=this.add.circle(179,205,11,0xffffff,.25);this.input.on('pointerdown',p=>{if(p.y>35&&p.y<330)this.play(p.x,p.y)});diag.textContent=`OK / Retina ${D}x`}fire(x,y,k){for(let i=0;i<34*k;i++){let c=[0xff3b1f,0xff8a24,0xffd166,0xffffff][Phaser.Math.Between(0,3)],o=this.add.circle(x+Phaser.Math.Between(-18,18),y+Phaser.Math.Between(-4,10),Phaser.Math.Between(4,10),c,.75).setBlendMode(Phaser.BlendModes.ADD),tx=o.x+Phaser.Math.Between(-24,24),ty=y-Phaser.Math.Between(55,130)*k;this.tweens.add({targets:o,x:tx,y:ty,scaleX:.25,scaleY:1.6,alpha:0,duration:Phaser.Math.Between(380,760),ease:'Sine.easeOut',delay:Phaser.Math.Between(0,180),onComplete:()=>o.destroy()})}let glow=this.add.circle(x,y,34,0xff5c22,.18).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:glow,scale:2.2*k,alpha:0,duration:650,onComplete:()=>glow.destroy()})}smoke(x,y,k){for(let i=0;i<20*k;i++){let r=Phaser.Math.Between(9,20),c=[0x5f6673,0x777f8d,0x999faa][Phaser.Math.Between(0,2)],o=this.add.circle(x+Phaser.Math.Between(-18,18),y+Phaser.Math.Between(-8,8),r,c,.22);this.tweens.add({targets:o,x:o.x+Phaser.Math.Between(-55,55),y:o.y-Phaser.Math.Between(50,125)*k,scale:Phaser.Math.FloatBetween(1.8,3.2),alpha:0,duration:Phaser.Math.Between(900,1500),ease:'Sine.easeOut',delay:Phaser.Math.Between(0,160),onComplete:()=>o.destroy()})}}trail(x,y,k){let ghost=[];for(let i=0;i<10*k;i++){let o=this.add.rectangle(x,y,26,42,0x55d6be,.38-(i/(10*k))*.25).setBlendMode(Phaser.BlendModes.ADD);ghost.push(o);this.tweens.add({targets:o,x:x+150*k,y:y+Math.sin(i*.8)*45,alpha:0,rotation:.25,duration:420+i*35,ease:'Cubic.easeOut',delay:i*22,onComplete:()=>o.destroy()})}let head=this.add.rectangle(x,y,28,44,0xffffff,.9).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:head,x:x+155*k,duration:360,ease:'Cubic.easeInOut',onComplete:()=>head.destroy()});this.cameras.main.shake(70,.003*k)}beam(x,y,k){let endX=x<179?335:25,dx=endX-x,dy=Phaser.Math.Between(-45,45),len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx);let core=this.add.rectangle(x,y,len,5*k,0xffffff,.95).setOrigin(0,.5).setRotation(ang).setBlendMode(Phaser.BlendModes.ADD);let glow=this.add.rectangle(x,y,len,16*k,0x55c8ff,.25).setOrigin(0,.5).setRotation(ang).setBlendMode(Phaser.BlendModes.ADD);core.scaleX=0;glow.scaleX=0;this.tweens.add({targets:[core,glow],scaleX:1,duration:120,ease:'Cubic.easeOut',onComplete:()=>this.time.delayedCall(120,()=>this.tweens.add({targets:[core,glow],alpha:0,scaleY:.2,duration:220,onComplete:()=>{core.destroy();glow.destroy()}}))});for(let i=0;i<18*k;i++){let t=Math.random(),o=this.add.circle(x+dx*t,y+dy*t,Phaser.Math.Between(2,5),0x8fd3ff,.8).setBlendMode(Phaser.BlendModes.ADD);this.tweens.add({targets:o,y:o.y+Phaser.Math.Between(-35,35),alpha:0,duration:420,onComplete:()=>o.destroy()})}this.cameras.main.flash(70,120,210,255,false)}play(x=179,y=205){let k=intensity===2?2:1;if(this.mode==='fire')this.fire(x,y,k);if(this.mode==='smoke')this.smoke(x,y,k);if(this.mode==='trail')this.trail(x,y,k);if(this.mode==='beam')this.beam(x,y,k)}}new Phaser.Game({type:Phaser.AUTO,width:358,height:340,parent:'game',backgroundColor:'#060911',resolution:D,antialias:true,pixelArt:false,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[FX]});document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(!S)return;S.mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));const d={fire:['① 炎・燃焼','暖色の発光粒子を高速で上昇させ、縮小・揺らぎを重ねて炎らしく見せる。'],smoke:['② 煙・霧','半透明の粒子をゆっくり拡散・拡大させ、炎とは逆に重く残る空気感を作る。'],trail:['③ 残像・高速移動','同じ形を時間差で複製し、透明度と位置をずらして高速移動の残像を作る。'],beam:['④ 光線・レーザー','コア光と外側グローを重ね、伸長Tweenと飛散粒子で一瞬の強い光線を作る。']}[S.mode];ttl.textContent=d[0];desc.textContent=d[1];log.textContent=`強度：${intensity===2?'強':'標準'} / 画面をタップしても発動できます`});document.getElementById('play').onclick=()=>S?.play();document.getElementById('weak').onclick=()=>{intensity=1;log.textContent='強度：標準'};document.getElementById('strong').onclick=()=>{intensity=2;log.textContent='強度：強（量・距離・発光を増加）'}}window.addEventListener('error',()=>diag.innerHTML='<span class="ng">RUNTIME ERROR</span>');window.addEventListener('unhandledrejection',()=>diag.innerHTML='<span class="ng">PROMISE ERROR</span>');load();</script></body></html>
