  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>パチスロ ルパン三世～消されたルパン～ BODY INTEGRATION</title>

  <link rel="stylesheet" href="./body-fit.css?v=5">
  <link rel="stylesheet" href="./system-integration.css?v=1">
</head>
<body>
<main class="body-lab">
  <section class="machine-stage f9-frame">
    <div class="f9-cabinet machine" id="cabinet" aria-label="パチスロ ルパン三世 消されたルパン">
      <div class="f9-black-body"></div>
      <div class="f9-frame-layer"><div class="f9-inner-spine"></div></div>
      <div class="f9-parts-layer">
        <section class="f9-top-unit">
          <div class="f9-top-speaker left"></div><div class="f9-top-speaker right"></div>
          <div class="f9-gold-crown"></div><div class="f9-gold-mesh left"></div><div class="f9-gold-mesh center"></div>
          <div class="f9-dot-ornament" id="dotOrnament" aria-hidden="true"><i class="f9-ornament-panel p-left-upper"></i><i class="f9-ornament-panel p-left-mid"></i><i class="f9-ornament-panel p-left-lower"></i><i class="f9-ornament-panel p-top"></i><i class="f9-ornament-panel p-right-upper"></i><i class="f9-ornament-panel p-right-lower"></i><i class="f9-ornament-panel p-bottom"></i><i class="f9-ornament-ring"></i></div>
          <div class="upper-micro-led-layer led-mode-2" id="upperMicroLedLayer" aria-hidden="true"></div>
          <div class="f9-dot-circle"><div class="f9-dot-grid" id="dotGrid"></div><div class="f9-ring" id="ring"></div></div>
          <div class="f9-reel-box" id="reelBox" aria-label="上部3リール"><div class="f9-reel" data-reel="0"><span>7</span></div><div class="f9-reel" data-reel="1"><span>★</span></div><div class="f9-reel" data-reel="2"><span>7</span></div></div>
          <div class="upper-led-pattern-controls" id="upperLedPatternControls" aria-label="上部LED発光パターン"><button type="button" data-pattern="1">1</button><button type="button" data-pattern="2">2</button><button type="button" data-pattern="3">3</button><button type="button" data-pattern="4">4</button><button type="button" data-pattern="5">5</button><button type="button" data-pattern="6">6</button><button type="button" data-pattern="7">7</button><button type="button" data-pattern="8">8</button><button type="button" data-pattern="9">9</button><button type="button" data-pattern="10">10</button></div>
        </section>
        <section class="f9-main-display lcd-shell">
          <div class="f9-screen"><div id="game" class="body-game-host" aria-label="Main LCD"></div><div class="body-game-glass" aria-hidden="true"></div></div>
        </section>
        <section class="f9-deck control-deck">
          <div class="f9-deck-lip"></div>
          <div class="f9-left-controls">
            <button type="button" class="f9-maxbet" id="maxBetBtn" aria-label="MAX BET"></button>
            <button type="button" class="f9-start-lever start" id="startBtn" aria-label="START"><i class="f9-lever-stem"></i><i class="f9-lever-knob"></i></button>
          </div>
          <div class="f9-stops stop-row"><button type="button" class="f9-stop stop" data-stop="0" data-reel="0" aria-label="STOP LEFT"></button><button type="button" class="f9-stop stop" data-stop="1" data-reel="1" aria-label="STOP CENTER"></button><button type="button" class="f9-stop stop" data-stop="2" data-reel="2" aria-label="STOP RIGHT"></button></div>
          <button id="betBtn" type="button" class="system-bet-proxy" aria-label="BET">BET</button>
        </section>
        <section class="f9-lower"><div class="f9-lower-led left"></div><div class="f9-lower-frame"><div class="f9-lower-art"><div class="f9-art-glow"></div></div></div><div class="f9-lower-led right"></div></section>
      </div>
      <div class="f9-shell-layer"><div class="f9-shoulder left"><i></i><b></b></div><div class="f9-shoulder right"><i></i><b></b></div><div class="f9-mid-shell left"><i></i><b></b></div><div class="f9-mid-shell right"><i></i><b></b></div><div class="f9-waist left"></div><div class="f9-waist right"></div><div class="f9-lower-shell left"><i></i></div><div class="f9-lower-shell right"><i></i></div><div id="prismMechanism" class="prism-mechanism" data-state="closed"></div></div>
      <button type="button" id="sideToggle" class="body-side-toggle">SIDE OPEN</button>
      <div class="system-bridge" aria-live="polite"><span id="phaseBadge">SYSTEM</span><span id="creditValue">50</span><span id="betValue">0</span><span id="stateValue">IDLE</span><span id="message">BETしてSTART</span></div>
    </div>
  </section>
</main>
