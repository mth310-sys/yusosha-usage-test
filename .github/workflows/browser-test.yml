name: Browser Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Lupin B4 module syntax
        run: |
          set -e
          for f in test_lupin_b4/js/*.js; do
            echo "CHECK $f"
            node --input-type=module --check < "$f"
          done
      - name: Check Lupin ZERO module syntax
        run: |
          set -e
          for f in test_lupin_zero/src/*.js; do
            echo "CHECK $f"
            node --input-type=module --check < "$f"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
