name: Browser Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lupin-b4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
