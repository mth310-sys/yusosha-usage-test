<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>YUSOSHA Usage Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">YUSOSHA / GitHub Integration</p>
      <h1>Usage Test Lab</h1>
      <p class="lead">通常Chatから、構成設計・複数ファイル実装・更新まで行う実運用テスト。</p>
    </header>

    <section class="panel" aria-labelledby="counter-title">
      <div class="panel-head">
        <div><p class="panel-kicker">INTERACTIVE TEST</p><h2 id="counter-title">Counter</h2></div>
        <span id="stateBadge" class="badge" aria-live="polite">READY</span>
      </div>

      <div id="count" class="count" aria-live="polite">0</div>

      <div class="button-grid">
        <button id="addOne" class="btn btn-primary" type="button">+1</button>
        <button id="addTen" class="btn" type="button">+10</button>
        <button id="subtractOne" class="btn" type="button">−1</button>
        <button id="reset" class="btn btn-danger" type="button">RESET</button>
      </div>

      <div class="step-tool" aria-labelledby="step-title">
        <div><span class="tool-label" id="step-title">CUSTOM STEP</span><strong id="stepValue">5</strong></div>
        <input id="stepRange" type="range" min="1" max="25" value="5" aria-label="カスタム増減値">
        <div class="step-actions">
          <button id="subtractStep" class="btn btn-small" type="button">− STEP</button>
          <button id="addStep" class="btn btn-small" type="button">+ STEP</button>
        </div>
      </div>

      <div class="stats" aria-label="操作統計">
        <div><span>操作回数</span><strong id="actionCount">0</strong></div>
        <div><span>最大値</span><strong id="maxCount">0</strong></div>
      </div>

      <div class="history-wrap">
        <div class="history-head"><h3>History</h3><button id="clearHistory" class="text-btn" type="button">履歴を消す</button></div>
        <ol id="history" class="history"><li>まだ操作はありません</li></ol>
      </div>
    </section>

    <footer><p>Repository: yusosha-usage-test</p></footer>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
