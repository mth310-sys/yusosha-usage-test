<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>遊創舎 試験機F7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lab">
<header class="lab-head">
  <div><small>YUSOSHA PERFORMANCE TEST</small><h1>試験機 F7</h1></div>
  <button id="fullLoad" class="load-btn" type="button">FULL LOAD</button>
</header>

<section class="metrics" aria-label="負荷計測">
  <div><span>FPS</span><strong id="fps">--</strong></div>
  <div><span>Frame</span><strong id="frameMs">-- ms</strong></div>
  <div><span>DOM</span><strong id="domCount">--</strong></div>
  <div><span>LongTask</span><strong id="longTasks">0</strong></div>
  <div><span>Input</span><strong id="inputLag">-- ms</strong></div>
  <div><span>Mode</span><strong id="mode">NORMAL</strong></div>
</section>

<section class="machine-wrap">
<div id="machine" class="machine" aria-label="F7高精細パチスロ試験機">

<div class="display-window"><div class="display-grid"></div><div id="displayText" class="display-text">F7<br><span>PERFORMANCE TEST</span></div><div id="bonusMeter" class="bonus-meter" hidden><b>BONUS</b><span><strong id="bonusGet">0</strong> / 240</span></div></div>
<div class="reel-window" aria-label="3リール"><div class="payline"></div><div class="reel" data-reel="0"></div><div class="reel" data-reel="1"></div><div class="reel" data-reel="2"></div></div>
<div id="message" class="message">READY</div>
<div class="bet-row"><span>BET</span><strong id="bet">0</strong><button id="maxBet" type="button">MAX BET</button><span>PAY</span><strong id="payout">0</strong><span>CREDIT</span><strong id="credit">99</strong></div>
<div class="control-row"><button id="start" class="start" type="button">START</button><button class="stop" data-stop="0" type="button">STOP</button><button class="stop" data-stop="1" type="button">STOP</button><button class="stop" data-stop="2" type="button">STOP</button></div>
<div class="lower-panel"><div class="lower-core">F7<br><span>HIGH DETAIL / FULL LED</span></div></div>
<div class="edge-led edge-left"></div><div class="edge-led edge-right"></div><div class="bezel-led display-led"></div><div class="bezel-led reel-led"></div><div class="deck-led"></div><div class="bottom-led"></div>
</div>
</section>
<section class="test-controls"><button id="ledToggle" type="button">LED ON/OFF</button><button id="displayLoad" type="button">DISPLAY LOAD</button><button id="reelLoad" type="button">REELS LOAD</button><button id="resetTest" type="button">RESET</button></section>
<p class="note">通常小役は払い出し0枚。7・7・7でBONUS。BONUS中は入賞ごとに3枚、獲得240枚で終了。FULL LOADは描画負荷試験を継続。</p>
</main>
<script src="main.js"></script>

</html>
