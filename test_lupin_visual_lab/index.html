<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>遊創舎 ルパン外観研究機</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lab">
<header class="lab-head">
  <div><small>YUSOSHA LUPIN VISUAL LAB</small><h1>ルパン外観研究機</h1></div>
  <button id="fullLoad" class="load-btn" type="button">FULL LOAD</button>
</header>
<section class="metrics" aria-label="負荷計測">
  <div><span>FPS</span><strong id="fps">--</strong></div><div><span>Frame</span><strong id="frameMs">-- ms</strong></div><div><span>DOM</span><strong id="domCount">--</strong></div>
  <div><span>LongTask</span><strong id="longTasks">0</strong></div><div><span>Input</span><strong id="inputLag">-- ms</strong></div><div><span>Mode</span><strong id="mode">NORMAL</strong></div>
</section>
<section class="machine-wrap">
<div id="machine" class="machine lupin-shell-v1" aria-label="ルパン筐体外周シルエット試験機">
<svg class="shell-svg" viewBox="0 0 390 600" preserveAspectRatio="none" aria-hidden="true">
<defs>
 <linearGradient id="lpChrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24272a"/><stop offset=".13" stop-color="#f4f4ef"/><stop offset=".29" stop-color="#777b7e"/><stop offset=".48" stop-color="#deded8"/><stop offset=".67" stop-color="#484b4d"/><stop offset=".84" stop-color="#f8f7ef"/><stop offset="1" stop-color="#252729"/></linearGradient>
 <linearGradient id="lpDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b2c2d"/><stop offset=".5" stop-color="#050505"/><stop offset="1" stop-color="#1a1b1c"/></linearGradient>
 <linearGradient id="lpWarm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c57d"/><stop offset=".38" stop-color="#5c4927"/><stop offset=".72" stop-color="#e7d49c"/><stop offset="1" stop-color="#332615"/></linearGradient>
 <radialGradient id="lpLamp"><stop stop-color="#fffde8"/><stop offset=".28" stop-color="#f6efcf"/><stop offset=".72" stop-color="#d5caa8"/><stop offset="1" stop-color="#81765e"/></radialGradient>
</defs>
<!-- black central chassis -->
<path d="M42 4H348L370 28V568L346 598H44L20 568V30Z" fill="url(#lpDark)"/>
<!-- upper shoulder armor: outward at crown, pinched beside display -->
<path d="M5 20L45 2L90 10L73 72L57 117L63 206L42 237L14 217L3 148Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<path d="M385 20L345 2L300 10L317 72L333 117L327 206L348 237L376 217L387 148Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<!-- display-side armor -->
<path d="M10 202L48 216L66 250L59 329L39 354L9 337L1 268Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<path d="M380 202L342 216L324 250L331 329L351 354L381 337L389 268Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<!-- console joints, deliberately projecting -->
<path d="M5 330L47 344L76 370L64 421L34 438L3 417Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<path d="M385 330L343 344L314 370L326 421L356 438L387 417Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<!-- lower armor wraps lower visual panel -->
<path d="M5 415L37 431L62 461L58 555L35 592L6 567Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<path d="M385 415L353 431L328 461L332 555L355 592L384 567Z" fill="url(#lpChrome)" stroke="#111" stroke-width="2"/>
<!-- warm inner trims -->
<path d="M47 17L73 22L60 105L52 195L34 201L28 139Z" fill="url(#lpWarm)" opacity=".78"/>
<path d="M343 17L317 22L330 105L338 195L356 201L362 139Z" fill="url(#lpWarm)" opacity=".78"/>
<!-- side 3-lamp housings: two blocks per side -->
<g fill="#111" stroke="url(#lpChrome)" stroke-width="4">
 <path d="M10 70L58 58L60 196L15 210Z"/><path d="M10 215L58 208L59 337L13 346Z"/>
 <path d="M380 70L332 58L330 196L375 210Z"/><path d="M380 215L332 208L331 337L377 346Z"/>
</g>
<g fill="url(#lpLamp)" stroke="#756d59" stroke-width="2">
 <circle cx="36" cy="91" r="17"/><circle cx="37" cy="133" r="17"/><circle cx="38" cy="175" r="17"/>
 <circle cx="36" cy="239" r="17"/><circle cx="37" cy="280" r="17"/><circle cx="38" cy="321" r="17"/>
 <circle cx="354" cy="91" r="17"/><circle cx="353" cy="133" r="17"/><circle cx="352" cy="175" r="17"/>
 <circle cx="354" cy="239" r="17"/><circle cx="353" cy="280" r="17"/><circle cx="352" cy="321" r="17"/>
</g>
<!-- asymmetrical crown mechanism placeholder -->
<circle cx="116" cy="65" r="48" fill="#090909" stroke="url(#lpWarm)" stroke-width="10"/>
<circle cx="116" cy="65" r="35" fill="none" stroke="url(#lpChrome)" stroke-width="5"/>
<path d="M169 17H286L312 43L296 96L178 91L154 58Z" fill="#111" stroke="url(#lpChrome)" stroke-width="5"/>
<!-- structural bezels -->
<path d="M66 119L324 119L335 142L326 260L307 278H83L64 260L55 142Z" fill="none" stroke="url(#lpChrome)" stroke-width="7"/>
<path d="M76 286L314 286L326 310L315 361L298 374H92L75 361L64 310Z" fill="none" stroke="url(#lpChrome)" stroke-width="7"/>
<!-- forward control console -->
<path d="M50 376L83 350H307L340 376L320 431L284 444H106L70 431Z" fill="url(#lpDark)" stroke="url(#lpChrome)" stroke-width="6"/>
<path d="M106 379H284L301 397L285 427H105L89 397Z" fill="url(#lpChrome)" opacity=".9"/>
<!-- lower panel frame -->
<path d="M62 447L82 432H308L328 447L322 565L304 580H86L68 565Z" fill="none" stroke="url(#lpChrome)" stroke-width="7"/>
</svg>
<div class="display-window"><div class="display-grid"></div><div id="displayText" class="display-text">LUPIN<br><span>SILHOUETTE STUDY V1</span></div><div id="bonusMeter" class="bonus-meter" hidden><b>BONUS</b><span><strong id="bonusGet">0</strong> / 240</span></div></div>
<div class="reel-window" aria-label="3リール"><div class="payline"></div><div class="reel" data-reel="0"></div><div class="reel" data-reel="1"></div><div class="reel" data-reel="2"></div></div>
<div id="message" class="message">SHELL STUDY V1</div>
<div class="bet-row"><span>BET</span><strong id="bet">0</strong><button id="maxBet" type="button">MAX BET</button><span>PAY</span><strong id="payout">0</strong><span>CREDIT</span><strong id="credit">99</strong></div>
<div class="control-row"><button id="start" class="start" type="button">START</button><button class="stop" data-stop="0" type="button">STOP</button><button class="stop" data-stop="1" type="button">STOP</button><button class="stop" data-stop="2" type="button">STOP</button></div>
<div class="lower-panel"><div class="lower-core">LUPIN<br><span>CABINET STRUCTURE STUDY</span></div></div>
<div class="edge-led edge-left"></div><div class="edge-led edge-right"></div><div class="bezel-led display-led"></div><div class="bezel-led reel-led"></div><div class="deck-led"></div><div class="bottom-led"></div>
</div></section>
<section class="test-controls"><button id="ledToggle" type="button">LED ON/OFF</button><button id="displayLoad" type="button">DISPLAY LOAD</button><button id="reelLoad" type="button">REELS LOAD</button><button id="resetTest" type="button">RESET</button></section>
<p class="note">外周シルエット試験1号。中央機能領域は維持し、上部肩装甲・左右ランプハウジング・液晶側装甲・操作卓接合部・下部装甲を独立形状として検証する。</p>
</main>
<script src="main.js"></script><script src="motion.js"></script><script src="rotation.js"></script><script src="logger.js"></script>
</body></html>
